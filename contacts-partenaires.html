<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/img/logo03lrf.png">
  <title>Contacts partenaires — LE ROY FACTORY CRM</title>
  <link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/layout.css"><link rel="stylesheet" href="assets/css/clients.css">
  <style>
    body.crm-body{background:#FBF9F5!important;color:#1A2530!important}.crm-topbar{background-image:url('assets/img/bandeau02.png')!important;background-size:cover!important;border-bottom:2px solid #D4AF37!important;color:#fff!important}.crm-topbar h1,.crm-topbar p{color:#fff!important;text-shadow:0 1px 4px rgba(0,0,0,.9)}
    .contacts-toolbar{display:flex;gap:.7rem;flex-wrap:wrap;margin:1.2rem 0}.contacts-toolbar input,.contacts-toolbar select{padding:.7rem .85rem;border:1px solid #d9d3c6;border-radius:9px;background:#fff;min-width:220px}.partners-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1rem;padding-bottom:2rem}.partner-card{background:#fff;border:1px solid #e4ded2;border-radius:14px;padding:1rem;box-shadow:0 3px 14px rgba(0,0,0,.04)}.partner-head{display:flex;align-items:center;gap:.9rem;padding-bottom:.8rem;border-bottom:1px solid #eee8dc}.partner-logo{width:92px;height:52px;object-fit:contain;background:#fff}.partner-head h2{font-size:1.05rem;margin:0}.contact{padding:.85rem 0;border-bottom:1px solid #f0ece4}.contact:last-child{border-bottom:0}.contact-name{font-weight:900}.contact-role{font-size:.78rem;color:#6b7280;margin:.18rem 0 .5rem}.contact-actions{display:flex;gap:.45rem;flex-wrap:wrap}.contact-actions a{display:inline-flex;align-items:center;gap:.35rem;padding:.48rem .62rem;border-radius:8px;text-decoration:none;font-size:.78rem;font-weight:800;border:1px solid #ded7ca;color:#1A2530;background:#fff}.contact-actions a:hover{border-color:#D4AF37;color:#8a6800}.empty{color:#8a8173;font-size:.82rem;padding:.8rem 0}.count{font-size:.75rem;color:#6b7280;margin-top:.15rem}@media(max-width:700px){.partners-grid{grid-template-columns:1fr}.contacts-toolbar input,.contacts-toolbar select{width:100%;min-width:0}}
  </style>
</head>
<body class="crm-body">
  <aside class="crm-sidebar"><div class="sidebar-brand"><a href="index.html" class="logo-link"><div class="logo-circle" style="width:60px;height:60px;border-radius:50%;overflow:hidden;border:2px solid #D4AF37;background:#000"><img src="assets/img/logo03lrf.png" style="width:100%;height:100%;object-fit:cover" alt="LRF"></div></a></div><ul class="sidebar-menu"><li><a href="dashboard.html"><span class="icon">🏠</span><span class="menu-text">Accueil</span></a></li><li><a href="clients.html"><span class="icon">👥</span><span class="menu-text">Clients</span></a></li><li><a href="demandes-clients.html"><span class="icon">🧾</span><span class="menu-text">Demandes clients</span></a></li><li><a href="agenda.html"><span class="icon">📅</span><span class="menu-text">Agenda</span></a></li><li><a href="comptes-rendus.html"><span class="icon">📞</span><span class="menu-text">Comptes-rendus</span></a></li><li><a href="mails-groupes.html"><span class="icon">✉️</span><span class="menu-text">Mails groupés</span></a></li><li><a href="contacts-partenaires.html" class="active"><span class="icon">🏭</span><span class="menu-text">Contacts partenaires</span></a></li><li><a href="carte.html"><span class="icon">🗺</span><span class="menu-text">Carte</span></a></li></ul><div class="sidebar-footer"><button id="logout-btn" class="btn-logout-sidebar">🚪 <span class="menu-text">Déconnexion</span></button></div></aside>
  <main class="crm-main-content"><div class="crm-topbar"><div class="welcome-box"><h1>Contacts partenaires</h1><p>Annuaire usine : commerciaux, commandes, SAV et logistique.</p></div></div><div class="contacts-toolbar"><input id="partner-search" placeholder="Rechercher une usine ou un contact…"><select id="role-filter"><option value="">Tous les services</option><option value="commercial">Commercial</option><option value="commande">Commandes</option><option value="sav">SAV</option><option value="logistique">Logistique</option><option value="export">Export</option></select></div><div id="partners-grid" class="partners-grid"></div></main>
  <script type="module">
    import { PARTNER_CONTACTS } from './assets/js/partner-contacts.js?v=20260901-1';
    if(!localStorage.getItem('agentLoggedIn')) location.href='agent.html';
    document.getElementById('logout-btn')?.addEventListener('click',()=>{localStorage.removeItem('agentLoggedIn');location.href='agent.html'});
    const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const telHref=v=>'tel:'+String(v||'').replace(/[^+\d]/g,'');
    const search=document.getElementById('partner-search'),role=document.getElementById('role-filter'),grid=document.getElementById('partners-grid');
    function render(){const q=search.value.trim().toLowerCase(),rf=role.value;grid.innerHTML=Object.entries(PARTNER_CONTACTS).map(([name,data])=>{let contacts=(data.contacts||[]).filter(c=>{const hay=[name,c.name,c.role,c.email,c.phone].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;if(rf&&!String(c.role||'').toLowerCase().includes(rf))return false;return true});if((q||rf)&&!contacts.length)return'';return `<section class="partner-card"><div class="partner-head"><img class="partner-logo" src="${esc(data.logo||'')}" alt="${esc(name)}" onerror="this.style.display='none'"><div><h2>${esc(name)}</h2><div class="count">${contacts.length} contact${contacts.length>1?'s':''}</div></div></div>${contacts.length?contacts.map(c=>`<div class="contact"><div class="contact-name">${esc(c.name)}</div>${c.role?`<div class="contact-role">${esc(c.role)}</div>`:''}<div class="contact-actions">${c.email?`<a href="mailto:${esc(c.email)}">✉ ${esc(c.email)}</a>`:''}${c.phone?`<a href="${telHref(c.phone)}">📞 ${esc(c.phone)}</a>`:''}</div></div>`).join(''):'<div class="empty">Aucune coordonnée confirmée pour le moment.</div>'}</section>`}).join('')||'<div class="empty">Aucun contact correspondant.</div>'}
    search.addEventListener('input',render);role.addEventListener('change',render);render();
  </script>
</body></html>
