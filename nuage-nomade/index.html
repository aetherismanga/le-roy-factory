<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuage Nomade</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#18a8f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nuage Nomade">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>html,body{margin:0;width:100%;height:100%;background:#caf2ff;font-family:system-ui}#boot{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#8fe1ff,#e7faff);color:#075c9c;font-weight:900;text-align:center}#boot img{width:112px;height:112px;margin-bottom:14px}</style>
</head><body><div id="boot"><div><img src="./icon.svg"><div>Nuage Nomade</div><div style="font-size:14px;margin-top:8px">Chargement…</div></div></div>
<script>
const parts=["./parts/part-000.txt","./parts/part-001.txt","./parts/part-002.txt","./parts/part-003.txt","./parts/part-004.txt","./parts/part-005.txt","./parts/part-006.txt","./parts/part-007.txt","./parts/part-008.txt","./parts/part-009.txt","./parts/part-010.txt"];
(async()=>{try{
 if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{});
 const texts=[];for(const p of parts){const r=await fetch(p,{cache:'force-cache'});if(!r.ok)throw new Error(p+' '+r.status);texts.push(await r.text());}
 document.open();document.write(texts.join(''));document.close();
}catch(e){document.getElementById('boot').innerHTML='<div style="padding:24px">Erreur de chargement.<br><small>'+String(e)+'</small><br><br><button onclick="location.reload()">Réessayer</button></div>';}})();
</script></body></html>
