<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#171717">
  <title>Catalogue KOIBATH interactif 2025 | LE ROY FACTORY</title>
  <link rel="icon" type="image/png" href="assets/img/logo03lrf.png">
  <link rel="stylesheet" href="assets/css/koibath-interactive.css?v=20261012-1">
</head>
<body>
  <header class="kb-header">
    <a class="kb-brand" href="catalogues.html" aria-label="Retour aux catalogues LE ROY FACTORY">
      <img src="assets/img/logo03lrf.png" alt="LE ROY FACTORY">
      <span><strong>Catalogue interactif</strong><small>KOIBATH - Meubles de salle de bain 2025</small></span>
    </a>
    <div class="kb-header-actions">
      <img src="assets/img/koibath.png" alt="KOIBATH" class="kb-koibath-logo">
      <a href="catalogues.html">Quitter</a>
    </div>
  </header>

  <div class="kb-toolbar" aria-label="Commandes du catalogue">
    <button type="button" id="previous-page" aria-label="Page précédente">‹</button>
    <label>Page <input id="page-input" inputmode="numeric" value="1" aria-label="Numéro de page"> <span id="page-total">/ 103</span></label>
    <button type="button" id="next-page" aria-label="Page suivante">›</button>
    <span class="kb-toolbar-spacer"></span>
    <button type="button" id="zoom-out" aria-label="Réduire">−</button>
    <output id="zoom-value">100 %</output>
    <button type="button" id="zoom-in" aria-label="Agrandir">+</button>
  </div>

  <nav class="kb-lexicon" aria-label="Lexique des collections KOIBATH">
    <div class="kb-lexicon-title"><strong>Lexique</strong><small>Cliquez sur une collection</small></div>
    <div id="collection-bar" class="kb-collection-bar"></div>
  </nav>

  <main>
    <div class="kb-help"><span></span>Sélectionnez une collection dans le lexique pour accéder directement à sa première page.</div>
    <section id="catalogue-pages" class="kb-pages" aria-label="Catalogue KOIBATH"></section>
  </main>

  <div id="loading" class="kb-loading" role="status">
    <i></i>
    <strong>Chargement du catalogue KOIBATH…</strong>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="assets/js/koibath-interactive.js?v=20261012-1"></script>
</body>
</html>
