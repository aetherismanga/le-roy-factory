<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disponibilité Biopietra — LE ROY FACTORY</title><style>body{margin:0;background:#fbfaf7;color:#211f1b;font-family:Arial,sans-serif}.head{background:#0d0d0d;color:#fff;border-bottom:3px solid #d4af37;padding:22px 76px 22px 24px;position:relative}.head small{color:#d4af37;font-weight:900;letter-spacing:.12em}.head h1{margin:7px 0 0;font-size:clamp(1.7rem,6vw,2.5rem)}.close{position:absolute;right:16px;top:16px;width:52px;height:52px;border-radius:50%;border:1.5px solid #d4af37;background:#111;color:#fff;font-size:1.8rem}.wrap{max-width:820px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ded7ca;border-radius:18px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-weight:800;color:#6b6257}input,textarea{box-sizing:border-box;width:100%;padding:14px;border:1px solid #d8d0c2;border-radius:12px;font:inherit;background:#fff}textarea{min-height:110px}.summary{background:#f6f1e6;border:1px solid #ddcf9d}.summary strong{display:block;margin-bottom:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{padding:15px;border-radius:12px;font-weight:900;font-size:1rem;cursor:pointer}.preview{background:#fff;border:1.5px solid #176b43;color:#176b43}.send{background:#176b43;border:1.5px solid #176b43;color:#fff}.previewbox{white-space:pre-wrap;display:none;margin-top:14px;padding:14px;background:#f4f7f4;border-radius:12px}.previewbox.open{display:block}@media(max-width:650px){.grid,.actions{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{padding:14px}.head{padding-left:18px}}</style></head><body><header class="head"><small>BIOPIETRA · LE ROY FACTORY</small><h1>Demande de disponibilité</h1><button class="close" onclick="history.back()" aria-label="Retour">×</button></header><main class="wrap"><section class="card summary"><strong id="summaryTitle"></strong><div id="summaryMeta"></div></section><section class="card"><div class="grid"><div class="field"><label>Produit</label><input id="product" readonly></div><div class="field"><label>Référence</label><input id="ref" readonly></div><div class="field"><label>Unité</label><input id="unit" readonly></div><div class="field"><label>Besoin</label><input id="qty" inputmode="decimal" placeholder="Ex. 24"></div><div class="field"><label>Société</label><input id="company" placeholder="Nom du magasin / client"></div><div class="field"><label>Contact</label><input id="contact" placeholder="Nom du contact"></div><div class="field full"><label>Observation</label><textarea id="note" placeholder="Ajoutez ici une précision éventuelle"></textarea></div></div></section><section class="card"><div class="actions"><button class="btn preview" id="previewBtn">Aperçu du message</button><button class="btn send" id="sendBtn">Envoyer la demande</button></div><div id="previewBox" class="previewbox"></div></section></main><script>const p=new URLSearchParams(location.search),g=id=>document.getElementById(id);['product','ref','unit'].forEach(id=>g(id).value=p.get(id)||'');g('summaryTitle').textContent=(p.get('product')||'Biopietra')+' · '+(p.get('ref')||'');g('summaryMeta').textContent='Prix PRO : '+(p.get('price')||'—')+' / '+(p.get('unit')||'unité');function msg(){return `Bonjour,\n\nMerci de nous confirmer la disponibilité du produit Biopietra suivant :\n\nProduit : ${g('product').value}\nRéférence : ${g('ref').value}\nBesoin : ${g('qty').value||'à préciser'} ${g('unit').value}\nSociété : ${g('company').value||'—'}\nContact : ${g('contact').value||'—'}\nObservation : ${g('note').value||'—'}\n\nMerci d'avance pour votre retour.`}g('previewBtn').onclick=()=>{g('previewBox').textContent=msg();g('previewBox').classList.add('open')};g('sendBtn').onclick=()=>{location.href='mailto:info@biopietra.com?cc='+encodeURIComponent('jerome@leroyfactory.fr,coryne@leroyfactory.fr')+'&subject='+encodeURIComponent('Demande disponibilité Biopietra - '+g('ref').value)+'&body='+encodeURIComponent(msg())};</script></body></html>
