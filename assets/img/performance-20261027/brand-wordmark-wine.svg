<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="t d">
  <title id="t">LE ROY factory — lie de vin</title>
  <desc id="d">Version lie-de-vin en dégradé et relief du logo LE ROY factory.</desc>
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0B7C8"/>
      <stop offset="0.10" stop-color="#B85A78"/>
      <stop offset="0.28" stop-color="#8B294B"/>
      <stop offset="0.50" stop-color="#5F102D"/>
      <stop offset="0.68" stop-color="#7B183B"/>
      <stop offset="0.84" stop-color="#3E071C"/>
      <stop offset="1" stop-color="#9D3A5C"/>
    </linearGradient>
    <linearGradient id="wineShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A0A21"/>
      <stop offset="0.30" stop-color="#A84768"/>
      <stop offset="0.50" stop-color="#F0B7C8"/>
      <stop offset="0.68" stop-color="#8B294B"/>
      <stop offset="1" stop-color="#3A0619"/>
    </linearGradient>
    <filter id="wineRelief" x="-25%" y="-35%" width="150%" height="175%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="shadowBlur"/>
      <feOffset in="shadowBlur" dx="0" dy="4" result="shadowOffset"/>
      <feFlood flood-color="#26000F" flood-opacity="0.55" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowOffset" operator="in" result="shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="glowBlur"/>
      <feFlood flood-color="#D87997" flood-opacity="0.28" result="glowColor"/>
      <feComposite in="glowColor" in2="glowBlur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#wineRelief)">
    <text x="380" y="118" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="106" font-weight="400" letter-spacing="13" fill="url(#wine)" stroke="#3C071B" stroke-width="1.25">LE ROY</text>
    <text x="380" y="116.5" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="106" font-weight="400" letter-spacing="13" fill="none" stroke="#F5D2DD" stroke-opacity="0.48" stroke-width="0.55">LE ROY</text>
    <rect x="108" y="164" width="176" height="2.4" rx="1.2" fill="url(#wineShine)"/>
    <rect x="476" y="164" width="176" height="2.4" rx="1.2" fill="url(#wineShine)"/>
    <text x="380" y="187" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="400" letter-spacing="17" fill="url(#wine)">factory</text>
  </g>
</svg>