<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo LRF">
  <defs>
    <radialGradient id="black" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="0.48" stop-color="#101010"/>
      <stop offset="1" stop-color="#020202"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b4300"/>
      <stop offset="0.12" stop-color="#f7b319"/>
      <stop offset="0.25" stop-color="#fff0a1"/>
      <stop offset="0.39" stop-color="#d98700"/>
      <stop offset="0.55" stop-color="#ffcb3a"/>
      <stop offset="0.69" stop-color="#fff4ad"/>
      <stop offset="0.83" stop-color="#d17800"/>
      <stop offset="1" stop-color="#6b3900"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8c7"/>
      <stop offset="0.16" stop-color="#ffd45a"/>
      <stop offset="0.48" stop-color="#b96800"/>
      <stop offset="0.72" stop-color="#ffca37"/>
      <stop offset="1" stop-color="#7f4600"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- fond extérieur transparent -->
  <circle cx="256" cy="256" r="234" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="221" fill="#6c3b00"/>
  <circle cx="256" cy="256" r="213" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="199" fill="url(#black)" stroke="#1a1105" stroke-width="3"/>
  <circle cx="256" cy="256" r="207" fill="none" stroke="#ffd764" stroke-width="2" opacity="0.9"/>
  <circle cx="256" cy="256" r="227" fill="none" stroke="#ffe590" stroke-width="2" opacity="0.75"/>

  <!-- monogramme -->
  <g filter="url(#shadow)" font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="url(#goldBright)" stroke="#7b4200" stroke-width="2.2" paint-order="stroke fill">
    <text x="128" y="330" font-size="286">L</text>
    <text x="205" y="370" font-size="258">R</text>
    <text x="294" y="401" font-size="225">F</text>
  </g>

  <!-- fines lumières métalliques -->
  <path d="M79 167 A199 199 0 0 1 421 126" fill="none" stroke="#fff6ba" stroke-width="3" opacity="0.65" stroke-linecap="round"/>
  <path d="M93 378 A199 199 0 0 0 416 373" fill="none" stroke="#c06b00" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
</svg>