  <title>Validation première commande BILT — LE ROY FACTORY</title>
  <style>
    :root{--green:#0c5736;--gold:#d4af37;--ink:#18232d;--muted:#6b736f;--line:#e2dccf}*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:var(--ink);font-family:Inter,Arial,sans-serif}.head{background:#10261e;color:#fff;border-bottom:3px solid var(--gold)}.headin{max-width:1050px;margin:auto;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}.head img{height:55px}.head strong{font-size:1.05rem}.shell{max-width:1050px;margin:28px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 45px rgba(42,34,19,.1);overflow:hidden}.hero{background:linear-gradient(120deg,#083c28,#0c5736);color:#fff;padding:24px}.hero h1{margin:0 0 7px;font-size:clamp(1.6rem,4vw,2.5rem)}.hero p{margin:0;opacity:.9}.body{padding:22px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.metric{background:#f8f6f0;border:1px solid #ece5d8;border-radius:11px;padding:11px}.metric span{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;font-weight:900}.metric strong{display:block;margin-top:5px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:9px;border-bottom:1px solid #ece7dd;text-align:left;font-size:.82rem}.table th{background:#f3f0e8;color:#59635f;text-transform:uppercase;font-size:.69rem}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.choice{border-radius:13px;padding:18px 12px;border:2px solid #d8d1c4;background:#fff;cursor:pointer;text-align:center}.choice:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.08)}.choice strong{display:block;font-size:1.35rem;margin-bottom:5px}.choice.zero{border-color:#9da5a0}.choice.five{border-color:#d7b33c;background:#fffaf0}.choice.ten{border-color:#0c5736;background:#f0f8f3}.choice small{color:var(--muted)}.note{margin-top:16px;padding:12px;border-radius:10px;background:#fff7d9;border:1px solid #e5cf82;color:#6c5210;font-size:.82rem}.status{text-align:center;padding:45px 20px}.status h2{margin:8px 0}.spinner{width:34px;height:34px;border:3px solid #ddd;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}@keyframes spin{to{transform:rotate(360deg)}}.confirm{display:none;position:fixed;inset:0;background:rgba(7,13,10,.7);z-index:50;align-items:center;justify-content:center;padding:15px}.confirm.open{display:flex}.dialog{max-width:460px;width:100%;background:#fff;border-radius:16px;padding:22px}.dialog h2{margin-top:0}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.btn{border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}.cancel{background:#fff;border:1px solid #ccc}.validate{background:#111;color:#f2cf60;border:1px solid #9e7b10}.validate:disabled{opacity:.5}@media(max-width:720px){.summary{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}.headin{padding:12px}.head img{height:44px}.body{padding:14px}}
  </style>
</head>
<body>
  <header class="head"><div class="headin"><div><strong>LE ROY FACTORY · Validation BILT</strong><div style="font-size:.75rem;opacity:.8">Lien sécurisé première commande</div></div><img src="assets/img/bilt.png" alt="BILT"></div></header>
  <main class="shell"><section class="card"><div class="hero"><h1>Première commande BILT</h1><p>Choisissez l’éventuelle remise exceptionnelle LRF avant l’envoi à BILT.</p></div><div id="content" class="status"><div class="spinner"></div><h2>Chargement de la commande…</h2></div></section></main>

</html>
