name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'assets/**'
      - '*.html'
      - 'data/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lrf-android-debug-keystore-v1

      - name: Ensure stable Android signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Le Roy Factory,C=FR" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Create Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync CRM and native plugins
        working-directory: mobile
        run: npm run cap:sync

      - name: Set Android version
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('mobile/android/app/build.gradle')
          s=p.read_text()
          run=int(os.environ.get('GITHUB_RUN_NUMBER','1'))
          s=re.sub(r'versionCode\s+\d+', f'versionCode {run}', s)
          s=re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run}"', s)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: le-roy-factory-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
