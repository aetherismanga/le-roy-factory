name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'assets/**'
      - '*.html'
      - 'data/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lrf-android-debug-keystore-v1

      - name: Ensure stable Android signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Le Roy Factory,C=FR" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Create Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync CRM and native plugins
        working-directory: mobile
        run: npm run cap:sync

      - name: Apply official LRF splash and launcher icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          source = Path('assets/brand-v2/assetlogorond.png')
          res = Path('mobile/android/app/src/main/res')
          drawable = res / 'drawable-nodpi'
          drawable.mkdir(parents=True, exist_ok=True)

          logo = Image.open(source).convert('RGBA')
          logo.save(drawable / 'lrf_launcher.png', optimize=True)

          # Remplace toutes les images de splash générées par Capacitor.
          for splash in res.rglob('splash.png'):
              try:
                  old = Image.open(splash)
                  w, h = old.size
                  canvas = Image.new('RGBA', (w, h), (11, 11, 11, 255))
                  target = max(1, int(min(w, h) * 0.46))
                  mark = logo.copy()
                  mark.thumbnail((target, target), Image.Resampling.LANCZOS)
                  x = (w - mark.width) // 2
                  y = (h - mark.height) // 2
                  canvas.alpha_composite(mark, (x, y))
                  canvas.convert('RGB').save(splash, quality=95)
              except Exception as exc:
                  print(f'Warning splash {splash}: {exc}')

          manifest = Path('mobile/android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/lrf_launcher"', s, count=1)
          if 'android:roundIcon=' in s:
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/lrf_launcher"', s, count=1)
          else:
              s = s.replace('<application', '<application android:roundIcon="@drawable/lrf_launcher"', 1)
          manifest.write_text(s)

          # Android 12+ : si Capacitor a créé les propriétés de splash système,
          # on force le nouveau logo vert et le fond noir.
          for styles in res.rglob('styles.xml'):
              text = styles.read_text()
              text = re.sub(
                  r'(<item\s+name="(?:android:)?windowSplashScreenAnimatedIcon">).*?(</item>)',
                  r'\1@drawable/lrf_launcher\2', text
              )
              text = re.sub(
                  r'(<item\s+name="(?:android:)?windowSplashScreenBackground">).*?(</item>)',
                  r'\1#0b0b0b\2', text
              )
              styles.write_text(text)
          PY

      - name: Set Android version
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('mobile/android/app/build.gradle')
          s=p.read_text()
          run=int(os.environ.get('GITHUB_RUN_NUMBER','1'))
          s=re.sub(r'versionCode\s+\d+', f'versionCode {run}', s)
          s=re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run}"', s)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: le-roy-factory-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
