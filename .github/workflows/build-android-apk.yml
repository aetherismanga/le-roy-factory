name: Android quality (no publication)
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', '.github/workflows/build-android-apk.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Tests, lint and debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-qa-only
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/reports/
          retention-days: 14
# Release signing is local only. No keystore, passwords or release upload in GitHub.
