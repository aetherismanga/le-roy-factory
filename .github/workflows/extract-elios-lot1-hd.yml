name: Extract Elios Lot 1 HD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-elios-lot1-hd.yml'

permissions:
  contents: write

jobs:
  extract-hd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Download official Elios images without recompression
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import hashlib, io, json, re, time
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          ROOT = Path('.')
          BASE = 'https://eliosceramica.com'
          OUTROOT = ROOT / 'assets' / 'img' / 'elios'

          CONFIG = {
            'domus': {
              'url': f'{BASE}/collezione/domus/',
              'colors': ['Canyon Rust','Forest Green','Clay Red','Sandstone Beige','Ocean Blue','Moon White','Sunset Rose'],
            },
            'montreal': {
              'url': f'{BASE}/collezione/montreal/',
              'colors': ['White','Taupe','Grey','Beige','Dark'],
            },
            'allure': {
              'url': f'{BASE}/collezione/allure/',
              'colors': ['Blossom','Blueberry','Oyster','Snow','Juniper','Fenix Juniper','Safari','Fenix Blueberry','Eden'],
            },
            'creta': {
              'url': f'{BASE}/collezione/creta/',
              'colors': ['Zucchero','Matcha','Avena','Biscotto','Caramello','Ginepro','Coccio','Pepe','Malto'],
            },
            'deco': {
              'url': f'{BASE}/collezione/deco/',
              'colors': ['White','Black','Grey','Taupe','Light Blue','Nordic Green','Décors'],
            },
            'segmento': {
              'url': f'{BASE}/collezione/segmento/',
              'colors': ['Albus','Coelestis','Amaryllis','Rubens','Caerlueus','Nigrum','Viridisis','Flavus','Lapis','Nox','Duplex A','Duplex B','Duplex C','Duplex D','Duplex E','Duplex F'],
            },
          }

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          s = requests.Session()
          s.headers.update({'User-Agent': UA, 'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8'})

          def get(url, binary=False, attempts=5):
            last = None
            for n in range(attempts):
              try:
                r = s.get(url, timeout=45, allow_redirects=True, headers={'Referer': BASE + '/'})
                if r.status_code == 200:
                  return r.content if binary else r.text
                last = RuntimeError(f'{url}: HTTP {r.status_code}')
              except Exception as e:
                last = e
              time.sleep(2 + n * 2)
            raise last or RuntimeError(f'Failed: {url}')

          def norm(s):
            return re.sub(r'[^a-z0-9]+', ' ', str(s).lower()).strip()

          def color_aliases(color):
            c = norm(color)
            vals = {c, c.replace(' ', '')}
            # Common web/PDF aliases.
            vals.add(c.replace('grey','gray'))
            vals.add(c.replace('gray','grey'))
            if c == 'décors': vals |= {'decor', 'decori', 'decors'}
            if c.startswith('fenix '): vals.add(c.replace('fenix ', ''))
            if c.startswith('duplex '): vals.add(c.replace(' ', '_'))
            return [v for v in vals if v]

          def add_url(items, url, context, score=0):
            if not url: return
            url = url.strip().replace('&amp;', '&')
            if url.startswith('//'): url = 'https:' + url
            url = urljoin(BASE, url)
            url = url.split('#')[0].split('?')[0]
            p = urlparse(url)
            if p.netloc not in ('eliosceramica.com','www.eliosceramica.com'): return
            if '/wp-content/uploads/' not in p.path: return
            low = p.path.lower()
            if not re.search(r'\.(jpe?g|png|webp)$', low): return
            if any(x in low for x in ('logo','favicon','icon','cookie','certific','qr-code','placeholder')): return
            key = url
            prev = items.get(key)
            rec = {'url': url, 'context': context, 'score': score}
            if prev is None or score > prev['score']:
              items[key] = rec

          def best_srcset(value):
            if not value: return []
            vals=[]
            for part in value.split(','):
              bits=part.strip().split()
              if not bits: continue
              url=bits[0]
              width=0
              if len(bits)>1:
                m=re.match(r'(\d+)w', bits[1])
                if m: width=int(m.group(1))
              vals.append((width,url))
            return [u for _,u in sorted(vals, reverse=True)]

          def collect_page(slug, cfg):
            html = get(cfg['url'])
            soup = BeautifulSoup(html, 'html.parser')
            items={}
            for tag in soup.find_all(['img','source','a']):
              classes=' '.join(tag.get('class') or [])
              ident=tag.get('id') or ''
              alt=tag.get('alt') or tag.get('title') or ''
              parent_text=''
              parent=tag
              ancestry=[]
              for _ in range(4):
                parent=parent.parent if parent else None
                if not parent: break
                ancestry.append(' '.join(parent.get('class') or []))
                ancestry.append(parent.get('id') or '')
                if not parent_text:
                  parent_text=' '.join(parent.stripped_strings)[:400]
              context=' '.join([slug, classes, ident, alt, parent_text] + ancestry)
              c_norm=norm(context)
              score=0
              if 'gallery' in c_norm: score += 100
              if 'slider' in c_norm or 'swiper' in c_norm: score += 30
              if slug.replace('-', ' ') in c_norm: score += 20
              for attr in ('srcset','data-srcset','data-lazy-srcset'):
                for u in best_srcset(tag.get(attr)):
                  add_url(items,u,context,score+20)
              for attr in ('href','data-src','data-lazy-src','data-original','src'):
                add_url(items,tag.get(attr),context,score)
            return sorted(items.values(), key=lambda r: r['score'], reverse=True)

          def original_candidate(url):
            # WordPress often exposes resized gallery derivatives. Prefer the original URL when it exists.
            return re.sub(r'-\d+x\d+(?=\.(?:jpe?g|png|webp)$)', '', url, flags=re.I)

          def ext_for(url, content_type=''):
            ext=Path(urlparse(url).path).suffix.lower()
            if ext in ('.jpg','.jpeg','.png','.webp'):
              return '.jpg' if ext=='.jpeg' else ext
            if 'png' in content_type: return '.png'
            if 'webp' in content_type: return '.webp'
            return '.jpg'

          def select_and_save(slug, records, max_count=14):
            outdir=OUTROOT/slug
            outdir.mkdir(parents=True, exist_ok=True)
            selected=[]; seen=set()
            for rec in records:
              candidates=[original_candidate(rec['url']), rec['url']]
              data=None; used=None
              for u in dict.fromkeys(candidates):
                try:
                  data=get(u,binary=True,attempts=3)
                  used=u
                  break
                except Exception:
                  continue
              if not data: continue
              digest=hashlib.sha1(data).hexdigest()
              if digest in seen: continue
              try:
                im=Image.open(io.BytesIO(data))
                w,h=im.size
              except Exception:
                continue
              area=w*h
              # Keep real gallery/room images and large material visuals, skip tiny swatches/icons.
              if max(w,h) < 850 or area < 650_000:
                continue
              seen.add(digest)
              ext=ext_for(used)
              path=outdir/f'lot1-{len(selected)+1:02d}{ext}'
              path.write_bytes(data)  # exact source bytes: no resize, no recompression
              selected.append({
                'src': path.as_posix(), 'url': used, 'context': rec['context'],
                'w': w, 'h': h, 'bytes': len(data), 'score': rec['score']
              })
              print(f'{slug}: {path.name} <- {used} ({w}x{h}, {len(data)/1024:.0f} KiB)')
              if len(selected)>=max_count: break
            # If the collection has unusually small official gallery images, relax only the dimensions, never recompress.
            if len(selected)<4:
              for rec in records:
                if any(x['url']==rec['url'] for x in selected): continue
                try:
                  data=get(rec['url'],binary=True,attempts=2)
                  digest=hashlib.sha1(data).hexdigest()
                  if digest in seen: continue
                  im=Image.open(io.BytesIO(data)); w,h=im.size
                  if max(w,h)<600 or w*h<300_000: continue
                  seen.add(digest)
                  ext=ext_for(rec['url'])
                  path=outdir/f'lot1-{len(selected)+1:02d}{ext}'
                  path.write_bytes(data)
                  selected.append({'src':path.as_posix(),'url':rec['url'],'context':rec['context'],'w':w,'h':h,'bytes':len(data),'score':rec['score']})
                  if len(selected)>=6: break
                except Exception: pass
            if len(selected)<3:
              raise RuntimeError(f'{slug}: only {len(selected)} valid official images found')
            return selected

          official={}; variants={}; manifest={}
          for slug,cfg in CONFIG.items():
            records=collect_page(slug,cfg)
            print(f'{slug}: {len(records)} official upload candidates')
            selected=select_and_save(slug,records)
            official[slug]=[x['src'] for x in selected]
            manifest[slug]=selected
            per={}
            for color in cfg['colors']:
              aliases=color_aliases(color)
              matches=[]
              for x in selected:
                hay=norm(x['url']+' '+x['context'])
                if any(a in hay for a in aliases):
                  matches.append(x['src'])
              if matches:
                per[color]=matches
            # Only declare color mappings that are actually identifiable from official source metadata.
            if per: variants[slug]=per

          js=(
            '// ELIOS lot 1 HD — images natives du site officiel, téléchargées sans recompression.\n'
            + 'Object.assign(window.ELIOS_OFFICIAL_GALLERIES ||= {}, '
            + json.dumps(official,ensure_ascii=False,indent=2) + ');\n\n'
            + 'Object.assign(window.ELIOS_VERIFIED_VARIANTS ||= {}, '
            + json.dumps(variants,ensure_ascii=False,indent=2) + ');\n'
          )
          (ROOT/'assets/js/inspirations-elios-lot1-hd.js').write_text(js,encoding='utf-8')
          (ROOT/'assets/js/inspirations-elios-lot1-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')

          univers=ROOT/'univers.html'
          html=univers.read_text(encoding='utf-8')
          script='  <script src="assets/js/inspirations-elios-lot1-hd.js?v=20260902-lot1hd1"></script>\n'
          if 'inspirations-elios-lot1-hd.js' not in html:
            marker='  <script src="assets/js/inspirations-elios-slate-hd.js'
            pos=html.find(marker)
            if pos<0: raise RuntimeError('Slate script marker not found')
            html=html[:pos]+script+html[pos:]
          else:
            html=re.sub(r'assets/js/inspirations-elios-lot1-hd\.js\?v=[^\"]+', 'assets/js/inspirations-elios-lot1-hd.js?v=20260902-lot1hd1', html)
          html=re.sub(r'assets/js/inspirations-elios-gallery-v2\.js\?v=[^\"]+', 'assets/js/inspirations-elios-gallery-v2.js?v=20260902-lot1hd1', html)
          univers.write_text(html,encoding='utf-8')
          PY

      - name: Verify lot 1
        run: |
          test -s assets/js/inspirations-elios-lot1-hd.js
          test -s assets/js/inspirations-elios-lot1-manifest.json
          for d in domus montreal allure creta deco segmento; do
            test -d "assets/img/elios/$d"
            COUNT=$(find "assets/img/elios/$d" -maxdepth 1 -type f -name 'lot1-*' | wc -l)
            echo "$d: $COUNT images"
            test "$COUNT" -ge 3
          done
          grep -q 'inspirations-elios-lot1-hd.js?v=20260902-lot1hd1' univers.html
          grep -q 'inspirations-elios-gallery-v2.js?v=20260902-lot1hd1' univers.html

      - name: Commit lot 1 to main
        run: |
          git config user.name 'aetherismanga'
          git config user.email 'ccjacou@gmail.com'
          git add assets/img/elios/domus assets/img/elios/montreal assets/img/elios/allure assets/img/elios/creta assets/img/elios/deco assets/img/elios/segmento assets/js/inspirations-elios-lot1-hd.js assets/js/inspirations-elios-lot1-manifest.json univers.html
          git diff --cached --stat
          git commit -m 'Corrige Domus Montreal Allure Creta Deco et Segmento en HD officiel'
          git push origin HEAD:main
