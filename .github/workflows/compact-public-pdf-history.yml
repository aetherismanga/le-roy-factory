name: Approved public PDF history compaction
on:
  push:
    branches: [main]
    paths: [.github/workflows/compact-public-pdf-history.yml]
permissions:
  contents: write
concurrency:
  group: approved-public-pdf-history-compaction
  cancel-in-progress: false
jobs:
  compact:
    if: github.event.head_commit.message == 'Run approved public PDF history compaction 2026-10-19'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned history filter
        run: python -m pip install git-filter-repo==2.47.0
      - name: Back up history and validate exact file preservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/compact_public_pdf_history.py prepare
      - name: Preserve recoverable original history before any force push
        uses: actions/upload-artifact@v4
        with:
          name: original-history-before-pdf-compaction
          path: ${{ runner.temp }}/lrf-history-compaction/backup/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Apply atomic force-with-lease and verify all remote heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/compact_public_pdf_history.py apply
      - name: Preserve verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pdf-history-compaction-report
          path: ${{ runner.temp }}/lrf-history-compaction/report/
          retention-days: 90
          if-no-files-found: warn
