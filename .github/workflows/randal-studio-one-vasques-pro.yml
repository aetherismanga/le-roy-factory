name: Publier tarif PRO vasques RANDAL Studio One
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_randal_studio_one_pro.py'
      - '.github/workflows/randal-studio-one-vasques-pro.yml'
      - 'assets/pdf/RANDAL-V04.pdf'

permissions:
  contents: write

concurrency:
  group: randal-studio-one-vasques-pro
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les outils PDF
        run: python -m pip install --disable-pip-version-check pymupdf pillow reportlab
      - name: Generer les 2 pages du tarif PRO HT
        run: python scripts/build_randal_studio_one_pro.py
      - name: Verifier les prix et le contenu du PDF
        run: |
          python - <<'PY'
          import fitz
          p='assets/pdf/RANDAL-STUDIO-ONE-VASQUES-TARIF-PRO-HT.pdf'
          d=fitz.open(p)
          assert d.page_count==2
          assert d[0].search_for("57,50")
          assert d[1].search_for("113,00")
          assert not d[1].search_for("271,20")
          print("PDF RANDAL PRO OK : 2 pages, tarifs verifies")
          PY
      - name: Publier le document dans GitHub
        run: |
          git config user.name "LRF Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/pdf/RANDAL-STUDIO-ONE-VASQUES-TARIF-PRO-HT.pdf
          if git diff --cached --quiet; then
            echo "Tarif identique, rien à publier"
            exit 0
          fi
          git commit -m "Publie le PDF tarifs vasques RANDAL Studio One PRO HT remise 50%"
          git pull --rebase origin main
          git push origin HEAD:main
