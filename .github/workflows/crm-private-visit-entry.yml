name: CRM private visit entry
on:
  push:
    branches: ['ops/crm-report-20261105-apt']
    paths: ['.github/workflows/crm-private-visit-entry.yml']
permissions:
  contents: read
jobs:
  save-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install existing CRM database client
        run: npm install --prefix "$RUNNER_TEMP/lrf-crm-visit" --no-audit --no-fund --ignore-scripts firebase-admin@12.7.0
      - name: Save and verify authorized visit entry
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LE_ROY_FACTORY }}
          ENCRYPTED_ENTRY: '{"key":"","iv":"WlNkWXfck37Rb8Fw","tag":"FITNZ6RyRPjtFl1UjVPDMQ==","data":""}'
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const path = require('node:path');
          const admin = require(path.join(process.env.RUNNER_TEMP, 'lrf-crm-visit/node_modules/firebase-admin'));
          const sa = JSON.parse(process.env.SERVICE_ACCOUNT);
          if (sa.project_id !== 'le-roy-factory') throw new Error('Unexpected project');
          const envelope = JSON.parse(process.env.ENCRYPTED_ENTRY);
          const key = crypto.privateDecrypt({key:sa.private_key,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'}, Buffer.from(envelope.key,'base64'));
          const decipher = crypto.createDecipheriv('aes-256-gcm',key,Buffer.from(envelope.iv,'base64'));
          decipher.setAuthTag(Buffer.from(envelope.tag,'base64'));
          const payload = JSON.parse(Buffer.concat([decipher.update(Buffer.from(envelope.data,'base64')),decipher.final()]).toString('utf8'));
          if(payload.clientId !== 'SYLVESTRE_MATERIAUX_apt' || payload.report.date !== '2026-11-05' || payload.report.author !== 'Jérôme Hugol') throw new Error('Unexpected entry');
          const norm = v => String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          const stable = v => Array.isArray(v) ? v.map(stable) : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])) : v;
          const fingerprint = v => JSON.stringify(stable(v));
          const matches = r => r && r.date === payload.report.date && r.author === payload.report.author && r.usine === payload.report.usine && r.text === payload.report.text;
          const report = {...payload.report, createdAt:new Date().toISOString()};
          admin.initializeApp({credential:admin.credential.cert(sa), projectId:sa.project_id});
          const db = admin.firestore();
          (async()=>{
            const ref = db.collection('clients').doc(payload.clientId);
            let retained = [], field = '', outcome = '';
            await db.runTransaction(async tx=>{
              const snapshot = await tx.get(ref);
              if(!snapshot.exists) throw new Error('Client not found');
              const data = snapshot.data();
              const identity = norm([data.societe,data.nom,data.entreprise].filter(Boolean).join(' '));
              const locality = norm([data.ville,data.code_postal,data.codePostal,data.adresse,data.address].filter(Boolean).join(' '));
              if(!identity.includes('sylvestre') || !/(^| )apt( |$)|84400/.test(locality)) throw new Error('Client identity mismatch');
              const both = ['comptes_rendus','comptesRendus'].flatMap(f=>Array.isArray(data[f])?data[f]:[]);
              if(both.some(matches)){outcome='ALREADY_PRESENT';return;}
              if(both.some(r=>r && r.date===report.date && norm(r.text||r.texte||r.notes).includes('marie') && norm(r.text||r.texte||r.notes).includes('configurateur'))) throw new Error('Existing visit requires review');
              field = Array.isArray(data.comptes_rendus)?'comptes_rendus':Array.isArray(data.comptesRendus)?'comptesRendus':'comptes_rendus';
              retained = Array.isArray(data[field])?data[field]:[];
              tx.update(ref,{[field]:[report,...retained]});
              outcome='REPORT_ADDED';
            });
            const verified = (await ref.get()).data();
            const all = ['comptes_rendus','comptesRendus'].flatMap(f=>Array.isArray(verified[f])?verified[f]:[]);
            if(!all.some(matches))throw new Error('Verification failed');
            if(outcome==='REPORT_ADDED'){
              const saved = verified[field];
              if(saved.filter(matches).length!==1 || !retained.every(r=>saved.some(x=>fingerprint(x)===fingerprint(r))))throw new Error('History verification failed');
            }
            console.log('CRM_ENTRY_VERIFIED result='+outcome+' target=APT report_date=2026-11-05 history_preserved=true');
            await admin.app().delete();
          })().catch(error=>{console.error('CRM_ENTRY_FAILED '+(error.code||error.message));process.exitCode=1;});
          
          NODE
