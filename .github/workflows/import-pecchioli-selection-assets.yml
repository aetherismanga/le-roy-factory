name: Import Pecchioli selection assets

on:
  push:
    branches: ['release/pecchioli-selection-20261101']
    paths:
      - '.github/workflows/import-pecchioli-selection-assets.yml'
      - 'scripts/import-pecchioli-selection-assets.cjs'
      - 'reports/pecchioli-media-import.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pecchioli-selection-public-media-import
  cancel-in-progress: true

jobs:
  import:
    name: Verify and import approved Pecchioli public media
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Refresh the selected branch
        env:
          IMPORT_BRANCH: ${{ github.ref_name }}
        run: |
          test "$IMPORT_BRANCH" = 'release/pecchioli-selection-20261101'
          git fetch origin "$IMPORT_BRANCH"
          git checkout -B "$IMPORT_BRANCH" "origin/$IMPORT_BRANCH"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the approved import manifest and archive validation
        run: node --test tests/pecchioli-media-import.test.cjs

      - name: Install existing Google authentication dependency
        run: npm install --prefix functions --omit=dev --ignore-scripts

      - name: Authenticate existing importer service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LE_ROY_FACTORY }}'

      - name: Download privately and verify every approved asset
        run: node scripts/import-pecchioli-selection-assets.cjs reports/pecchioli-media-import.json

      - name: Commit verified public images and catalogue
        env:
          IMPORT_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for asset_dir in assets/img/pecchioli-20261101 assets/pdf/pecchioli; do
            if test -d "$asset_dir"; then git add -- "$asset_dir"; fi
          done
          if git diff --cached --quiet; then
            echo 'The approved Pecchioli assets are already present.'
          else
            git commit -m 'Import verified Pecchioli collection images and official catalogue'
            git pull --rebase origin "$IMPORT_BRANCH"
            git push origin "HEAD:$IMPORT_BRANCH"
          fi
