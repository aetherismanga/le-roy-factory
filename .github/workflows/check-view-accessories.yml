name: Check VIEW accessories

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-view-accessories.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check VIEW selection scripts
        run: |
          node --check assets/js/inspirations-view-accessories.js
          node --check assets/js/inspirations-view-accessories-ui.js
          node --check assets/js/inspirations-view-order-v4.js
