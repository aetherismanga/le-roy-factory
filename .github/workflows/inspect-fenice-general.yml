name: Inspect La Fenice general catalogue
on:
  push:
    paths:
      - '.github/workflows/inspect-fenice-general.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check pymupdf
      - name: Inspect official PDF
        shell: bash
        run: |
          set -euo pipefail
          URL='https://lafenicegc.com/wp-content/uploads/pdf/Fenice_catalogo_Generale_2026-2027__AMERICA2_.pdf'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$URL" -o /tmp/fenice-general.pdf
          mkdir -p tmp
          python - <<'PY'
          import fitz, json, os
          p='/tmp/fenice-general.pdf'
          doc=fitz.open(p)
          out={'size':os.path.getsize(p),'pages':doc.page_count,'toc':doc.get_toc()}
          previews=[]
          for i in range(min(35,doc.page_count)):
              txt=doc[i].get_text('text').strip()
              previews.append({'page':i+1,'text':txt[:5000]})
          out['preview']=previews
          open('tmp/fenice-general-inspect.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print('size',out['size'],'pages',out['pages'],'toc',len(out['toc']))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/fenice-general-inspect.json
          git commit -m 'Inspect La Fenice general catalogue'
          git push
