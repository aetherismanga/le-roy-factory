name: Bump home responsive PC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-home-responsive.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force responsive home asset refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='assets/js/desktop-promo-stack.js?v=20260907-glass1'
          new='assets/js/desktop-promo-stack.js?v=20260913-responsive1'
          if old not in s and new not in s:
              raise SystemExit('Référence desktop-promo-stack introuvable')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Active adaptation automatique accueil sur tous les PC' || exit 0
          git push
