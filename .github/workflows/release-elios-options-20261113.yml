# Read-only validation. No publication permissions or production secrets.
name: Validate Elios sample options 2026-11-13
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-elios-options-20261113.yml
      - tests/elios-samples-options*
      - functions/test/elios-samples-images.test.cjs
      - assets/js/elios-samples-options.mjs
      - functions/elios-samples-options.cjs
      - tools/apply-elios-sample-options-20261113.py
permissions:
  contents: read
concurrency:
  group: validate-elios-options-20261113
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'aetherismanga/le-roy-factory' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare application changes in the disposable test workspace
        run: |
          set -euo pipefail
          if ! grep -q 'id="es-installation-panel"' echantillons-elios.html; then
            python tools/apply-elios-sample-options-20261113.py
            git restore .github/workflows/deploy-firebase-functions.yml
            python - <<'PY'
          from pathlib import Path
          p=Path('functions/elios-samples-core.cjs');s=p.read_text();a="const VERSION='20261113-elios-samples-options-v9';";assert s.count(a)==1;p.write_text(s.replace(a,"const VERSION='20261113-elios-samples-direct-box-v8';"))
          p=Path('functions/elios-samples.js');s=p.read_text();a="res.set('X-LRF-Elios-Samples-Version',C.VERSION);";assert s.count(a)==1;p.write_text(s.replace(a,a+"res.set('X-LRF-Elios-Options-Version','20261113-energy-pose-v1');"))
          PY
          fi
          node --check assets/js/elios-samples.js
          node --check functions/elios-samples-core.cjs
          node --check functions/elios-samples.js
          git diff --check
      - name: Install test dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --include=dev --no-audit --no-fund
          npm install --prefix functions --package-lock=false --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Unit and request regression tests
        run: |
          set -euo pipefail
          node --test tests/elios-samples-options.test.mjs tests/elios-samples-workflow.test.mjs tests/elios-samples-client-mail.test.mjs tests/elios-mysterium-dynasty.test.mjs functions/test/elios-samples.test.cjs functions/test/elios-samples-images.test.cjs functions/test/elios-expo-budget.test.cjs | tee /tmp/elios-options-tests.txt
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Desktop and iPhone tests using synthetic accounts
        run: node tests/elios-samples-options-browser.cjs
      - name: Capture reviewed files for inspection
        if: always()
        run: |
          mkdir -p /tmp/elios-options-review
          git diff --binary > /tmp/elios-options-review/application.patch
          cp /tmp/elios-options-tests.txt /tmp/elios-options-review/ 2>/dev/null || true
          for file in functions/elios-samples-core.cjs functions/elios-samples.js assets/js/elios-samples.js echantillons-elios.html assets/css/elios-samples.css functions/test/elios-samples.test.cjs tests/elios-mysterium-dynasty.test.mjs; do
            mkdir -p "/tmp/elios-options-review/$(dirname "$file")"
            cp "$file" "/tmp/elios-options-review/$file"
          done
          cp reports/elios-options-browser/*.png /tmp/elios-options-review/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: elios-options-readonly-validation
          path: /tmp/elios-options-review/
          retention-days: 3
          if-no-files-found: error
