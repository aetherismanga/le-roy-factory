name: Inspect Azuli Mood PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-azuli-pdf.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Extract catalogue text and image inventory
        run: |
          set -e
          PDF='assets/pdf/AZULI-MOOD_new.pdf'
          pdfinfo "$PDF" | sed -n '1,30p'
          pdftotext -layout "$PDF" /tmp/azuli.txt
          echo '===== REFERENCES / CONTEXT ====='
          grep -Ein -C 3 '04Q|CHALK|SAND|BONE|THYME|BURGUNDY|COFFEE|BOTTLE|TURQUOISE|DUSK|DAWN|CASSETTONE|OTTAGONA|LOSANGHE' /tmp/azuli.txt | head -n 1200 || true
          echo '===== IMAGE INVENTORY ====='
          pdfimages -list "$PDF" | head -n 1200
