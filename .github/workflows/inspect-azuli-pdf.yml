name: Inspect Azuli Mood PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-azuli-pdf.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Extract technical table and gallery page labels
        run: |
          set -e
          PDF='assets/pdf/AZULI-MOOD_new.pdf'
          echo '===== TECHNICAL TABLE PAGES 32-34 ====='
          pdftotext -f 32 -l 34 -layout "$PDF" - | sed -n '1,500p'
          echo '===== GALLERY PAGE LABELS 8-29 ====='
          for p in $(seq 8 29); do
            echo "--- PDF PAGE $p ---"
            pdftotext -f "$p" -l "$p" -layout "$PDF" - | grep -Ei 'CHALK|SAND|BONE|THYME GREEN|BURGUNDY|COFFEE BEAN|BLUE|BOTTLE GREEN|TURQUOISE|DUSK|DAWN|WALL|FURNITURE|FLOOR' | head -n 30 || true
          done
