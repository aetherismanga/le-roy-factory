name: Analyse REITANO PDFs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/analyze-reitano-pdfs.py'
      - '.github/workflows/analyze-reitano-pdfs.yml'
      - 'assets/pdf/REITANO-Robinetterie-2026.pdf'
      - 'assets/pdf/Reitano tarif general 2026.pdf'

permissions:
  contents: write

concurrency:
  group: reitano-pdf-analysis
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer PyMuPDF
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.4'
      - name: Analyser intégralement les deux PDF
        run: python tools/analyze-reitano-pdfs.py
      - name: Enregistrer le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/reitano-pdf-analysis.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Analyse intégrale des PDF REITANO 2026"
          git pull --rebase origin main
          git push origin HEAD:main
