name: Fix CRM floral logo cache
on:
  push:
    paths:
      - '.github/workflows/fix-crm-floral-logo-cache.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force unique floral logo across CRM
        shell: python
        run: |
          from pathlib import Path
          import re

          CRM_LOGO = 'assets/brand-v2/lrf-logo-officiel-2026.png?v=20260918-crm-floral-1'
          crm_pages = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              is_crm = (
                  'crm-body' in text
                  or 'LE ROY FACTORY CRM' in text
                  or 'LRF CRM' in text
              )
              if not is_crm:
                  continue
              original = text
              text = re.sub(r'assets/img/logo03lrf\.png(?:\?v=[^"\'<>\s]+)?', CRM_LOGO, text)
              text = re.sub(r'assets/brand-v2/assetlogorond\.png(?:\?v=[^"\'<>\s]+)?', CRM_LOGO, text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  crm_pages.append(path.name)

          # Runtime mobile cleanup must know the new logo path too.
          p = Path('assets/js/dashboard-commercial.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  "if(src.includes('logo03lrf')||src.includes('assetlogorond')){",
                  "if(src.includes('logo03lrf')||src.includes('assetlogorond')||src.includes('lrf-logo-officiel-2026')){"
              )
              p.write_text(s, encoding='utf-8')

          # Force browsers to retrieve a new service worker and invalidate every old PWA cache.
          sw = Path('sw.js')
          if sw.exists():
              s = sw.read_text(encoding='utf-8')
              s = re.sub(r"const CACHE='[^']+';", "const CACHE='lrf-pwa-v12-crm-floral-20260918';", s, count=1)
              s = re.sub(
                  r"const CORE=\[[^\]]*\];",
                  "const CORE=['/','/index.html','/assets/brand-v2/lrf-logo-officiel-2026.png?v=20260918-crm-floral-1'];",
                  s,
                  count=1
              )
              needle = "  if(['script','style','worker'].includes(event.request.destination)){\n    event.respondWith(networkFirst(event.request));\n    return;\n  }"
              replacement = """  if(['script','style','worker'].includes(event.request.destination)){
              event.respondWith(networkFirst(event.request));
              return;
            }

            // Logos LRF : toujours vérifier le réseau pour éviter tout retour d'un ancien visuel.
            if(url.pathname.includes('logo03lrf') || url.pathname.includes('assetlogorond') || url.pathname.includes('lrf-logo-officiel-2026')){
              event.respondWith(networkFirst(event.request));
              return;
            }"""
              if needle in s:
                  s = s.replace(needle, replacement, 1)
              sw.write_text(s, encoding='utf-8')

          pwa = Path('assets/js/pwa-install.js')
          if pwa.exists():
              s = pwa.read_text(encoding='utf-8')
              s = re.sub(
                  r"navigator\.serviceWorker\.register\('/sw\.js\?v=[^']+'",
                  "navigator.serviceWorker.register('/sw.js?v=20260918-crm-floral-1'",
                  s
              )
              pwa.write_text(s, encoding='utf-8')

          app = Path('assets/js/app.js')
          if app.exists():
              s = app.read_text(encoding='utf-8')
              s = re.sub(
                  r"assets/js/pwa-install\.js\?v=[^'\"]+",
                  "assets/js/pwa-install.js?v=20260918-crm-floral-1",
                  s
              )
              app.write_text(s, encoding='utf-8')

          print('CRM pages updated:', ', '.join(crm_pages))
          if not crm_pages:
              raise SystemExit('No CRM pages were updated')

      - name: Verify CRM has no stale logo references
        shell: python
        run: |
          from pathlib import Path
          import re
          bad=[]
          checked=[]
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              if 'crm-body' in text or 'LE ROY FACTORY CRM' in text or 'LRF CRM' in text:
                  checked.append(path.name)
                  if re.search(r'assets/img/logo03lrf\.png|assets/brand-v2/assetlogorond\.png', text):
                      bad.append(path.name)
          print('Checked CRM pages:', len(checked))
          print('\n'.join(checked))
          if bad:
              raise SystemExit('Stale CRM logo refs: ' + ', '.join(bad))
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert 'lrf-pwa-v12-crm-floral-20260918' in sw
          assert 'lrf-logo-officiel-2026' in sw

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' assets/js/dashboard-commercial.js assets/js/pwa-install.js assets/js/app.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix CRM floral logo cache permanently'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
