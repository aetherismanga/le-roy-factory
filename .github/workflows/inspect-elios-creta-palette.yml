name: Inspect ELIOS Creta 2026 colour swatches
on:
  push:
    paths:
      - scripts/inspect_elios_creta_palette.py
      - .github/workflows/inspect-elios-creta-palette.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymupdf pillow
      - run: python scripts/inspect_elios_creta_palette.py
      - run: |
          git config user.name "LRF Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/img/elios/creta/catalogue-palette-diagnostic.* assets/img/elios/creta/catalogue-palette-page-*.jpg
          git diff --cached --quiet || (git commit -m "Repère les nuanciers officiels ELIOS Creta" && git pull --rebase origin main && git push origin HEAD:main)
