name: Build RANDAL HD furniture hero
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/export_randal_hero_hd.py'
      - '.github/workflows/export-randal-hero-hd.yml'
permissions:
  contents: write
concurrency:
  group: randal-hd-hero
  cancel-in-progress: false
jobs:
  hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install photo extraction dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Export genuine RANDAL high-resolution image
        run: python scripts/export_randal_hero_hd.py
      - name: Publish the HD hero image
        run: |
          git config user.name "LRF Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/img/randal/hero-meuble-hd.webp
          if git diff --cached --quiet; then
            echo "RANDAL hero already up-to-date"
            exit 0
          fi
          git commit -m "Publie la photo HD officielle du meuble RANDAL"
          git pull --rebase origin main
          git push origin HEAD:main
