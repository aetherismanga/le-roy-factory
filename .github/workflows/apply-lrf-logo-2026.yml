name: Apply official LRF logo 2026

on:
  push:
    paths:
      - '.github/workflows/apply-lrf-logo-2026.yml'

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build official LRF PNG assets
        shell: bash
        run: |
          python -m pip install --quiet pillow
          cat .github/logo-assets/lrf-logo-2026.part01 \
              .github/logo-assets/lrf-logo-2026.part02 \
              .github/logo-assets/lrf-logo-2026.part03 \
              .github/logo-assets/lrf-logo-2026.part04 \
              .github/logo-assets/lrf-logo-2026.part05 \
              .github/logo-assets/lrf-logo-2026.part06 \
              > /tmp/lrf-logo.b64
          base64 -d /tmp/lrf-logo.b64 > /tmp/lrf-logo.webp
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from PIL import Image

          src = Path('/tmp/lrf-logo.webp')
          expected = '59503f51c4732e320b117eb68a68a347eac75852a72ed42b6acf3c2a3cb70c82'
          got = hashlib.sha256(src.read_bytes()).hexdigest()
          if got != expected:
              raise SystemExit(f'LRF asset checksum mismatch: {got}')

          im = Image.open(src).convert('RGBA')
          if im.size != (512, 512):
              im = im.resize((512, 512), Image.Resampling.LANCZOS)

          targets = [
              Path('assets/brand-v2/assetlogorond.png'),
              Path('assets/img/logo03lrf.png'),
              Path('assets/brand-v2/lrf-logo-officiel-2026.png'),
          ]
          for target in targets:
              target.parent.mkdir(parents=True, exist_ok=True)
              im.save(target, format='PNG', optimize=True)
          PY

      - name: Refresh site and CRM logo references without changing dimensions
        shell: python
        run: |
          from pathlib import Path
          import re

          VERSION = '20260915-lrf-green-standard'
          allowed = {'.html', '.css', '.js', '.svg', '.webmanifest', '.json'}

          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              if '.git' in path.parts or '.github' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              text = re.sub(
                  r"assetlogorond\.png(?:\?v=[^\"')\s]+)?",
                  f"assetlogorond.png?v={VERSION}",
                  text,
              )
              text = re.sub(
                  r"logo03lrf\.png(?:\?v=[^\"')\s]+)?",
                  f"logo03lrf.png?v={VERSION}",
                  text,
              )
              if path.name == 'sw.js':
                  text = re.sub(
                      r"const CACHE='[^']+';",
                      "const CACHE='lrf-pwa-v10-green-logo-20260915';",
                      text,
                      count=1,
                  )
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Replace the temporary embedded SVG with a clean wrapper around the final PNG.
          wrapper = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo officiel LRF">
            <image href="lrf-logo-officiel-2026.png" width="512" height="512" preserveAspectRatio="xMidYMid meet"/>
          </svg>
          '''
          Path('assets/brand-v2/lrf-logo-officiel-2026.svg').write_text(wrapper, encoding='utf-8')

          # Staging chunks are no longer needed after the official assets are generated.
          staging = Path('.github/logo-assets')
          if staging.exists():
              for child in staging.iterdir():
                  if child.is_file():
                      child.unlink()
              try:
                  staging.rmdir()
              except OSError:
                  pass
          PY

      - name: Verify official assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          targets = [
              'assets/brand-v2/assetlogorond.png',
              'assets/img/logo03lrf.png',
              'assets/brand-v2/lrf-logo-officiel-2026.png',
          ]
          for p in targets:
              path = Path(p)
              if not path.exists() or path.stat().st_size < 10000:
                  raise SystemExit(f'Invalid logo asset: {p}')
              with Image.open(path) as im:
                  if im.size != (512, 512) or im.format != 'PNG':
                      raise SystemExit(f'Unexpected logo format: {p} {im.size} {im.format}')
          print('LRF logo assets OK')
          PY

      - name: Commit new LRF standard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "brand: set green botanical LRF logo as official standard"
          git push
