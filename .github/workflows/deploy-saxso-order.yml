name: Deploy SAXSO orders
on:
  push:
    branches: [main]
    paths:
      - 'functions/saxso-order*'
      - 'functions/data/saxso-order-version.json'
      - 'functions/scripts/*saxso-order*'
      - 'functions/test/saxso-order.test.cjs'
      - 'assets/data/saxso-net-index.json'
      - '.github/workflows/deploy-saxso-order.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-functions-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        working-directory: functions
        run: npm install --omit=dev --no-audit --no-fund
      - name: Verify order calculations and PDF generation
        run: node --test functions/test/saxso-order.test.cjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LE_ROY_FACTORY }}
      - name: Prepare the private supplier pricebook
        run: |
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          node functions/scripts/stage-saxso-order.cjs
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy only the SAXSO order function
        run: |
          node functions/scripts/package-saxso-order.cjs "$RUNNER_TEMP/saxso-source"
          runtime_account="$(gcloud functions describe sendGroupEmail --v2 --region=us-central1 --project=le-roy-factory --format='value(serviceConfig.serviceAccountEmail)')"
          test -n "$runtime_account"
          gcloud functions deploy saxsoOrder --gen2 --project=le-roy-factory --region=us-central1 \
            --runtime=nodejs22 --source="$RUNNER_TEMP/saxso-source" --entry-point=saxsoOrder \
            --service-account="$runtime_account" --trigger-http --allow-unauthenticated \
            --set-secrets=SMTP_PASSWORD_JEROME=SMTP_PASSWORD_JEROME:latest \
            --timeout=100s --memory=256MiB --quiet
      - name: Verify authorized PDFs without sending email
        run: node functions/scripts/smoke-saxso-order.cjs
