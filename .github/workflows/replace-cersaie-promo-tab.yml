name: Replace Cersaie promo asset with nav tab
on:
  push:
    paths:
      - '.github/workflows/replace-cersaie-promo-tab.yml'
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace special promo component by simple nav tab
        shell: python
        run: |
          from pathlib import Path
          import re

          old_markup = """<li class="lrf-promo-cersaie-li"><a href="promo-cersaie.html" class="lrf-promo-cersaie-nav" aria-label="Promo Cersaie 2026"><span class="lrf-promo-kicker">PROMO</span><span class="lrf-promo-title">CERSAIE 2026</span></a></li>"""
          new_markup = """<li><a href="promo-cersaie.html" class="lrf-promo-cersaie-tab">PROMO CERSAIE 2026</a></li>"""

          changed=[]
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              original=text
              text=text.replace(old_markup,new_markup)
              text=re.sub(r'\s*<link rel="stylesheet" href="assets/css/promo-cersaie-nav-asset\.css\?v=[^"]+">', '', text)
              if text != original:
                  path.write_text(text,encoding='utf-8')
                  changed.append(path.name)

          if not changed:
              raise SystemExit('Aucune page modifiée')
          print('Pages modifiées:', ', '.join(changed))

          layout=Path('assets/css/layout.css')
          css=layout.read_text(encoding='utf-8')
          marker='/* Onglet Promo Cersaie 2026 : texte simple, sans asset. */'
          block=r'''
/* Onglet Promo Cersaie 2026 : texte simple, sans asset. */
html body .main-nav > li > a.lrf-promo-cersaie-tab {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  min-height: 42px !important;
  padding: .62rem 1.05rem !important;
  border: 1px solid #D4AF37 !important;
  border-radius: 8px !important;
  background: transparent !important;
  box-shadow: none !important;
  text-decoration: none !important;
  white-space: nowrap !important;
  font-size: 1.06rem !important;
  font-weight: 900 !important;
  letter-spacing: .025em !important;
  line-height: 1 !important;
  transform: none !important;
}
html body .main-nav > li > a.lrf-promo-cersaie-tab::before,
html body .main-nav > li > a.lrf-promo-cersaie-tab::after {
  content: none !important;
  display: none !important;
}
html body .main-nav > li > a.lrf-promo-cersaie-tab:hover,
html body .main-nav > li > a.lrf-promo-cersaie-tab:focus {
  border-color: #FFD700 !important;
  color: #FFD700 !important;
  background: transparent !important;
  box-shadow: 0 0 0 1px rgba(255,215,0,.18) !important;
}
@media (max-width: 900px) {
  html body .main-nav > li > a.lrf-promo-cersaie-tab {
    min-height: 46px !important;
    padding: .72rem 1.1rem !important;
    font-size: 1.08rem !important;
  }
}
'''
          if marker not in css:
              css += '\n' + block.strip() + '\n'
          layout.write_text(css,encoding='utf-8')

          old_css=Path('assets/css/promo-cersaie-nav-asset.css')
          if old_css.exists():
              old_css.unlink()

      - name: Verify no old promo asset remains
        shell: python
        run: |
          from pathlib import Path
          import re
          leftovers=[]
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              if 'lrf-promo-cersaie-nav' in text or 'lrf-promo-kicker' in text or 'lrf-promo-title' in text or 'promo-cersaie-nav-asset.css' in text:
                  leftovers.append(path.name)
          if leftovers:
              raise SystemExit('Ancien composant encore présent: ' + ', '.join(leftovers))
          assert not Path('assets/css/promo-cersaie-nav-asset.css').exists()
          layout=Path('assets/css/layout.css').read_text(encoding='utf-8')
          assert 'lrf-promo-cersaie-tab' in layout
          print('Ancien asset supprimé, onglet texte validé.')

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Replace Cersaie promo asset with simple gold nav tab'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
