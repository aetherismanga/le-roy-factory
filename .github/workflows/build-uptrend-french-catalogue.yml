name: Build UPTREND French catalogue

on:
  push:
    branches: [main]
    paths:
      - tools/build-uptrend-french-catalogue.py
      - .github/workflows/build-uptrend-french-catalogue.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyMuPDF==1.24.10
      - name: Générer le PDF français
        run: python tools/build-uptrend-french-catalogue.py --source assets/pdf/UPTREND_Catalogue_2026.pdf --output assets/pdf/UPTREND_Catalogue_2026_FR.pdf
      - name: Publier le PDF généré
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pdf/UPTREND_Catalogue_2026_FR.pdf
          git diff --cached --quiet || git commit -m "Génère le catalogue UPTREND en français"
          git push
