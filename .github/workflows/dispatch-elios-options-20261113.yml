# One-time request of the existing protected Firebase deployment workflow.
# This dispatcher cannot write repository contents and has no Firebase credentials.
name: Request approved Elios sample calculation deployment
on:
  push:
    branches: [main]
    paths: [.github/workflows/dispatch-elios-options-20261113.yml]
permissions:
  contents: read
jobs:
  request-existing-release:
    if: >-
      github.repository == 'aetherismanga/le-roy-factory' &&
      github.ref == 'refs/heads/main' &&
      github.event.before == '8f51d4cc00f0899bb6518b46ebcccc28fceece84' &&
      github.event.head_commit.message == 'Request approved Elios sample calculation deployment' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Verify the exact release parent and invoke existing approval gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/aetherismanga/le-roy-factory/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/aetherismanga/le-roy-factory/commits/$GITHUB_SHA" --jq '.parents[0].sha')" = '8f51d4cc00f0899bb6518b46ebcccc28fceece84'
          gh api --method POST repos/aetherismanga/le-roy-factory/actions/workflows/deploy-firebase-functions.yml/dispatches --input - <<'JSON'
          {"ref":"main","inputs":{"confirm_production":"CONFIRMER-PRODUCTION","function_group":"elios-samples"}}
          JSON
          echo 'Requested elios-samples through the existing protected production workflow; no approval gate changed.' >> "$GITHUB_STEP_SUMMARY"
