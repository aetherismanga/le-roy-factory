name: Import verified Search Console history
on:
  workflow_dispatch:
    inputs:
      confirm_import:
        description: Type IMPORTER-HISTORIQUE to save the reviewed report in agent settings
        required: true
        type: string
      report_gzip_base64:
        description: Reviewed Google Search Console report, gzip encoded as base64
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: lrf-seo-history-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'aetherismanga/le-roy-factory' && github.ref == 'refs/heads/main' && inputs.confirm_import == 'IMPORTER-HISTORIQUE'
    runs-on: ubuntu-24.04
    environment: firebase-production
    timeout-minutes: 10
    steps:
      - name: Keep imported metrics out of workflow logs
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const value=event.inputs?.report_gzip_base64?.trim();
          if(typeof value!=='string'||value.length>100000||!/^[A-Za-z0-9+/=]+$/.test(value))throw Error('A valid compressed report is required.');
          process.stdout.write('::add-mask::'+value+'\n');
          JS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify report validation and history preservation
        run: node --test tests/seo-dashboard-model.test.mjs functions/test/seo-report-core.test.cjs
      - name: Install the existing Admin SDK without lifecycle scripts
        working-directory: functions
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LE_ROY_FACTORY }}'
      - name: Save the reviewed history in protected agent settings
        run: node functions/scripts/import-seo-history.cjs
