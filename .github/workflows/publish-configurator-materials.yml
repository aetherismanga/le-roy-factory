name: Publish reviewed configurator materials
on:
  push:
    branches: [main]
    paths: ['tools/configurator-materials/**', '.github/workflows/publish-configurator-materials.yml']
permissions:
  contents: read
jobs:
  materials:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source extractors
        run: python -m pip install Pillow==11.3.0 PyMuPDF==1.26.5 google-cloud-storage==3.4.1
      - name: Use existing project asset identity
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LE_ROY_FACTORY }}'
      - name: Restore reviewed native tile faces to the existing asset bucket
        run: python tools/configurator-materials/publish.py
