name: Apply Azuli Mood HD Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-azuli-mood-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install extraction tools
        run: python -m pip install --quiet pymupdf pillow

      - name: Extract native catalogue photos
        run: |
          python <<'PY'
          from pathlib import Path
          from io import BytesIO
          import fitz
          from PIL import Image
          pdf = Path('assets/pdf/AZULI-MOOD_new.pdf')
          out = Path('assets/img/elios/azuli-mood')
          out.mkdir(parents=True, exist_ok=True)
          doc = fitz.open(pdf)
          page_map = {
              'chalk': [8, 9], 'sand': [10, 11], 'bone': [12, 13],
              'thyme-green': [14, 15], 'burgundy': [16, 17],
              'coffee-bean': [18, 19], 'blue': [20, 21],
              'bottle-green': [22, 23], 'turquoise': [24, 25],
              'dusk': [26, 27], 'dawn': [28, 29]
          }
          for color, pages in page_map.items():
              for idx, page_no in enumerate(pages, 1):
                  page = doc[page_no - 1]
                  candidates = []
                  for image in page.get_images(full=True):
                      try:
                          data = doc.extract_image(image[0])
                          w = int(data.get('width') or 0)
                          h = int(data.get('height') or 0)
                          if w >= 180 and h >= 180:
                              candidates.append((w*h, w, h, data['image']))
                      except Exception:
                          pass
                  if not candidates:
                      raise RuntimeError(f'No usable image on PDF page {page_no}')
                  _, w, h, raw = max(candidates, key=lambda x: x[0])
                  target = out / f'{color}-{idx:02d}.jpg'
                  Image.open(BytesIO(raw)).convert('RGB').save(target, 'JPEG', quality=95, optimize=True)
                  print(f'{target}: {w}x{h}')
          if len(list(out.glob('*.jpg'))) != 22:
              raise RuntimeError('Expected 22 Azuli Mood photos')
          PY

      - name: Commit native photos
        run: |
          git config user.name 'aetherismanga'
          git config user.email 'ccjacou@gmail.com'
          git add assets/img/elios/azuli-mood
          git commit -m 'feat: add native Azuli Mood catalogue photos'
          git push origin main
