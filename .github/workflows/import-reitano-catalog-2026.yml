name: Import Reitano catalogue 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-reitano-catalog-2026.yml'

permissions:
  contents: write

jobs:
  import-catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official 2026 catalogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/pdf
          URL='https://www.reitano-rubinetteria.com/images/cataloghi/full/Catalogo%202026.pdf'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$URL" -o assets/pdf/REITANO-Robinetterie-2026.pdf
          test -s assets/pdf/REITANO-Robinetterie-2026.pdf
          head -c 5 assets/pdf/REITANO-Robinetterie-2026.pdf | grep -q '%PDF-'
          ls -lh assets/pdf/REITANO-Robinetterie-2026.pdf

      - name: Commit catalogue to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pdf/REITANO-Robinetterie-2026.pdf
          git diff --cached --quiet && exit 0
          git commit -m 'Ajoute catalogue Reitano Rubinetterie 2026'
          git push origin HEAD:main
