name: NEOBATH PDF audit

on:
  push:
    branches:
      - agent/neobath-configurateur-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.3 pillow==11.3.0
      - name: Rebuild cleaned configurator data
        run: |
          python tools/build_neobath_config_data.py
          python tools/postprocess_neobath_config_data.py
          python tools/render_neobath_config_visuals.py
          node --check assets/js/meubles-configurateur.js
          node --check assets/js/pro-session-bridge.js
          node --check assets/js/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('assets/data/neobath-config-data.json').read_text(encoding='utf-8'))
          items=data['items']
          assert data['proDiscount']['factor'] == 0.45
          assert not [x for x in items if x['collection']=='ANIMA' and x['category']=='module' and int((x.get('source') or {}).get('page') or 0) not in (65,66)]
          def one(c,r): return next(x for x in items if x['collection']==c and x['ref']==r)
          assert any(v['price']==535 for v in one('ANIMA','APUR-PL6052')['prices'])
          assert [v['price'] for v in one('DNA','DNA-PL6052')['prices'][:3]] == [689.0,836.0,942.0]
          assert one('DNA','SIDEBAR')['prices'][0]['price'] == 115
          assert one('DNA','PIE35')['prices'][0]['price'] == 38
          assert one('DNA','MNS1F')['prices'][0]['price'] == 70
          assert any(x['unit']=='cm' for x in items if x['category']=='worktop')
          print('VALIDATED',len(items))
          PY
      - name: Commit clean generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/neobath-config-data.json assets/img/neobath-config generated/neobath-audit/config-build-summary.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Régénère les données NEOBATH nettoyées"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
