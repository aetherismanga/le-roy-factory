name: NEOBATH PDF audit

on:
  push:
    branches:
      - agent/neobath-configurateur-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tools
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.3 pillow==11.3.0

      - name: Extract PDF structure
        run: python tools/neobath_pdf_audit.py

      - name: Build configurator dataset and visuals
        run: |
          python tools/build_neobath_config_data.py
          python tools/postprocess_neobath_config_data.py
          python tools/render_neobath_config_visuals.py

      - name: Validate configurator JavaScript
        run: |
          node --check assets/js/meubles-configurateur.js
          node --check assets/js/pro-session-bridge.js
          node --check assets/js/app.js

      - name: Validate tariff dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('assets/data/neobath-config-data.json').read_text(encoding='utf-8'))
          items=data['items']
          assert data['proDiscount']['factor'] == 0.45
          assert len([x for x in items if x['collection']=='ANIMA' and x['category']=='module']) >= 30
          assert len([x for x in items if x['collection']=='DNA' and x['category']=='module']) >= 20
          assert len([x for x in items if x['category']=='worktop' and x['unit']=='cm']) >= 5
          assert len([x for x in items if x['category']=='mirror']) >= 20
          assert len([x for x in items if x['category']=='accessory']) >= 10
          refs={(x['collection'],x['ref']) for x in items}
          for required in [('DNA','SIDEBAR'),('DNA','PIE35'),('DNA','MNS1F')]:
              assert required in refs, required
          print('Dataset valid:', len(items), 'items')
          PY

      - name: Commit generated data on working branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/neobath-audit assets/data/neobath-config-data.json assets/img/neobath-config
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Génère les données et visuels du configurateur NEOBATH"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
