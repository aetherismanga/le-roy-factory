name: NEOBATH PDF audit

on:
  push:
    branches:
      - agent/neobath-configurateur-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/neobath-configurateur-v2
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tools
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.3

      - name: Extract PDF structure
        run: python tools/neobath_pdf_audit.py

      - name: Commit generated audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/neobath-audit
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Audit des tarifs NEOBATH"
            git push origin HEAD:agent/neobath-configurateur-v2
          fi
