name: Inspect Reitano accessories
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-reitano-accessories.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read official page
        run: |
          curl -fL -A 'Mozilla/5.0' 'https://www.reitano-rubinetteria.com/it/prodotti' -o page.html
          grep -n 'source:' page.html | tail -20
