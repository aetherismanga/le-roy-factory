name: Inspect Reitano accessories
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-reitano-accessories.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate accessories catalogue source
        shell: bash
        run: |
          set -u
          base='https://www.reitano-rubinetteria.com'
          echo '--- robots/sitemap ---'
          for u in "$base/robots.txt" "$base/sitemap.xml" "$base/sitemap_index.xml"; do
            echo "URL $u"
            curl -L -A 'Mozilla/5.0' -s "$u" | grep -Ei 'sitemap|accessor|catalog' | head -80 || true
          done
          echo '--- candidate pages ---'
          pages=(
            '/it/catalogo-accessori-2026'
            '/it/accessori-2026'
            '/it/catalogo-accessori'
            '/it/cataloghi'
            '/it/prodotti/accessori'
            '/it/prodotti/accessori-bagno'
            '/en/accessories-2026'
            '/en/accessories'
            '/en/catalogues'
          )
          for p in "${pages[@]}"; do
            u="$base$p"
            code=$(curl -L -A 'Mozilla/5.0' -s -o /tmp/page -w '%{http_code}' "$u")
            title=$(grep -io '<title>[^<]*' /tmp/page | head -1 | sed 's/<title>//I' || true)
            echo "PAGE $code $u :: $title"
            grep -Eio 'atob\("[A-Za-z0-9+/=]+"\)|https?://[^"'"'"'<> ]+\.pdf[^"'"'"'<> ]*' /tmp/page | head -20 || true
          done
