name: Import Reitano accessories 2026
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-reitano-accessories.yml'
permissions:
  contents: write
jobs:
  import-accessories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download official accessories catalogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/pdf
          URL='https://www.reitano-rubinetteria.com/images/cataloghi/full/Catalogo%20accessori.pdf'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$URL" -o assets/pdf/REITANO-Accessoire-2026-Catalogue.pdf
          test -s assets/pdf/REITANO-Accessoire-2026-Catalogue.pdf
          head -c 5 assets/pdf/REITANO-Accessoire-2026-Catalogue.pdf | grep -q '%PDF-'
          bytes=$(wc -c < assets/pdf/REITANO-Accessoire-2026-Catalogue.pdf)
          echo "PDF bytes: $bytes"
          test "$bytes" -gt 1000000
          ls -lh assets/pdf/REITANO-Accessoire-2026-Catalogue.pdf
      - name: Commit accessories catalogue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pdf/REITANO-Accessoire-2026-Catalogue.pdf
          git diff --cached --quiet && exit 0
          git commit -m 'Ajoute catalogue Accessoires Reitano 2026'
          git push origin HEAD:main
