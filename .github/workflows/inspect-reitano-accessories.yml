name: Inspect Reitano accessories
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-reitano-accessories.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test official PDF paths
        shell: bash
        run: |
          set -u
          base='https://www.reitano-rubinetteria.com/images/cataloghi/full'
          candidates=(
            'Accessori%202026.pdf'
            'ACCESSORI%202026.pdf'
            'Catalogo%20Accessori%202026.pdf'
            'Catalogo%20accessori%202026.pdf'
            'Catalogo%20ACCESSORI%202026.pdf'
            'Accessori%20Bagno%202026.pdf'
            'Accessori%20bagno%202026.pdf'
            'Catalogo%20Accessori%20Bagno%202026.pdf'
            'Catalogo%20accessori%20bagno%202026.pdf'
            'Catalogo%20Accessori%20bagno%202026.pdf'
            'REITANO%20Accessori%202026.pdf'
            'REITANO-Accessori-2026.pdf'
            'Reitano%20Accessori%202026.pdf'
          )
          for f in "${candidates[@]}"; do
            url="$base/$f"
            code=$(curl -L -A 'Mozilla/5.0' -s -o /tmp/candidate -w '%{http_code}' "$url")
            bytes=$(wc -c </tmp/candidate 2>/dev/null || echo 0)
            head5=$(head -c 5 /tmp/candidate 2>/dev/null || true)
            echo "$code $bytes $head5 $url"
          done
