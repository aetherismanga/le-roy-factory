name: Inspect Reitano accessories
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-reitano-accessories.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode catalogue links
        shell: bash
        run: |
          set -euo pipefail
          curl -fL -A 'Mozilla/5.0' 'https://www.reitano-rubinetteria.com/it/cataloghi' -o /tmp/cataloghi.html
          python3 - <<'PY'
          import re,base64,html
          raw=html.unescape(open('/tmp/cataloghi.html',encoding='utf-8',errors='ignore').read()).replace('\\/','/')
          vals=re.findall(r'atob\(["\']([^"\']+)["\']\)',raw,re.I)
          print('ATOB COUNT',len(vals))
          for v in vals:
              try:
                  print(base64.b64decode(v).decode('utf-8','ignore'))
              except Exception as e:
                  print('DECODE ERROR',e)
          print('DIRECT PDF URLS')
          for u in re.findall(r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',raw,re.I):
              print(u)
          PY
