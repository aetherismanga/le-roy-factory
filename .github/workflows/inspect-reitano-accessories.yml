name: Inspect Reitano accessories
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-reitano-accessories.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect catalogue page links
        shell: bash
        run: |
          set -euo pipefail
          curl -fL -A 'Mozilla/5.0' 'https://www.reitano-rubinetteria.com/it/cataloghi' -o /tmp/cataloghi.html
          python3 - <<'PY'
          import re,html
          raw=html.unescape(open('/tmp/cataloghi.html',encoding='utf-8',errors='ignore').read()).replace('\\/','/')
          for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',raw,re.I|re.S):
              href=m.group(1)
              text=re.sub('<[^>]+>',' ',m.group(2))
              text=' '.join(text.split())
              if any(k in (href+' '+text).lower() for k in ['catalog','accessor','sfoglia','2026']):
                  print('LINK',href,'TEXT',text[:160])
          print('--- lines with catalogue/accessory/iframe/data ---')
          for line in raw.splitlines():
              lo=line.lower()
              if any(k in lo for k in ['accessor','catalogo','cataloghi','iframe','data-url','data-src','dearflip','dflip']):
                  print(line[:1000])
          PY
