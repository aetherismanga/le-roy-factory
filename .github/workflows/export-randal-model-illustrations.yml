name: Export RANDAL model illustrations
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/export_randal_model_types.py'
      - '.github/workflows/export-randal-model-illustrations.yml'
      - 'assets/pdf/RANDAL-V04.pdf'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Generate illustrations from the official catalogue
        run: python scripts/export_randal_model_types.py
      - name: Commit illustrations
        run: |
          git config user.name "LRF Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/img/randal/types/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publie les schémas des modèles RANDAL V04"
          git pull --rebase origin main
          git push origin HEAD:main
