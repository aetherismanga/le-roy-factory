name: Publish RANDAL public prices
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/randal_public_prices.py'
      - '.github/workflows/publish-randal-public-prices.yml'
      - 'assets/pdf/RANDAL%20V04.pdf'

permissions:
  contents: write

concurrency:
  group: randal-public-prices
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Convert public catalogue prices
        run: python scripts/randal_public_prices.py
      - name: Publish only the converted RANDAL PDF
        run: |
          git config user.name "LRF Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/pdf/RANDAL-V04.pdf
          if git diff --cached --quiet; then
            echo "Catalogue déjà à jour"
            exit 0
          fi
          git commit -m "Publie le catalogue RANDAL avec les prix publics convertis"
          git pull --rebase origin main
          git push origin HEAD:main
