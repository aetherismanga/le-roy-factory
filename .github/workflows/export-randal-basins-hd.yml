name: Export RANDAL basin HD artwork
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/export_randal_basins_hd.py'
      - '.github/workflows/export-randal-basins-hd.yml'
permissions:
  contents: write
concurrency:
  group: randal-basins-hd
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install PyMuPDF and Pillow
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Extract basin designs from official catalogue
        run: python scripts/export_randal_basins_hd.py
      - name: Publish official basin drawings
        run: |
          git config user.name "LRF Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/img/randal/accessories/hd/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publie les schémas HD officiels des vasques RANDAL"
          git pull --rebase origin main
          git push origin HEAD:main
