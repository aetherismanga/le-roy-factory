name: Integrate Reitano correctly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-reitano.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate Reitano
        shell: bash
        run: |
          set -euo pipefail

          cat > assets/js/reitano-catalogues.js <<'EOF'
          (() => {
            const ROBINETTERIE_URL = 'assets/pdf/REITANO-Robinetterie-2026.pdf';
            const ACCESSOIRES_URL = 'assets/pdf/REITANO-Accessoire-2026-Catalogue.pdf';

            function install() {
              const grid = document.getElementById('grid-catalogues');
              if (!grid || grid.querySelector('[data-reitano-catalogue-card]')) return;

              const card = document.createElement('div');
              card.className = 'card-premium';
              card.dataset.reitanoCatalogueCard = '1';
              card.style.cssText = 'background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:4px;padding:2rem;display:flex;flex-direction:column;justify-content:space-between;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.03);min-height:260px;';
              card.innerHTML = `
                <div style="position:absolute;top:1.5rem;right:1.5rem;width:125px;height:58px;background-image:url('assets/img/reitano.svg');background-repeat:no-repeat;background-position:right top;background-size:contain;opacity:1;pointer-events:none;z-index:1;"></div>
                <div style="position:relative;z-index:2;padding-right:105px;">
                  <span style="font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:#708273;font-weight:600;">Italie</span>
                  <h3 style="font-size:1.25rem;margin:.5rem 0 1rem;color:#1a2530;">Reitano Rubinetterie</h3>
                  <p style="font-size:.9rem;color:#555;margin-bottom:1.5rem;">Robinetterie italienne et accessoires de salle de bain.</p>
                </div>
                <div style="position:relative;z-index:2;">
                  <details class="catalogue-picker">
                    <summary>☰ Voir les catalogues <span style="font-weight:600;color:#80611c;">2</span></summary>
                    <div class="catalogue-menu">
                      <div class="catalogue-row"><div><strong>Catalogue Robinetterie 2026</strong><span>Catalogue général Reitano Rubinetterie 2026.</span></div><a href="${ROBINETTERIE_URL}" target="_blank" rel="noopener" class="catalogue-link">PDF</a></div>
                      <div class="catalogue-row"><div><strong>Catalogue Accessoires 2026</strong><span>Accessoires et compléments pour la salle de bain.</span></div><a href="${ACCESSOIRES_URL}" target="_blank" rel="noopener" class="catalogue-link">PDF</a></div>
                    </div>
                  </details>
                </div>`;
              grid.appendChild(card);
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install);
            else install();
          })();
          EOF

          cat > assets/js/reitano-tarifs.js <<'EOF'
          (() => {
            const TARIF_GENERAL_URL = 'assets/pdf/Reitano%20tarif%20general%202026.pdf';
            const TARIF_ACCESSOIRES_URL = 'assets/pdf/REITANO-Accessoire-2026-Tarif.pdf';
            const norm = value => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');

            function hasAccess() {
              try {
                const s = JSON.parse(sessionStorage.getItem('lrfProSession') || 'null');
                if (!s) return false;
                if (s.isAdmin === true || s.admin === true) return true;
                const partners = Array.isArray(s.partenaires) ? s.partenaires : [];
                return partners.some(p => ['reitano','reitanorubinetteria'].includes(norm(p)));
              } catch (_) { return false; }
            }

            function appendCard() {
              const grid = document.getElementById('grid-tarifs');
              if (!grid || grid.querySelector('[data-reitano-pro-card]')) return;
              const allowed = hasAccess();

              const card = document.createElement('div');
              card.className = 'card-premium';
              card.dataset.reitanoProCard = '1';
              card.style.cssText = 'padding:2rem;display:flex;flex-direction:column;justify-content:space-between;position:relative;background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.03);';
              card.innerHTML = `
                <div style="position:absolute;top:1.5rem;right:1.5rem;width:125px;height:58px;background-image:url('assets/img/reitano.svg');background-repeat:no-repeat;background-position:right top;background-size:contain;pointer-events:none;"></div>
                <div style="padding-right:105px;">
                  <span style="font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:#708273;font-weight:600;">Italie</span>
                  <h3 style="font-size:1.25rem;margin:.5rem 0 1rem;color:#1A2530;">Reitano Rubinetterie</h3>
                  <p style="font-size:.9rem;color:#555;margin-bottom:1.5rem;">Robinetterie italienne et accessoires de salle de bain.</p>
                </div>
                <div style="display:flex;flex-direction:column;gap:.75rem;">
                  <div class="pro-info-row"><div><strong style="display:block;font-size:.85rem;color:#1A2530;">Tarif général 2026</strong><span style="font-size:.75rem;color:#666;">Tarif professionnel Reitano Rubinetterie 2026.</span></div>${allowed ? `<a href="${TARIF_GENERAL_URL}" target="_blank" rel="noopener" class="btn btn-outline" style="font-size:.75rem;padding:.4rem .8rem;white-space:nowrap;">Tarifs</a>` : '<span style="font-size:.75rem;font-weight:700;color:#8a6c27;">🔒 Accès PRO requis</span>'}</div>
                  <div class="pro-info-row"><div><strong style="display:block;font-size:.85rem;color:#1A2530;">Tarif Accessoires 2026</strong><span style="font-size:.75rem;color:#666;">Tarif professionnel des accessoires Reitano.</span></div>${allowed ? `<a href="${TARIF_ACCESSOIRES_URL}" target="_blank" rel="noopener" class="btn btn-outline" style="font-size:.75rem;padding:.4rem .8rem;white-space:nowrap;">Tarifs</a>` : '<span style="font-size:.75rem;font-weight:700;color:#8a6c27;">🔒 Accès PRO requis</span>'}</div>
                </div>`;
              grid.appendChild(card);
            }

            function watch() {
              const grid = document.getElementById('grid-tarifs');
              if (!grid) return;
              appendCard();
              if (grid.dataset.reitanoObserver) return;
              grid.dataset.reitanoObserver = '1';
              new MutationObserver(appendCard).observe(grid, { childList: true });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch);
            else watch();
          })();
          EOF

          python3 - <<'PY'
          import json, re
          from pathlib import Path

          # Partenaires data: Reitano = robinetterie (pas sanitaire)
          p = Path('data/fabricants.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data = [x for x in data if x.get('id') != 'reitano-rubinetterie']
          data.append({
              'id': 'reitano-rubinetterie',
              'nom': 'Reitano Rubinetterie',
              'categorie': 'robinetterie',
              'pays': 'Italie',
              'site': 'https://www.reitano-rubinetteria.com',
              'presentation': "Fabricant italien de robinetterie et d'accessoires de salle de bain, avec des collections contemporaines et classiques."
          })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Page Partenaires: logo + données structurées
          p = Path('partenaires.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"numberOfItems": 14', '"numberOfItems": 15')
          needle = '{"@type":"ListItem","position":14,"item":{"@type":"Brand","name":"BILT"}}'
          repl = needle + ',\n        {"@type":"ListItem","position":15,"item":{"@type":"Brand","name":"Reitano Rubinetterie"}}'
          if '"name":"Reitano Rubinetterie"' not in s:
              s = s.replace(needle, repl)
          logo_needle = "else if(fab.id==='bilt')logoFile='bilt.png';"
          logo_repl = "else if(fab.id==='reitano-rubinetterie')logoFile='reitano.svg';" + logo_needle
          if "fab.id==='reitano-rubinetterie'" not in s:
              s = s.replace(logo_needle, logo_repl)
          p.write_text(s, encoding='utf-8')

          # Sélection: Reitano dans Robinetterie & miroir uniquement
          p = Path('assets/js/inspirations-v2.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("{id:'robinetterie',label:'Robinetterie & miroir',icon:'◉',partners:['Aquahome','Opal']},",
                        "{id:'robinetterie',label:'Robinetterie & miroir',icon:'◉',partners:['Aquahome','Opal','Reitano Rubinetterie']},")
          if "'Reitano Rubinetterie':" not in s:
              s = s.replace("    'Opal':{slug:'opal',logo:'assets/img/opal.png',country:'Espagne'}\n  };",
                            "    'Opal':{slug:'opal',logo:'assets/img/opal.png',country:'Espagne'},\n    'Reitano Rubinetterie':{slug:'reitano-rubinetterie',logo:'assets/img/reitano.svg',country:'Italie'}\n  };")
          s = s.replace("(slug==='elios-ceramica'&&(n==='elios'||n==='eliosceramica'))})};",
                        "(slug==='elios-ceramica'&&(n==='elios'||n==='eliosceramica'))||(slug==='reitano-rubinetterie'&&(n==='reitano'||n==='reitanorubinetteria'))})};")
          p.write_text(s, encoding='utf-8')

          # Charge les cartes Reitano dans Catalogues et Accès PRO, sans modifier le CRM
          p = Path('assets/js/pwa-install.js')
          s = p.read_text(encoding='utf-8')
          old = """/* Intégration UPTREND : catalogues, tarifs PRO et sanitaire dans Sélections. */
          (()=>{
            const path=window.location.pathname.toLowerCase();
            let src='';
            let id='';
            if(path.endsWith('catalogues.html')){src='assets/js/uptrend-catalogues.js?v=20260913-1';id='lrf-uptrend-catalogues-loader';}
            else if(path.endsWith('tarifs-pro.html')){src='assets/js/uptrend-tarifs.js?v=20260913-2';id='lrf-uptrend-tarifs-loader';}
            else if(path.endsWith('univers.html')){src='assets/js/uptrend-selection.js?v=20260913-1';id='lrf-uptrend-selection-loader';}
            if(!src||document.getElementById(id))return;
            const script=document.createElement('script');
            script.id=id;
            script.src=src;
            script.defer=true;
            (document.head||document.documentElement).appendChild(script);
          })();"""
          new = """/* Intégration UPTREND + REITANO : catalogues et tarifs PRO. UPTREND reste seul dans Sanitaire. */
          (()=>{
            const path=window.location.pathname.toLowerCase();
            const scripts=[];
            if(path.endsWith('catalogues.html')){
              scripts.push(['lrf-uptrend-catalogues-loader','assets/js/uptrend-catalogues.js?v=20260913-1']);
              scripts.push(['lrf-reitano-catalogues-loader','assets/js/reitano-catalogues.js?v=20260913-robinetterie1']);
            }else if(path.endsWith('tarifs-pro.html')){
              scripts.push(['lrf-uptrend-tarifs-loader','assets/js/uptrend-tarifs.js?v=20260913-2']);
              scripts.push(['lrf-reitano-tarifs-loader','assets/js/reitano-tarifs.js?v=20260913-robinetterie1']);
            }else if(path.endsWith('univers.html')){
              scripts.push(['lrf-uptrend-selection-loader','assets/js/uptrend-selection.js?v=20260913-1']);
            }
            scripts.forEach(([id,src])=>{
              if(document.getElementById(id))return;
              const script=document.createElement('script');
              script.id=id;
              script.src=src;
              script.defer=true;
              (document.head||document.documentElement).appendChild(script);
            });
          })();"""
          if old not in s:
              raise SystemExit('Bloc UPTREND attendu introuvable dans pwa-install.js')
          p.write_text(s.replace(old,new), encoding='utf-8')

          # Cache bust Sélection et loader public
          p = Path('univers.html')
          s = p.read_text(encoding='utf-8').replace('assets/js/inspirations-v2.js?v=20260909-stability1', 'assets/js/inspirations-v2.js?v=20260913-reitano-robinetterie1')
          p.write_text(s, encoding='utf-8')

          p = Path('assets/js/app.js')
          s = p.read_text(encoding='utf-8').replace('assets/js/pwa-install.js?v=20260913-uptrend2', 'assets/js/pwa-install.js?v=20260913-reitano-robinetterie1')
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/reitano-catalogues.js assets/js/reitano-tarifs.js assets/js/inspirations-v2.js assets/js/pwa-install.js assets/js/app.js data/fabricants.json partenaires.html univers.html
          git commit -m 'Intègre Reitano dans robinetterie et miroir' || exit 0
          git push
