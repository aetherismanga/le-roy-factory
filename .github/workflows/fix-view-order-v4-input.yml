name: Fix VIEW order V4 input

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-view-order-v4-input.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep quantity input focused while typing
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('assets/js/inspirations-view-order-v4.js')
          s=p.read_text(encoding='utf-8')
          old="function qtyInput(e){if(e.target?.dataset?.field!=='qty')return;const row=e.target.closest('[data-line]'),line=lines.find(x=>x.id===Number(row?.dataset.line));if(!line)return;line.qty=Number(e.target.value||0);render();}"
          new="function qtyInput(e){if(e.target?.dataset?.field!=='qty')return;const row=e.target.closest('[data-line]'),line=lines.find(x=>x.id===Number(row?.dataset.line));if(!line)return;line.qty=Number(e.target.value||0);const c=calc(line),values=$$('.view-order-stat strong',row);if(c.type==='accessory'){if(values[2])values[2].textContent=`${c.pieces} pièce${c.pieces>1?'s':''}`;}else{if(values[2])values[2].textContent=c.boxes==null?'À confirmer':String(c.boxes);if(values[3])values[3].textContent=`${fr(c.real)} m²`;}updateTotals();}"
          if old not in s:
              raise RuntimeError('qtyInput target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check assets/js/inspirations-view-order-v4.js
      - name: Commit and push
        run: |
          git config user.name 'aetherismanga'
          git config user.email 'ccjacou@gmail.com'
          git add assets/js/inspirations-view-order-v4.js
          git commit -m 'fix: keep VIEW order quantity input stable on mobile'
          git push origin main
