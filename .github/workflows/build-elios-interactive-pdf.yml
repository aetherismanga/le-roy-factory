name: Build ELIOS interactive catalogue PDF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pymupdf requests
      - name: Build interactive ELIOS PDF
        run: |
          python tools/build-elios-interactive-pdf.py \
            --source assets/pdf/ELIOS_CATALOGUE-GENERALE-2026-1.pdf \
            --output ${{ runner.temp }}/ELIOS_Catalogue_General_2026_INTERACTIF.pdf
          test -s ${{ runner.temp }}/ELIOS_Catalogue_General_2026_INTERACTIF.pdf
      - name: Validate internal collection links
        run: |
          python - <<'PY'
          import fitz
          import re

          path = '${{ runner.temp }}/ELIOS_Catalogue_General_2026_INTERACTIF.pdf'
          doc = fitz.open(path)
          failures = []
          for collection in ('Creta', 'Roma', 'Glow', 'Yosemite'):
              matches = []
              for page_number in (1, 2):
                  page = doc[page_number]
                  for hit in page.search_for(collection):
                      for link in page.get_links():
                          if (
                              link.get('kind') == fitz.LINK_GOTO
                              and fitz.Rect(link['from']).intersects(hit)
                          ):
                              matches.append(link)
              if len(matches) != 1:
                  failures.append(
                      f'{collection}: expected one internal link, found {len(matches)}'
                  )
                  continue
              target_page = matches[0]['page']
              target_text = doc[target_page].get_text('text')
              if not re.search(
                  rf'(?i)\b{re.escape(collection)}\b',
                  target_text,
              ):
                  failures.append(
                      f'{collection}: title missing from target page {target_page + 1}'
                  )
                  continue
              print(f'{collection}: OK -> page {target_page + 1}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
      - name: Save generated PDFs for review before Firebase publication
        uses: actions/upload-artifact@v4
        with:
          name: elios-general-generated-pdf
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ELIOS_Catalogue_General_2026_INTERACTIF.pdf
