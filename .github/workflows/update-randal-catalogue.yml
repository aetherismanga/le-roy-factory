name: Update Randal catalogue

on:
  issues:
    types: [opened]
  push:
    paths:
      - '.github/workflows/update-randal-catalogue.yml'

permissions:
  contents: write
  issues: write

jobs:
  update-randal:
    if: github.event_name == 'push' || github.event.issue.title == 'RUN-RANDAL-CATALOGUE-UPDATE'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest Randal PDF
        shell: bash
        run: |
          set -euo pipefail
          URL='https://randalsa-my.sharepoint.com/:b:/g/personal/zahra_terrar_randal_group/IQA0wkWf5CD8QYHWQ0oCJgWDAXNDSTHDLQ8FH7CDYqqoSKc?e=aLENbv&download=1'
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$URL" -o /tmp/randal-latest.pdf
          echo "Downloaded content type: $(file -b --mime-type /tmp/randal-latest.pdf)"
          if [ "$(head -c 4 /tmp/randal-latest.pdf)" != '%PDF' ]; then
            echo "SharePoint returned HTML; extracting download candidates..."
            python3 - <<'PY'
          from pathlib import Path
          import re, html
          s = Path('/tmp/randal-latest.pdf').read_text(errors='ignore')
          s2 = html.unescape(s).replace('\\u0026','&').replace('\\/','/')
          pats = [
              r'https?://[^"\'<> ]+(?:download|Download)[^"\'<> ]*',
              r'https?://[^"\'<> ]+\.pdf(?:\?[^"\'<> ]*)?',
              r'[^"\']*(?:downloadUrl|download\.aspx|Download\.aspx)[^"\']*'
          ]
          seen=[]
          for pat in pats:
              for m in re.findall(pat,s2,re.I):
                  if isinstance(m,tuple): m=''.join(m)
                  m=m[:1500]
                  if m not in seen:
                      seen.append(m)
          print("CANDIDATES_START")
          for x in seen[:30]: print(x)
          print("CANDIDATES_END")
          raise SystemExit("No direct PDF received")
          PY
          fi
          SIZE=$(stat -c%s /tmp/randal-latest.pdf)
          echo "Randal PDF size: $SIZE bytes"
          if [ "$SIZE" -ge 25000000 ]; then
            echo "ERROR: file is 25 MB or larger; catalogue not replaced."
            exit 42
          fi
          echo "RANDAL_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Replace old catalogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/pdf
          while IFS= read -r f; do
            [ "$f" = "assets/pdf/RANDAL03.pdf" ] || git rm -f --ignore-unmatch "$f"
          done < <(git ls-files 'assets/pdf/*' | grep -Ei '/randal.*\.pdf$' || true)
          cp /tmp/randal-latest.pdf assets/pdf/RANDAL03.pdf
          python3 - <<'PY'
          from pathlib import Path
          p = Path('catalogues.html')
          s = p.read_text(encoding='utf-8')
          old = "{ titre:'Catalogues Randal', desc:'Collections et téléchargements officiels.', lien:'https://randal.group/colecciones/' }"
          new = "{ titre:'Catalogue Randal 2026', desc:'Catalogue Randal Pro 2026 — mise à jour du 31/08/2026.', lien:'assets/pdf/RANDAL03.pdf' }"
          if old not in s:
              raise SystemExit('Bloc Randal attendu introuvable dans catalogues.html')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update Randal catalogue 2026 (${RANDAL_SIZE} bytes)"
            git push
          fi

      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Catalogue Randal update workflow completed."
