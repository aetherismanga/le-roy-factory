name: Prepare R11 illustrated catalogue

on:
  push:
    branches: [codex/r11-navigation-20261113]
    paths:
      - scripts/build-r11-pdf.py
      - .github/workflows/build-r11-catalogue.yml

permissions:
  contents: write

jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/build-r11-pdf.py
            assets/data/r11-catalogue.json
            assets/img
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: |
          python -m pip install Pillow==13.0.0 reportlab==4.4.9 pypdf==6.21.4
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-dejavu-core
          fi
      - name: Generate catalogue and HD collection images
        run: python scripts/build-r11-pdf.py
      - name: Verify pages and thickness badges
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          index = json.loads(Path('assets/data/r11-pdf-index.json').read_text())
          pdf = PdfReader('assets/pdf/selection-lrf-exterieur-r11.pdf')
          normalize = lambda value: ' '.join(value.replace('’', "'").split())
          assert len(pdf.pages) == index['pageCount']
          assert len(index['collections']) == 62
          for col in index['collections']:
              page = normalize(pdf.pages[col['page'] - 1].extract_text())
              assert normalize(col['name']) in page, col['id']
              assert ('20 mm' in page) == col['has20mm'], col['id']
              assert Path(col['image']).is_file(), col['id']
          print('Verified all 62 collection destinations, images and badges.')
          PY
      - name: Save generated files on the preparation branch
        run: |
          git add --sparse assets/pdf/selection-lrf-exterieur-r11.pdf assets/data/r11-pdf-index.json assets/img/r11-collection-hd
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate illustrated R11 PDF and native HD collection images"
          git push origin HEAD:${{ github.ref_name }}
