name: Deploy Firebase Functions

on:
  workflow_dispatch:
    inputs:
      function_group:
        description: Functions to publish
        type: choice
        default: affected
        options:
          - affected
          - analytics
          - neobath-anima
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'assets/js/lrf-plan-pose/app.mjs'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase-functions.yml'

concurrency:
  group: firebase-functions-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy secured CRM functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        working-directory: functions
        run: npm install --omit=dev

      - name: Prepare the private PLAN & POSE application
        run: node functions/scripts/prepare-plan-pose.cjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LE_ROY_FACTORY }}'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify Firestore database edition and project lifecycle invariants
        working-directory: functions
        run: |
          node --test test/plan-pose-access.test.cjs
          node --test test/neobath-anima-access.test.cjs
          node --test test/neobath-anima-projects.test.cjs
          node --test test/neobath-anima-studio-projects.test.cjs
          node --test test/configurator-projects.test.cjs
          node --test test/configurator-purchase-prices.test.cjs
          node --test test/fenice-request.test.cjs
          node --test test/biopietra-request.test.cjs
          node --test test/cerastone-request.test.cjs
          node --test test/bulbo-tariff.test.cjs
          node --test test/group-mail-history.test.cjs
          node --test ../scripts/test-comptes-rendus-snapshots.cjs
          node --test ../tests/lrf-order-analytics-contract.test.mjs ../tests/firebase-analytics-release.test.mjs
          node - <<'JS'
          const {GoogleAuth}=require('google-auth-library');
          (async()=>{const client=await new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform']}).getClient();const {data}=await client.request({url:'https://firestore.googleapis.com/v1/projects/le-roy-factory/databases/(default)'});console.log(JSON.stringify({name:data.name,type:data.type,databaseEdition:data.databaseEdition||'STANDARD_LEGACY'}));if(data.type!=='FIRESTORE_NATIVE'||data.databaseEdition==='ENTERPRISE')throw Error('Expected existing native Standard Firestore database.');})().catch(e=>{console.error(e.message);process.exit(1);});
          JS

      - name: Select affected functions
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          FUNCTION_GROUP: ${{ inputs.function_group || 'affected' }}
        run: |
          python - <<'PYTHON'
          import os, subprocess
          changed=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD','--','functions','assets/js/lrf-plan-pose/app.mjs'],text=True).splitlines()
          mail_consolidation='functions/scripts/consolidate-group-mail-reports.cjs' in changed and os.environ['EVENT_NAME']=='push'
          mail_verify_only=changed==['functions/scripts/verify-group-mail-deployment.cjs']
          mail_only=bool(changed) and all(p in ['functions/index.js','functions/group-mail-history.js','functions/scripts/backfill-group-mail-reports.cjs','functions/scripts/verify-group-mail-deployment.cjs','functions/test/group-mail-history.test.cjs'] for p in changed)
          plan_pose_only=bool(changed) and all(p in ['functions/entry.js','functions/plan-pose-access.js','functions/plan-pose-access-core.cjs','functions/scripts/prepare-plan-pose.cjs','functions/test/plan-pose-access.test.cjs','assets/js/lrf-plan-pose/app.mjs'] or p.startswith('functions/plan-pose/') for p in changed)
          analytics_only=bool(changed) and all(p == 'functions/lrf-analytics.js' for p in changed)
          neobath_only=bool(changed) and all(p == 'functions/entry.js' or p.startswith(('functions/neobath-anima-','functions/neobath-anima/','functions/test/neobath-anima-')) for p in changed)
          tariff_only=bool(changed) and all(p in ['functions/tariff-access.js','functions/test/bulbo-tariff.test.cjs'] for p in changed)
          project_only=bool(changed) and all(p in ['functions/entry.js','functions/configurator-projects.js','functions/configurator-projects-core.js','functions/test/configurator-projects.test.cjs'] for p in changed)
          purchase_only=bool(changed) and all(p in ['functions/entry.js','functions/configurator-purchase-prices.js','functions/configurator-purchase-prices-core.js','functions/test/configurator-purchase-prices.test.cjs'] for p in changed)
          fenice_only=bool(changed) and all(p in ['functions/entry.js','functions/fenice-request.js','functions/fenice-request-core.js','functions/fenice-packaging.json','functions/fenice-packaging.mjs','functions/test/fenice-request.test.cjs'] for p in changed)
          biopietra_only=bool(changed) and all(p in ['functions/entry.js','functions/biopietra-request.js','functions/biopietra-request-core.js','functions/biopietra-catalogue.json','functions/test/biopietra-request.test.cjs'] for p in changed)
          cerastone_only=bool(changed) and all(p in ['functions/entry.js','functions/cerastone-request.js','functions/cerastone-request-core.js','functions/cerastone-quantities.js','functions/cerastone-catalogue.json.gz','functions/cerastone-catalogue.manifest.json','functions/test/cerastone-request.test.cjs'] for p in changed)
          target='functions:getLrfAnalytics' if os.environ['FUNCTION_GROUP']=='analytics' or (os.environ['FUNCTION_GROUP']=='affected' and analytics_only and os.environ['EVENT_NAME']=='push') else 'functions:neobathAnimaApplication' if os.environ['FUNCTION_GROUP']=='neobath-anima' or (neobath_only and os.environ['EVENT_NAME']=='push') else 'functions:sendGroupEmail,functions:scheduleGroupEmail' if mail_consolidation else 'functions:planPoseApplication' if plan_pose_only and os.environ['EVENT_NAME']=='push' else 'functions:sendGroupEmail,functions:scheduleGroupEmail,functions:processScheduledEmails' if mail_only and os.environ['EVENT_NAME']=='push' else 'functions:cerastoneRequest' if cerastone_only and os.environ['EVENT_NAME']=='push' else 'functions:getTariffPdf' if tariff_only and os.environ['EVENT_NAME']=='push' else 'functions:biopietraRequest' if biopietra_only and os.environ['EVENT_NAME']=='push' else 'functions:feniceRequest' if fenice_only and os.environ['EVENT_NAME']=='push' else 'functions:getConfiguratorPurchasePrices' if purchase_only and os.environ['EVENT_NAME']=='push' else 'functions:randalProjects' if project_only and os.environ['EVENT_NAME']=='push' else 'functions:getTariffPdf,functions:getNeobathDnaTariff,functions:createProSession,functions:validateProSession,functions:revokeProSession,functions:trackLrfActivity,functions:getLrfAnalytics,functions:eliosStock,functions:eliosOrder,functions:eliosPoseOrder,functions:eliosCatalog,functions:biltOrder,functions:biltDecision,functions:biltScheduleAutoRelease,functions:biltAutoReleaseSweep,functions:crmFilesUpload,functions:siteControl,functions:aquahomeCatalog,functions:reitanoCatalog,functions:randalProjects,functions:getConfiguratorPurchasePrices,functions:feniceRequest,functions:biopietraRequest,functions:cerastoneRequest,functions:planPoseApplication,functions:neobathAnimaApplication'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('only='+target+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('mail_verify_only='+str(mail_verify_only).lower()+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('group_mail_consolidation='+str(mail_consolidation).lower()+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('group_mail_backfill='+str(not mail_consolidation and mail_only and (mail_verify_only or 'functions/scripts/backfill-group-mail-reports.cjs' in changed)).lower()+'\n')
          PYTHON

      - name: Deploy secured tariff, session, analytics, ELIOS, BILT, CRM file and site control functions
        if: steps.targets.outputs.mail_verify_only != 'true'
        run: >-
          firebase deploy
          --project le-roy-factory
          --only ${{ steps.targets.outputs.only }}
          --non-interactive

      - name: Verify analytics version and authenticated access
        if: contains(steps.targets.outputs.only, 'functions:getLrfAnalytics')
        run: |
          node - <<'JS'
          (async()=>{
            const response=await fetch('https://us-central1-le-roy-factory.cloudfunctions.net/getLrfAnalytics',{method:'POST',headers:{'Content-Type':'application/json',Origin:'https://leroyfactory.fr'},body:'{}'});
            const body=await response.json();
            if(response.status!==401||body.success!==false||response.headers.get('x-lrf-analytics-version')!=='20261103-reports2')throw Error('Analytics release or authentication check failed: '+response.status);
            console.log('Client analytics release 20261103-reports2 ready; unauthenticated access rejected. No client data read or written.');
          })().catch(error=>{console.error(error.message);process.exit(1);});
          JS

      - name: Verify protected BULBO tariff rejects unauthenticated access
        if: contains(steps.targets.outputs.only, 'functions:getTariffPdf')
        run: |
          node - <<'JS'
          (async()=>{
            const response=await fetch('https://gettariffpdf-5m3lsyu7bq-uc.a.run.app',{method:'POST',headers:{'Content-Type':'application/json',Origin:'https://leroyfactory.fr'},body:JSON.stringify({tariffId:'bulbo-2026'})});
            const body=await response.json();
            if(response.status!==403||body.success!==false)throw Error('BULBO tariff authentication check failed: '+response.status);
            console.log('BULBO tariff endpoint ready; unauthenticated access rejected. No private PDF or client activity created.');
          })().catch(error=>{console.error(error.message);process.exit(1);});
          JS

      - name: Verify project endpoint rejects unauthenticated access
        if: steps.targets.outputs.only != 'functions:neobathAnimaApplication' && steps.targets.outputs.only != 'functions:planPoseApplication' && steps.targets.outputs.only != 'functions:feniceRequest' && steps.targets.outputs.only != 'functions:biopietraRequest' && steps.targets.outputs.only != 'functions:cerastoneRequest' && !contains(steps.targets.outputs.only, 'functions:sendGroupEmail')
        run: |
          node - <<'JS'
          (async()=>{const r=await fetch('https://us-central1-le-roy-factory.cloudfunctions.net/randalProjects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list',variant:'studio-one'})});const body=await r.json();if(r.status!==401||body.success!==false)throw Error('Project endpoint authentication check failed: '+r.status);console.log('RANDAL project API ready; unauthenticated access rejected. No project or email created.');})().catch(e=>{console.error(e.message);process.exit(1);});
          JS

      - name: Verify La Fenice request validation without sending an email
        if: contains(steps.targets.outputs.only, 'functions:feniceRequest')
        run: |
          node - <<'JS'
          (async()=>{
            const url='https://us-central1-le-roy-factory.cloudfunctions.net/feniceRequest';
            const checks=[
              {method:'GET',origin:'https://leroyfactory.fr',status:405},
              {method:'POST',origin:'https://leroyfactory.fr',body:'{}',status:400},
              {method:'POST',origin:'https://not-authorized.invalid',body:'{}',status:403}
            ];
            for(const check of checks){
              const response=await fetch(url,{method:check.method,headers:{'Content-Type':'application/json',Origin:check.origin},...(check.body?{body:check.body}:{})});
              const body=await response.json();
              if(response.status!==check.status||body.success!==false)throw Error('La Fenice request validation failed: '+response.status+' expected '+check.status);
            }
            console.log('La Fenice request API ready; method, required fields and origin rejected as expected. No email or inquiry created.');
          })().catch(e=>{console.error(e.message);process.exit(1);});
          JS

      - name: Verify Biopietra request validation without sending an email
        if: contains(steps.targets.outputs.only, 'functions:biopietraRequest')
        run: |
          node - <<'JS'
          (async()=>{
            const url='https://us-central1-le-roy-factory.cloudfunctions.net/biopietraRequest';
            const checks=[
              {method:'GET',origin:'https://leroyfactory.fr',status:405},
              {method:'POST',origin:'https://leroyfactory.fr',body:'{}',status:400},
              {method:'POST',origin:'https://not-authorized.invalid',body:'{}',status:403}
            ];
            for(const check of checks){
              const response=await fetch(url,{method:check.method,headers:{'Content-Type':'application/json',Origin:check.origin},...(check.body?{body:check.body}:{})});
              const body=await response.json();
              if(response.status!==check.status||body.success!==false)throw Error('Biopietra request validation failed: '+response.status+' expected '+check.status);
            }
            console.log('Biopietra endpoint validation verified. No email sent.');
          })().catch(e=>{console.error(e.message);process.exit(1);});
          JS

      - name: Verify CeraStone request validation without sending an email
        if: contains(steps.targets.outputs.only, 'functions:cerastoneRequest')
        run: |
          node - <<'JS'
          (async()=>{
            const url='https://us-central1-le-roy-factory.cloudfunctions.net/cerastoneRequest';
            for(const check of [{method:'GET',origin:'https://cera-stone-atelier.ccjacou.chatgpt.site',status:405},{method:'POST',origin:'https://cera-stone-atelier.ccjacou.chatgpt.site',body:'{}',status:400},{method:'POST',origin:'https://unauthorized.invalid',body:'{}',status:403}]){
              const r=await fetch(url,{method:check.method,headers:{'Content-Type':'application/json',Origin:check.origin},...(check.body?{body:check.body}:{})});
              const data=await r.json();if(r.status!==check.status||data.success!==false)throw Error('CeraStone request validation failed: '+r.status);
            }
            console.log('CeraStone endpoint ready; origins, methods and malformed requests checked. No email sent.');
          })().catch(e=>{console.error(e.message);process.exit(1);});
          JS

      - name: Update the mail worker source without changing its scheduler
        if: steps.targets.outputs.group_mail_consolidation == 'true'
        working-directory: functions
        env:
          GOOGLE_CLOUD_PROJECT: le-roy-factory
        run: node scripts/update-group-mail-worker-source.cjs

      - name: Verify active bulk mail source without changing the existing scheduler
        if: contains(steps.targets.outputs.only, 'functions:sendGroupEmail')
        working-directory: functions
        env:
          GOOGLE_CLOUD_PROJECT: le-roy-factory
        run: node scripts/verify-group-mail-deployment.cjs

      - name: Verify bulk mail endpoints reject unauthenticated requests
        if: contains(steps.targets.outputs.only, 'functions:sendGroupEmail')
        run: |
          node - <<'JS'
          (async()=>{
            for(const name of ['sendGroupEmail','scheduleGroupEmail']){
              const r=await fetch('https://us-central1-le-roy-factory.cloudfunctions.net/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
              if(r.status!==401)throw new Error('Unexpected bulk mail authentication result: '+r.status);
            }
            console.log('Bulk mail authentication verified. No email sent and no scheduled job changed.');
          })().catch(error=>{console.error(error.message);process.exit(1);});
          JS

      - name: Consolidate Studio One into one short global report
        if: steps.targets.outputs.group_mail_consolidation == 'true'
        working-directory: functions
        env:
          GOOGLE_CLOUD_PROJECT: le-roy-factory
        run: node scripts/consolidate-group-mail-reports.cjs

      - name: Record the confirmed Studio One campaign in client reports
        if: steps.targets.outputs.group_mail_backfill == 'true' && github.event_name == 'push'
        working-directory: functions
        env:
          GOOGLE_CLOUD_PROJECT: le-roy-factory
          CAMPAIGN_DATE: '2026-11-02'
          CAMPAIGN_SUBJECT: 'Comment configurer votre meuble STUDIO ONE en 4 étapes'
          CAMPAIGN_SENDER: jerome@leroyfactory.fr
          CAMPAIGN_MIN_RECIPIENTS: '195'
          CAMPAIGN_MAX_RECIPIENTS: '333'
          CAMPAIGN_ATTACHMENT: STUDIO_ONE_Flyer_FR_Corrige.pdf
        run: node scripts/backfill-group-mail-reports.cjs

      - name: Verify PLAN & POSE rejects public and forged access
        if: contains(steps.targets.outputs.only, 'functions:planPoseApplication')
        run: |
          node - <<'JS'
          (async()=>{
            const url='https://us-central1-le-roy-factory.cloudfunctions.net/planPoseApplication';
            for(const auth of ['', 'Bearer forged-owner-token']){
              const r=await fetch(url,{method:'POST',headers:{Origin:'https://leroyfactory.fr','Content-Type':'application/json',...(auth?{Authorization:auth}:{})},body:JSON.stringify({isAdmin:true,email:'jerome@leroyfactory.fr'})});
              const data=await r.json();
              if(r.status!==401||data.success!==false||data.html||data.module)throw Error('PLAN & POSE access check failed: '+r.status);
            }
            console.log('PLAN & POSE private endpoint ready; anonymous requests and forged administrator flags rejected.');
          })().catch(e=>{console.error(e.message);process.exit(1);});
          JS

      - name: Verify Neobath Anima rejects public and forged access
        if: contains(steps.targets.outputs.only, 'functions:neobathAnimaApplication')
        run: |
          node - <<'JS'
          (async()=>{
            const url='https://us-central1-le-roy-factory.cloudfunctions.net/neobathAnimaApplication';
            for(const action of ['authorize','application','projects-list','projects-save','projects-delete'])for(const auth of ['', 'Bearer forged-agent-token']){
              const r=await fetch(url,{method:'POST',headers:{Origin:'https://leroyfactory.fr','Content-Type':'application/json',...(auth?{Authorization:auth}:{})},body:JSON.stringify({action,isAdmin:true,email:'jerome@leroyfactory.fr'})});
              const data=await r.json();
              if(r.status!==401||data.success!==false||data.html||data.module||data.catalogue||data.projects)throw Error('Neobath Anima access check failed: '+r.status);
            }
            console.log('Neobath Anima private endpoint ready; anonymous requests and forged agent flags rejected.');
          })().catch(e=>{console.error(e.message);process.exit(1);});
          JS
