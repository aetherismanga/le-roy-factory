name: Add UPTREND catalogue cover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-uptrend-cover.yml'

permissions:
  contents: write

jobs:
  build-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create catalogue cover image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -L --fail --retry 3 'https://artesinna.fr/wp-content/uploads/2026/02/2026-Uptrend-France-Catalogue-Sanitaire-Ceramique.pdf' -o /tmp/uptrend.pdf
          mkdir -p assets/img
          pdftoppm -f 1 -singlefile -jpeg -r 110 -jpegopt quality=82,progressive=y,optimize=y /tmp/uptrend.pdf /tmp/uptrend-cover
          mv /tmp/uptrend-cover.jpg assets/img/uptrend-catalogue-2026.jpg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/uptrend-catalogue-2026.jpg
          git commit -m 'Ajoute la couverture du catalogue UPTREND 2026' || exit 0
          git push
