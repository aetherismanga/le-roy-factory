name: Publish COSMOS catalogue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-cosmos-catalogue.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download uploaded PDF
        shell: bash
        env:
          PDF_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-1e08-81f4-9776-98edf10794aa/raw?se=2026-09-16T10%3A41%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=0f5d9c54-a550-52a1-aca8-8914efd8fe13&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T06%3A09%3A38Z&ske=2026-09-17T06%3A09%3A38Z&sks=b&skv=2026-02-06&sig=W4UR6h7VMGu2gI8a7wvXo6kLXCf7m%2BGFiBKyP0b%2BKUs%3D"
        run: |
          mkdir -p assets/pdf
          curl -L --fail --retry 2 --connect-timeout 20 "$PDF_URL" -o assets/pdf/CIELO-MOLLE-COSMOS-Sans-tarif-BD.pdf
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/pdf/CIELO-MOLLE-COSMOS-Sans-tarif-BD.pdf')
          data=p.read_bytes()
          print('Downloaded', len(data), 'bytes')
          if len(data) != 1583198:
              raise SystemExit(f'Unexpected PDF size: {len(data)}')
          if not data.startswith(b'%PDF-'):
              raise SystemExit('Downloaded file is not a PDF')
          if b'%%EOF' not in data[-4096:]:
              raise SystemExit('PDF EOF marker missing')
          PY

      - name: Add catalogue link under Reitano
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('catalogues.html')
          s = p.read_text(encoding='utf-8')
          marker = "          { titre:'Catalogue Accessoires 2026', desc:'Accessoires et compléments Reitano pour la salle de bain.', lien:'assets/pdf/REITANO-Accessoire-2026-Catalogue.pdf' }"
          addition = marker + ",\n          { titre:'CIELO • MOLLE • COSMOS', desc:'Catalogue des ciels de douche COSMOS avec système SpringFix — version sans tarif.', lien:'assets/pdf/CIELO-MOLLE-COSMOS-Sans-tarif-BD.pdf' }"
          if 'CIELO-MOLLE-COSMOS-Sans-tarif-BD.pdf' not in s:
              if marker not in s:
                  raise SystemExit('Reitano catalogue marker not found in catalogues.html')
              s = s.replace(marker, addition, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit PDF and catalogue entry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pdf/CIELO-MOLLE-COSMOS-Sans-tarif-BD.pdf catalogues.html
          git rm -r --ignore-unmatch tmp/cosmos_upload tmp/cosmos_clean tmp/cosmos_v2 tmp/cosmos_v3
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: add CIELO MOLLE COSMOS catalogue to Reitano"
          git push origin HEAD:main
