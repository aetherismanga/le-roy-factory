name: Fetch UPTREND catalogue 2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-uptrend-catalogue.yml'

permissions:
  contents: write

jobs:
  fetch-catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify official UPTREND catalogue
        run: |
          python -m pip install --disable-pip-version-check pymupdf
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            'https://artesinna.fr/wp-content/uploads/2026/02/2026-Uptrend-France-Catalogue-Sanitaire-Ceramique.pdf' \
            -o /tmp/UPTREND_Catalogue_2026.pdf
          python - <<'PY'
          import fitz
          from pathlib import Path
          source=Path('/tmp/UPTREND_Catalogue_2026.pdf')
          assert source.stat().st_size > 40_000_000, source.stat().st_size
          doc=fitz.open(source)
          assert len(doc)==60, len(doc)
          assert 'TR-T310' in doc[13].get_text(), 'TR-T310 missing on page 14'
          doc.close()
          target=Path('assets/pdf/UPTREND_Catalogue_2026.pdf')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(source.read_bytes())
          print(target, target.stat().st_size)
          PY
      - name: Commit catalogue to the site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pdf/UPTREND_Catalogue_2026.pdf
          if git diff --cached --quiet; then
            echo 'Catalogue already up to date.'
            exit 0
          fi
          git commit -m 'Ajoute le catalogue officiel UPTREND 2026'
          git push origin HEAD:main
