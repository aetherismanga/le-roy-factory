name: Fetch UPTREND catalogue 2026

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify official UPTREND catalogue
        run: |
          python -m pip install --disable-pip-version-check pymupdf
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            'https://artesinna.fr/wp-content/uploads/2026/02/2026-Uptrend-France-Catalogue-Sanitaire-Ceramique.pdf' \
            -o /tmp/UPTREND_Catalogue_2026.pdf
          python - <<'PY'
          import fitz
          from pathlib import Path
          source=Path('/tmp/UPTREND_Catalogue_2026.pdf')
          assert source.stat().st_size > 40_000_000, source.stat().st_size
          doc=fitz.open(source)
          assert len(doc)==60, len(doc)
          assert 'TR-T310' in doc[13].get_text(), 'TR-T310 missing on page 14'
          doc.close()
          target=Path('${{ runner.temp }}/UPTREND_Catalogue_2026.pdf')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(source.read_bytes())
          print(target, target.stat().st_size)
          PY
      - name: Save catalogue for review before Firebase publication
        uses: actions/upload-artifact@v4
        with:
          name: uptrend-validated-catalogue
          if-no-files-found: error
          path: ${{ runner.temp }}/UPTREND_Catalogue_2026.pdf
