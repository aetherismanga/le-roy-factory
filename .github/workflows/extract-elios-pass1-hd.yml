name: Extract Elios Pass 1 HD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-elios-pass1-hd.yml'

permissions:
  contents: write

jobs:
  extract-hd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Extract original Elios PDF images and build galleries
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import pymupdf as fitz
          import hashlib
          import json
          import re
          import urllib.request

          ROOT = Path('.')
          TMP = ROOT / '.tmp-elios-pass1'
          TMP.mkdir(exist_ok=True)

          def download(url, dest):
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
                  'Accept': 'application/pdf,*/*;q=0.8',
                  'Referer': 'https://eliosceramica.com/download/'
              })
              with urllib.request.urlopen(req, timeout=120) as r:
                  dest.write_bytes(r.read())
              if dest.stat().st_size < 300_000:
                  raise RuntimeError(f'PDF download too small: {url} -> {dest.stat().st_size} bytes')
              print(f'Downloaded {url}: {dest.stat().st_size / 1024 / 1024:.1f} MB')

          quercia_pdf = TMP / 'elios-quercia.pdf'
          yosemite_pdf = TMP / 'elios-yosemite.pdf'
          download('https://eliosceramica.com/wp-content/uploads/2022/11/Elios_catalogo_QUERCIA.pdf', quercia_pdf)
          download('https://eliosceramica.com/wp-content/uploads/2023/12/Elios_YOSEMITE_catalogo_completo_converted.pdf', yosemite_pdf)

          def page_candidates(doc, page):
              found = []
              seen = set()
              for item in page.get_images(full=True):
                  xref = item[0]
                  if xref in seen:
                      continue
                  seen.add(xref)
                  try:
                      info = doc.extract_image(xref)
                  except Exception:
                      continue
                  w = int(info.get('width') or 0)
                  h = int(info.get('height') or 0)
                  if w < 500 or h < 500:
                      continue
                  rects = page.get_image_rects(xref)
                  display = 0
                  if rects:
                      display = max(abs(r.width * r.height) for r in rects)
                  found.append({'xref': xref, 'pixels': w*h, 'display': display, 'info': info})
              return sorted(found, key=lambda x: (x['display'], x['pixels']), reverse=True)

          def save_candidate(candidate, stem):
              info = candidate['info']
              ext = (info.get('ext') or 'jpg').lower()
              if ext == 'jpeg': ext = 'jpg'
              path = Path(str(stem) + '.' + ext)
              path.parent.mkdir(parents=True, exist_ok=True)
              # Exact embedded stream from the official PDF: no resize, no re-encode.
              path.write_bytes(info['image'])
              return path.as_posix()

          def extract_sections(pdf_path, out_dir, prefix, ranges):
              doc = fitz.open(pdf_path)
              out_dir.mkdir(parents=True, exist_ok=True)
              variants = {}
              for color, pages in ranges.items():
                  saved = []
                  hashes = set()
                  for page_no in pages:
                      if page_no >= len(doc):
                          continue
                      candidates = page_candidates(doc, doc[page_no])
                      if not candidates:
                          continue
                      # The largest displayed raster on each official GALLERY page is the ambience image.
                      candidate = candidates[0]
                      raw = candidate['info']['image']
                      digest = hashlib.sha1(raw).hexdigest()
                      if digest in hashes:
                          continue
                      hashes.add(digest)
                      saved.append(save_candidate(candidate, out_dir / f'{prefix}-{color.lower()}-{len(saved)+1:02d}'))
                  if not saved:
                      raise RuntimeError(f'{prefix}: no image for {color}, pages={pages}')
                  variants[color] = saved
              doc.close()
              return variants

          # Standalone Elios catalogues: page ranges confirmed by the official GALLERY labels.
          quercia = extract_sections(
              quercia_pdf,
              ROOT / 'assets/img/elios/quercia',
              'quercia',
              {
                  'Honey': [7,8,9],
                  'Amber': [10,11,12],
                  'Natural': [13,14,15],
                  'White': [16,17,18],
              }
          )

          yosemite = extract_sections(
              yosemite_pdf,
              ROOT / 'assets/img/elios/yosemite',
              'yosemite',
              {
                  'Honey': [7,8,9],
                  'Amber': [10,11,12],
                  'Natural': [13,14,15],
                  'White': [16,17,18],
              }
          )

          # Exact current gallery URLs from eliosceramica.com, associated with Catalogue 2026 colours.
          mysterium = {
              'Acqua': [
                  'https://eliosceramica.com/wp-content/uploads/2023/10/ELIOS_MYSTERIUM_ACQUA_LIVING.jpg',
                  'https://eliosceramica.com/wp-content/uploads/2023/10/mysterium_amb_2-1.jpg'
              ],
              'White': ['https://eliosceramica.com/wp-content/uploads/2023/10/Mysterium_White_amb3.jpg'],
              'Amber': ['https://eliosceramica.com/wp-content/uploads/2023/10/mysterium_amb_3-1.jpg'],
              'Ocean': [
                  'https://eliosceramica.com/wp-content/uploads/2023/10/ELIOS_MYSTERIUM_OCEAN_BAGNO.jpg',
                  'https://eliosceramica.com/wp-content/uploads/2023/10/mysterium_amb_3-1.jpg'
              ],
              'Pearl': [
                  'https://eliosceramica.com/wp-content/uploads/2023/10/ELIOS_MYSTERIUM_PEARL_COMMERCIALE.jpg',
                  'https://eliosceramica.com/wp-content/uploads/2023/10/Mysterium_Pearl_amb2.jpg',
                  'https://eliosceramica.com/wp-content/uploads/2023/10/Mysterium_Pearl_amb1.jpg'
              ],
              'Black': ['https://eliosceramica.com/wp-content/uploads/2023/10/mysterium_amb_2-1.jpg']
          }

          def flatten(d, order):
              out=[]
              for key in order:
                  for src in d[key]:
                      if src not in out: out.append(src)
              return out

          official = {
              'quercia': flatten(quercia, ['White','Natural','Honey','Amber']),
              'yosemite': flatten(yosemite, ['Natural','Honey','White','Amber']),
              'mysterium': flatten(mysterium, ['Acqua','White','Amber','Ocean','Pearl','Black'])
          }
          variants = {'quercia': quercia, 'yosemite': yosemite, 'mysterium': mysterium}

          js = (
              '// ELIOS pass 1 HD — sources officielles uniquement.\n'
              '// Quercia/Yosemite: streams originaux extraits des catalogues Elios, sans recompression.\n'
              '// Mysterium: URLs natives de la galerie officielle Elios.\n'
              'Object.assign(window.ELIOS_OFFICIAL_GALLERIES ||= {}, '
              + json.dumps(official, ensure_ascii=False, indent=2)
              + ');\n\nObject.assign(window.ELIOS_VERIFIED_VARIANTS ||= {}, '
              + json.dumps(variants, ensure_ascii=False, indent=2)
              + ');\n'
          )
          (ROOT/'assets/js/inspirations-elios-pass1-hd.js').write_text(js, encoding='utf-8')

          univers = ROOT/'univers.html'
          html = univers.read_text(encoding='utf-8')
          script = '  <script src="assets/js/inspirations-elios-pass1-hd.js?v=20260902-pass1hd2"></script>\n'
          if 'inspirations-elios-pass1-hd.js' not in html:
              marker = '  <script src="assets/js/inspirations-elios-slate-hd.js'
              pos = html.find(marker)
              if pos < 0: raise RuntimeError('Slate script marker missing')
              html = html[:pos] + script + html[pos:]
          else:
              html = re.sub(r'<script src="assets/js/inspirations-elios-pass1-hd\.js\?v=[^"]+"></script>', '<script src="assets/js/inspirations-elios-pass1-hd.js?v=20260902-pass1hd2"></script>', html)
          html = re.sub(r'assets/js/inspirations-elios-gallery-v2\.js\?v=[^"]+', 'assets/js/inspirations-elios-gallery-v2.js?v=20260902-pass1hd2', html)
          univers.write_text(html, encoding='utf-8')

          print(json.dumps(variants, indent=2))
          PY

      - name: Verify generated source files
        run: |
          test -s assets/js/inspirations-elios-pass1-hd.js
          test -d assets/img/elios/quercia
          test -d assets/img/elios/yosemite
          grep -q 'inspirations-elios-pass1-hd.js?v=20260902-pass1hd2' univers.html
          grep -q 'inspirations-elios-gallery-v2.js?v=20260902-pass1hd2' univers.html
          find assets/img/elios/quercia assets/img/elios/yosemite -type f -print -exec ls -lh {} \;

      - name: Commit HD pass 1 to main
        run: |
          git config user.name 'aetherismanga'
          git config user.email 'ccjacou@gmail.com'
          git add assets/img/elios/quercia assets/img/elios/yosemite assets/js/inspirations-elios-pass1-hd.js univers.html
          git diff --cached --stat
          git commit -m 'Corrige Yosemite Quercia et Mysterium en HD officiel'
          git push origin HEAD:main
