name: Validate La Fenice lexicon
on:
  push:
    paths:
      - '.github/workflows/validate-fenice-lexicon.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check assets/js/fenice-lexicon-data.js
          node --check assets/js/selections-lazy-enhancements.js
          grep -q 'fenice-lexicon-data.js' univers.html
          grep -q 'Catalogue Général 2026/2027' assets/js/fenice-lexicon-data.js
          grep -q 'Nouveautés Cersaie 2026' assets/js/fenice-lexicon-data.js
