name: Discover La Fenice general catalogue
on:
  push:
    paths:
      - '.github/workflows/discover-fenice-general.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Discover links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -L --fail -A 'Mozilla/5.0' 'https://lafenicegc.com/fr/catalogues/' -o /tmp/fenice.html
          python - <<'PY'
          import re, html
          s=open('/tmp/fenice.html',encoding='utf-8',errors='ignore').read()
          urls=[]
          for u in re.findall(r'href=["\']([^"\']+)["\']', s, flags=re.I):
              u=html.unescape(u)
              if any(k in u.lower() for k in ['pdf','catalog','flip','generale','general']):
                  urls.append(u)
          lines=[]
          for u in dict.fromkeys(urls):
              lines.append(u)
          open('tmp/fenice-catalog-discovery.txt','w',encoding='utf-8').write('\n'.join(lines))
          print('\n'.join(lines))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/fenice-catalog-discovery.txt
          git commit -m 'Discover La Fenice catalogue links'
          git push
