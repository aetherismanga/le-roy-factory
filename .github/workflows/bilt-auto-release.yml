name: BILT Auto Release

# Every change to this workflow also triggers an immediate self-test.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bilt-auto-release.yml'

permissions:
  contents: read

concurrency:
  group: bilt-auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Release due BILT orders
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install authentication dependency
        working-directory: functions
        run: npm install --omit=dev

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LE_ROY_FACTORY }}'

      - name: Release BILT orders whose 72h deadline has passed
        env:
          TARGET_URL: 'https://us-central1-le-roy-factory.cloudfunctions.net/biltAutoReleaseSweep'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { JWT } = require('./functions/node_modules/google-auth-library');

          async function main() {
            const keyPath = process.env.GOOGLE_APPLICATION_CREDENTIALS;
            if (!keyPath) throw new Error('Google credentials file missing.');
            const key = JSON.parse(fs.readFileSync(keyPath, 'utf8'));
            const target = process.env.TARGET_URL;
            const jwt = new JWT({ email: key.client_email, key: key.private_key });
            const idToken = await jwt.fetchIdToken(target);
            const response = await fetch(target, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${idToken}`,
                'Content-Type': 'application/json'
              },
              body: '{}'
            });
            const text = await response.text();
            console.log(`BILT auto release HTTP ${response.status}: ${text}`);
            if (!response.ok) process.exit(1);
          }

          main().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE
