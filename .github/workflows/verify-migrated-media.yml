name: Verify migrated media and configurators
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-migrated-media.yml]
permissions:
  contents: read
jobs:
  regression:
    if: github.event.head_commit.message == 'Verify migrated media cleanup 2026-10-19'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/media-playwright" playwright@1.55.0
          "$RUNNER_TEMP/media-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run existing desktop and mobile configurator regressions
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ runner.temp }}/media-playwright/node_modules
          LRF_MEDIA_TEST_OUT: ${{ runner.temp }}/media-regression
        run: |
          mkdir -p "$LRF_MEDIA_TEST_OUT"
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/elios-phase2a/browser.cjs')
          text=p.read_text()
          updates={
            "server.listen(0,r)":"server.listen(8765,r)",
            "executablePath:'/tmp/chrome-phase1/chrome-headless-shell-linux64/chrome-headless-shell',":"",
            "out=path.join(root,'reports/elios-phase2a')":"out=process.env.LRF_MEDIA_TEST_OUT",
          }
          for old,new in updates.items():
              assert old in text,old
              text=text.replace(old,new)
          p.write_text(text)
          PY
          node tests/elios-phase2a/browser.cjs
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mobile-configurators-after-media-cleanup
          path: ${{ runner.temp }}/media-regression/
          retention-days: 30
          if-no-files-found: warn
