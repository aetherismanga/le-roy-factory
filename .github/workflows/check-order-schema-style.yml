name: Check order schema style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-order-schema-style.yml'

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh cache keys and old ELIOS page
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p=Path('univers.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'selections-lazy-enhancements\.js\?v=[^"\']+', 'selections-lazy-enhancements.js?v=20260911-order-schema2', s)
          p.write_text(s,encoding='utf-8')

          p=Path('disponibilites-elios-lot1.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'elios-stock-bootstrap\.js\?v=[^"\']+', 'elios-stock-bootstrap.js?v=20260911-order-schema2', s)
          p.write_text(s,encoding='utf-8')

          p=Path('disponibilites-elios.html')
          s=p.read_text(encoding='utf-8')
          marker='assets/js/elios-stock-page.js'
          polish='assets/js/elios-stock-schema-polish.js?v=20260911-schema-style1'
          if marker in s and polish not in s:
              m=re.search(r'<script src="assets/js/elios-stock-page\.js\?v=[^"]+"></script>',s)
              if m:
                  s=s[:m.end()]+f'\n  <script src="{polish}"></script>'+s[m.end():]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check assets/js/inspirations-view-order-v5-polish.js
          node --check assets/js/elios-stock-schema-polish.js
          node --check assets/js/selections-lazy-enhancements.js
          node --check assets/js/elios-stock-bootstrap.js
      - name: Commit and push
        run: |
          git config user.name 'aetherismanga'
          git config user.email 'ccjacou@gmail.com'
          git add univers.html disponibilites-elios-lot1.html disponibilites-elios.html
          git diff --cached --quiet || git commit -m 'chore: refresh VIEW and ELIOS order UI cache'
          git push origin main
