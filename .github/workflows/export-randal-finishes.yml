name: Export RANDAL finish swatches
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/export_randal_finishes.py'
      - '.github/workflows/export-randal-finishes.yml'
      - 'assets/pdf/RANDAL-V04.pdf'
permissions:
  contents: write
concurrency:
  group: randal-real-finishes
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and imaging dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Extract actual RANDAL samples
        run: python scripts/export_randal_finishes.py
      - name: Commit official finish previews
        run: |
          git config user.name "LRF Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/img/randal/finishes/
          if git diff --cached --quiet; then
            echo "No new samples"
            exit 0
          fi
          git commit -m "Publie 46 échantillons authentiques RANDAL V04"
          git pull --rebase origin main
          git push origin HEAD:main
