name: Export RANDAL metallic mirror finishes
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/export_randal_mirror_finishes.py'
      - '.github/workflows/export-randal-mirror-finishes.yml'

permissions:
  contents: write

concurrency:
  group: randal-metallic-mirror-finishes
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Export official frame finish samples
        run: python scripts/export_randal_mirror_finishes.py
      - name: Publish mirror samples
        run: |
          git config user.name "LRF Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/img/randal/mirror-finishes/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ajoute les 4 finitions officielles des miroirs métalliques RANDAL"
          git pull --rebase origin main
          git push origin HEAD:main
