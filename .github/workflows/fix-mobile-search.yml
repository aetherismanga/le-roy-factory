name: Fix mobile search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-search.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force mobile search refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          router = Path('assets/js/global-search-router.js')
          s = router.read_text(encoding='utf-8')
          s = s.replace('assets/css/site-search.css?v=20260907-search9', 'assets/css/site-search.css?v=20260913-mobile3')
          router.write_text(s, encoding='utf-8')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('assets/js/global-search-router.js?v=20260911-ref1', 'assets/js/global-search-router.js?v=20260913-mobile3')
          index.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/global-search-router.js index.html
          git commit -m 'Active la nouvelle recherche smartphone' || exit 0
          git push
