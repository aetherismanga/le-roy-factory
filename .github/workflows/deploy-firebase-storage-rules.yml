name: Deploy Firebase Storage Rules

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type CONFIRMER-PRODUCTION to authorize this release
        required: true
        type: string

concurrency:
  group: firebase-storage-rules-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'CONFIRMER-PRODUCTION'
    environment: firebase-production
    name: Deploy secured Storage rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LE_ROY_FACTORY }}'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Storage rules
        run: >-
          firebase deploy
          --project le-roy-factory
          --only storage:main
          --non-interactive
