name: Fenice catalogue PDF upload

on:
  push:
    paths:
      - '.github/workflows/fenice-upload-v2.yml'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PDF
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-7024-8210-a32a-4c4f938d26cb/raw?se=2026-09-18T13%3A00%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=741df940-534c-5e3f-bd0b-4c7b24bb0a9c&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T05%3A44%3A56Z&ske=2026-09-19T05%3A44%3A56Z&sks=b&skv=2026-02-06&sig=mMVKnBCTJJKqku/1WqGEVI/ml3N3gjKpxazITE1qKWM%3D'
          mkdir -p assets/pdf
          curl -fL --retry 3 --retry-delay 2 "$URL" -o assets/pdf/LA_FENICE_CERSAIE_2026.pdf
          test "$(head -c 4 assets/pdf/LA_FENICE_CERSAIE_2026.pdf)" = '%PDF'
          SIZE=$(stat -c%s assets/pdf/LA_FENICE_CERSAIE_2026.pdf)
          echo "PDF size: $SIZE"
          test "$SIZE" -lt 25000000

      - name: Commit PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pdf/LA_FENICE_CERSAIE_2026.pdf
          git commit -m 'Add La Fenice Cersaie 2026 PDF'
          git push
