name: Finalize LRF mobile brand

# Ce workflow ne doit plus s'exécuter automatiquement à chaque push :
# son script historique réappliquait d'anciennes versions de cache/branding et
# pouvait écraser les correctifs mobiles récents. Il reste disponible en manuel
# uniquement si une maintenance volontaire est nécessaire.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply final LRF mobile brand
        run: |
          python -m pip install --quiet pillow
          python .github/scripts/finalize_lrf_brand.py

      - name: Commit final brand standard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "brand: finalize mobile header, PWA, browser and Android icons"
          git push
