name: Build REITANO interactive data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/build-reitano-interactive-data.py'
      - '.github/workflows/build-reitano-interactive-data.yml'
      - 'assets/pdf/REITANO-Robinetterie-2026.pdf'
      - 'assets/pdf/Reitano tarif general 2026.pdf'

permissions:
  contents: write

concurrency:
  group: reitano-data-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.4'
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check assets/js/reitano-interactive.js
          node --check assets/js/reitano-order.js
          node --check assets/js/reitano-selection.js
          node --check functions/reitano-catalog.js
      - name: Construire et contrôler les données
        run: python tools/build-reitano-interactive-data.py
      - name: Tester la cohérence publique et privée
        run: python tests/test_reitano_data.py
      - name: Enregistrer les données validables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/reitano-products.json functions/reitano-products.json reports/reitano-extraction-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Génère les données du catalogue interactif REITANO"
          git pull --rebase origin main
          git push origin HEAD:main
