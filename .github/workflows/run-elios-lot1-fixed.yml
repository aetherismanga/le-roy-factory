name: Run Elios Lot 1 Fixed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-elios-lot1-fixed.yml'

permissions:
  contents: write

jobs:
  run-lot1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow pymupdf
      - name: Execute corrected lot 1 extractor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          source=Path('.github/workflows/extract-elios-lot1-hd.yml').read_text(encoding='utf-8')
          source=source.replace('2024/02/Elios_catalogo_Montreal.pdf','2021/03/Elios_catalogo_Montreal.pdf')
          m=re.search(r"python <<'PY'\n(.*?)\n          PY", source, re.S)
          if not m:
              raise SystemExit('Embedded extractor not found')
          script=textwrap.dedent(m.group(1))
          exec(compile(script,'elios-lot1-extractor','exec'), {'__name__':'__main__'})
          PY
      - name: Verify generated galleries
        run: |
          test -s assets/js/inspirations-elios-lot1-hd.js
          test -s assets/js/inspirations-elios-lot1-manifest.json
          for d in domus montreal allure creta deco segmento; do
            COUNT=$(find "assets/img/elios/$d" -maxdepth 1 -type f -name 'lot1-*' | wc -l)
            echo "$d: $COUNT images"
            test "$COUNT" -ge 3
          done
          grep -q 'inspirations-elios-lot1-hd.js?v=20260902-lot1hd2' univers.html
      - name: Commit galleries to main
        run: |
          git config user.name 'aetherismanga'
          git config user.email 'ccjacou@gmail.com'
          git add assets/img/elios/domus assets/img/elios/montreal assets/img/elios/allure assets/img/elios/creta assets/img/elios/deco assets/img/elios/segmento assets/js/inspirations-elios-lot1-hd.js assets/js/inspirations-elios-lot1-manifest.json univers.html
          git diff --cached --stat
          git commit -m 'Corrige Domus Montreal Allure Creta Deco et Segmento en HD officiel'
          git push origin HEAD:main
