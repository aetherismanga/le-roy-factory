name: LRF UPTREND Private Import

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lrf-uptrend-import.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identify-service-account:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LE_ROY_FACTORY }}'
      - name: Identify Firebase deployment service account
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          with open(os.environ['GOOGLE_APPLICATION_CREDENTIALS'], 'r', encoding='utf-8') as f:
              print('LRF_SERVICE_ACCOUNT=' + json.load(f)['client_email'])
          PY
