name: Verify LRF configurator suite
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'studio-one/**'
      - 'randal-general/**'
      - 'assets/js/lrf-plan-pose/**'
      - 'assets/js/studio-one/**'
      - 'assets/js/lrf-plinths.mjs'
      - 'lrf-plan-pose.html'
      - 'randal-studio-one-3d.html'
      - 'studio-one-configurateur.html'
      - 'randal-configurateur.html'
      - '_config.yml'
      - 'tests/lrf-suite/**'
      - 'tests/lrf-plan-pose/**'
      - 'tests/security/**'
      - 'tests/lrf-surface-contract.test.mjs'
      - 'tests/elios-phase2a/cache-regression.cjs'
      - 'sw.js'
      - 'api/**'
      - 'server/**'
      - 'scripts/build-public-site.mjs'
      - 'scripts/public-agent-tariffs.mjs'
      - 'package*.json'
      - '.github/workflows/suite-quality.yml'
permissions:
  contents: read
concurrency:
  group: lrf-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - run: npm run build:general && npm run build:studio
      - name: Verify readable image cache recovery
        run: node tests/elios-phase2a/cache-regression.cjs
      - run: npm run check:core
      - run: node --test tests/lrf-plan-pose/*.test.mjs tests/lrf-suite/*.test.mjs tests/security/*.test.mjs tests/secure-agent-tariffs.test.mjs tests/release-impact.test.mjs tests/lrf-surface-contract.test.mjs tests/randal-workspace/identity-state.test.mjs
      - run: npm run check --workspace=randal-general-3d
      - run: npm run check --workspace=studio-one-atelier-3d
      - run: npm run build:site
      - run: npx playwright install --with-deps chromium
      - name: Verify active ateliers with real WebGL and HD restoration
        run: node tests/lrf-suite/active-configurators-browser.cjs
      - name: Verify empty Studio One entry and explicit resume
        run: node tests/lrf-suite/studio-empty-entry-browser.cjs
      - name: Verify full upper drawers on desktop and mobile
        run: node shared/lrf-3d/qa/top-drawer-browser.cjs
      - name: Verify Quercia mobile texture budgets and HD restoration
        run: node tests/lrf-quercia-mobile.browser.mjs
      - name: Verify tile selection with mouse and touch
        run: node tests/lrf-suite/tile-selection-browser.cjs
      - name: Verify live floor layouts and compatible wall alignment
        run: node tests/lrf-suite/floor-layout-browser.cjs
      - name: Verify inspector scrollbars preserve the current selection
        run: node tests/lrf-suite/panel-scroll-browser.cjs
      - name: Verify wall-mounted toilets and legacy project recovery
        run: node tests/lrf-suite/sanitary-attachment-browser.cjs
      - name: Verify inherited and custom WC support coverings
        run: node tests/lrf-suite/sanitary-support-browser.cjs
      - name: Verify private LRF composition references on desktop and mobile
        run: node tests/lrf-suite/lrf-reference-browser.cjs
      - name: Verify Studio One mirror references through the real server handler
        run: node tests/lrf-suite/studio-mirror-reference-browser.cjs
      - run: node tests/lrf-plan-pose/recovery-render-browser.cjs
      - name: Verify recovery of historical local projects
        run: node tests/lrf-suite/legacy-recovery-browser.cjs
      - name: Keep active atelier results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrf-browser-checks
          path: reports/lrf-suite/
          retention-days: 14
      # No deployment, credentials, environment pull or production mutation here.
  construction-interactions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LRF_QA_OUTPUT: reports/lrf-suite/element-panels
      LRF_LOCK_QA_DIR: reports/lrf-suite/position-lock
      LRF_PARTITION_QA_OUTPUT: reports/lrf-suite/partitions
      LRF_PANEL_LIFECYCLE_QA_OUTPUT: reports/lrf-suite/panel-lifecycle
      LRF_RUG_QA_OUTPUT: reports/lrf-suite/floor-rug
      LRF_NICHE_OPENINGS_QA_OUTPUT: reports/lrf-suite/niche-openings
      LRF_NICHE_PLACEMENT_OUTPUT: reports/lrf-suite/niche-placement
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - run: npm run build:general && npm run build:studio
      - run: npx playwright install --with-deps chromium
      - name: Verify element choices stay beside the live scene
        run: node tests/lrf-suite/element-panels-browser.cjs
      - name: Verify native niche placement, wall targeting, depth-tested guides and presentation exclusion
        run: node tests/lrf-suite/niche-placement-browser.cjs
      - name: Verify sidebar content survives editor changes and outside clicks
        run: node tests/lrf-suite/panel-lifecycle-browser.cjs
      - name: Verify floor rug creation, mouse and touch movement, and dimensions
        run: node tests/lrf-suite/floor-rug-browser.cjs
      - name: Verify niche materials and selection after locking and adding openings
        run: node tests/lrf-suite/niche-openings-browser.cjs
      - name: Verify individual locks and movement inside a locked room
        run: node tests/lrf-suite/position-lock-browser.cjs
      - name: Verify inherited partition tiling and live geometry editing
        run: node tests/lrf-suite/partition-editing-browser.cjs
      - name: Verify flush and raised tiled shower trays
        run: node tests/lrf-suite/tiled-shower-tray-browser.cjs
      - name: Keep construction interaction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrf-construction-checks
          path: reports/lrf-suite/
          retention-days: 14
  opening-and-product-placement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LRF_OPENING_QA_OUTPUT: reports/lrf-suite/opening
      LRF_PRODUCT_DROP_QA_OUTPUT: reports/lrf-suite/product-drop
      LRF_BASIN_QA_OUTPUT: reports/lrf-suite/basin-options
      LRF_PARTITION_QA_OUTPUT: reports/lrf-suite/partition-snap
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - run: npm run build:general && npm run build:studio
      - run: npx playwright install --with-deps chromium
      - name: Verify fresh scenes and preserve explicitly resumed projects
        run: node tests/lrf-suite/opening-scene-browser.cjs
      - name: Verify visual basin choices, right placement and matching drains
        run: node tests/lrf-suite/basin-ergonomics-browser.cjs
      - name: Verify click and exact manual product placement
        run: node tests/lrf-suite/product-placement-drag-browser.cjs
      - name: Verify partition snapping in the plan
        run: node tests/lrf-suite/partition-snap-browser.cjs
      - name: Keep opening and product interaction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrf-opening-product-checks
          path: reports/lrf-suite/
          retention-days: 14
  public-compositions-and-visits:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LRF_PUBLIC_QA_OUTPUT: reports/lrf-suite/public-compositions
      LRF_PUBLIC_UI_QA_OUTPUT: reports/lrf-suite/public-gallery
      LRF_VISIT_QA_OUTPUT: reports/lrf-suite/visit-openings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - run: npm run build:general && npm run build:studio
      - run: npx playwright install --with-deps chromium
      - name: Verify the public gallery on desktop and phone
        run: node tests/lrf-suite/public-compositions-ui-browser.cjs
      - name: Verify protected previews, private project preservation and editable copies
        run: node tests/lrf-suite/public-compositions-browser.cjs
      - name: Verify native opening gestures during a 3D visit
        run: node tests/lrf-suite/visit-openings-browser.cjs
      - name: Keep public composition and visit checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrf-public-compositions-visits
          path: reports/lrf-suite/
          retention-days: 14
