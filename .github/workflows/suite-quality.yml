name: Verify LRF configurator suite
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'studio-one/**'
      - 'randal-general/**'
      - 'assets/js/lrf-plan-pose/**'
      - 'assets/js/studio-one/**'
      - 'assets/js/lrf-plinths.mjs'
      - 'lrf-plan-pose.html'
      - 'randal-studio-one-3d.html'
      - 'studio-one-configurateur.html'
      - 'randal-configurateur.html'
      - '_config.yml'
      - 'tests/lrf-suite/**'
      - 'tests/lrf-plan-pose/**'
      - 'tests/security/**'
      - 'tests/lrf-surface-contract.test.mjs'
      - 'tests/elios-phase2a/cache-regression.cjs'
      - 'sw.js'
      - 'api/**'
      - 'server/**'
      - 'scripts/build-public-site.mjs'
      - 'scripts/public-agent-tariffs.mjs'
      - 'package*.json'
      - '.github/workflows/suite-quality.yml'
permissions:
  contents: read
concurrency:
  group: lrf-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - run: npm run build:general && npm run build:studio
      - name: Verify readable image cache recovery
        run: node tests/elios-phase2a/cache-regression.cjs
      - run: npm run check:core
      - run: node --test tests/lrf-plan-pose/*.test.mjs tests/lrf-suite/*.test.mjs tests/security/*.test.mjs tests/secure-agent-tariffs.test.mjs tests/release-impact.test.mjs tests/lrf-surface-contract.test.mjs tests/randal-workspace/identity-state.test.mjs
      - run: npm run check --workspace=randal-general-3d
      - run: npm run check --workspace=studio-one-atelier-3d
      - run: npm run build:site
      - run: npx playwright install --with-deps chromium
      - name: Verify active ateliers with real WebGL and HD restoration
        run: node tests/lrf-suite/active-configurators-browser.cjs
      - name: Verify empty Studio One entry and explicit resume
        run: node tests/lrf-suite/studio-empty-entry-browser.cjs
      - name: Verify full upper drawers on desktop and mobile
        run: node shared/lrf-3d/qa/top-drawer-browser.cjs
      - name: Verify Quercia mobile texture budgets and HD restoration
        run: node tests/lrf-quercia-mobile.browser.mjs
      - name: Verify tile selection with mouse and touch
        run: node tests/lrf-suite/tile-selection-browser.cjs
      - name: Verify live floor layouts and compatible wall alignment
        run: node tests/lrf-suite/floor-layout-browser.cjs
      - name: Verify inspector scrollbars preserve the current selection
        run: node tests/lrf-suite/panel-scroll-browser.cjs
      - name: Verify wall-mounted toilets and legacy project recovery
        run: node tests/lrf-suite/sanitary-attachment-browser.cjs
      - name: Verify inherited and custom WC support coverings
        run: node tests/lrf-suite/sanitary-support-browser.cjs
      - name: Verify private LRF composition references on desktop and mobile
        run: node tests/lrf-suite/lrf-reference-browser.cjs
      - name: Verify Studio One mirror references through the real server handler
        run: node tests/lrf-suite/studio-mirror-reference-browser.cjs
      - run: node tests/lrf-plan-pose/recovery-render-browser.cjs
      - name: Verify recovery of historical local projects
        run: node tests/lrf-suite/legacy-recovery-browser.cjs
      - name: Keep active atelier results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrf-browser-checks
          path: reports/lrf-suite/
          retention-days: 14
      # No deployment, credentials, environment pull or production mutation here.
