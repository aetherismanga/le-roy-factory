name: ELIOS Creta official high quality floor textures
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/export_elios_creta_floor.py'
      - '.github/workflows/export-elios-creta-floor.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pymupdf pillow
      - run: python scripts/export_elios_creta_floor.py
      - run: |
          git config user.name "LRF Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/img/elios/creta/textures/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publie les huit textures HD officielles ELIOS Creta"
          git pull --rebase origin main
          git push origin HEAD:main
