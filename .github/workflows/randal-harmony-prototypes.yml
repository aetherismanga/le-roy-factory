name: Generate RANDAL Harmony 3D prototypes
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_randal_harmony_models.py'
      - '.github/workflows/randal-harmony-prototypes.yml'
permissions:
  contents: write
concurrency:
  group: randal-harmony-3d-test
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model generation tools
        run: python -m pip install --disable-pip-version-check pymupdf pillow trimesh numpy
      - name: Build GLB models from RANDAL reference catalogue
        run: python scripts/build_randal_harmony_models.py
      - name: Publish six Harmony test models
        run: |
          git config user.name "LRF Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/models/randal/harmony/
          if git diff --cached --quiet; then
            echo "GLB prototypes already current"
            exit 0
          fi
          git commit -m "Publie six modèles GLB Harmony pour validation"
          git pull --rebase origin main
          git push origin HEAD:main
