name: RANDAL V04 - Photos collections
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/randal-v04-collection-images.yml'
      - 'scripts/export_randal_v04_images.py'
      - 'assets/pdf/RANDAL-V04.pdf'

permissions:
  contents: write

concurrency:
  group: randal-v04-images
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image extraction dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Export the verified collection images
        run: python scripts/export_randal_v04_images.py
      - name: Publish only collection thumbnails
        run: |
          git config user.name "LRF Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/img/randal/v04/
          if git diff --cached --quiet; then
            echo "Images deja a jour"
            exit 0
          fi
          git commit -m "Publie les 11 vraies photos des collections RANDAL V04"
          git pull --rebase origin main
          git push origin HEAD:main
