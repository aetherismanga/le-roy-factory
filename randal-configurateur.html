 'Roble Amazona':[13251,13305,13103,13306,13307,13105],
 'Azul Acero':[13317,13318,13319,13320,13321,13322],
 'Nogal Valentina':[13252,13308,13104,13309,13310,13106],
 'Biscuit':[13311,13312,13313,13314,13315,13316]
};
const topReference=()=>{const i=[60,70,80,90,100,120].indexOf(Number(st.width));return i>=0?TOP_REFS[st.topFinish]?.[i]||'À confirmer':'À confirmer'};
const allowedModes=()=>selectedType()?.[3]==='column'||st.model==='Less'?['none']:st.model==='Sima'?['vessel']:[60,70,80,90,100,120].includes(Number(st.width))?['integrated','vessel','none']:['integrated','none'];
function syncBasin(){
 if(!allowedModes().includes(st.basinMode))st.basinMode=allowedModes()[0];
 if(st.basinMode==='none'){st.basin='Sans vasque';st.top='Sans plan'}
 if(st.basinMode==='integrated'){if(!['Sella','Tampa'].includes(st.basin))st.basin=st.model==='Luce'||st.model==='Brent'?'Tampa':'Sella';if(st.model==='Luce'||st.model==='Brent')st.basin='Tampa';st.top='Sans plan'}
 if(st.basinMode==='vessel'){if(!['Neris','Torne'].includes(st.basin))st.basin='Neris';st.top=st.model==='Sima'?'Plateau SIMA':'Plan pour vasque à poser';if(!TOP_FINISHES.includes(st.topFinish))st.topFinish='Blanco mate'}
}
const imagePages={mirror:35,integrated:37,vessel:41,none:0};
let pdfPromise=null;const imageCache=new Map();
async function loadPdf(){
 if(!window.pdfjsLib)return null;
 if(!pdfPromise){window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';pdfPromise=window.pdfjsLib.getDocument({url:'assets/pdf/RANDAL-V04.pdf',disableAutoFetch:false}).promise.catch(e=>{console.warn('Photos catalogue RANDAL',e);return null})}
 return pdfPromise;
}
async function renderPreview(page){
 if(imageCache.has(page))return imageCache.get(page);
 const doc=await loadPdf();if(!doc)return null;
 const p=await doc.getPage(page),v=p.getViewport({scale:.55});
 const off=document.createElement('canvas');off.width=Math.ceil(v.width);off.height=Math.ceil(v.height);
 await p.render({canvasContext:off.getContext('2d'),viewport:v}).promise;
 imageCache.set(page,off);return off;
}
let thumbCall=0;
async function paintThumbnails(){
 const seq=++thumbCall,targets=[...document.querySelectorAll('canvas[data-photo-page]')];if(!targets.length)return;
 const pages=[...new Set(targets.map(x=>Number(x.dataset.photoPage)).filter(Boolean))];
 for(const p of pages){
  let source;try{source=await renderPreview(p)}catch(e){console.warn('Visuel RANDAL',p,e)}
  if(seq!==thumbCall)return;
  if(!source)continue;
  targets.filter(x=>Number(x.dataset.photoPage)===p).forEach(canvas=>{
   if(!canvas.isConnected)return;
   const c=canvas.getContext('2d');const W=canvas.width,H=canvas.height;
   // Haut de la page : photos officielles, en excluant le bandeau et les tableaux.
   const positions={
 'Basic':[.04,.15,.33,.39],'Zen LED':[.36,.15,.66,.39],'Ilse LED':[.69,.15,.97,.39],
 'Cápsula LED':[.04,.45,.34,.70],'Miroir métallique rectangulaire':[.35,.45,.67,.70],
 'Miroir métallique rond':[.68,.45,.97,.70],
 'Neris':[.04,.10,.48,.74],'Torne':[.50,.10,.95,.74],
 'Sella':[.04,.18,.49,.75],'Tampa':[.51,.18,.96,.75]
};
 const region=positions[canvas.dataset.photoKey];
 const srcX=source.width*(region?region[0]:.06),srcY=source.height*(region?region[1]:.10),srcW=source.width*(region?(region[2]-region[0]):.88),srcH=source.height*(region?(region[3]-region[1]):.64);
   const ratio=Math.max(W/srcW,H/srcH);
   const cropW=W/ratio,cropH=H/ratio;
   c.drawImage(source,srcX+(srcW-cropW)/2,srcY+(srcH-cropH)*.32,cropW,cropH,0,0,W,H);
  });
 }
}
window.addEventListener('load',()=>paintThumbnails(),{once:true});
const COLLECTION_IMAGES={
 'Harmony':'harmony','Luce':'luce','Brent':'brent','Aruba rainuré':'aruba-rainure',
 'Aruba':'aruba','Aras':'aras','Boreal':'boreal','Brunei':'brunei','Amat':'amat','Less':'less','Sima':'sima'
};
const collectionImage=name=>'<span class="visual collection-visual"><img src="assets/img/randal/v04/'+(COLLECTION_IMAGES[name]||'harmony')+'.webp" alt="Photo officielle RANDAL '+esc(name)+'" loading="lazy" decoding="async"></span>';
const photo=(page,tag='',key='')=>'<span class="visual"><canvas width="300" height="190" data-photo-page="'+page+'" data-photo-key="'+esc(key)+'" role="img" aria-label="Photo officielle RANDAL, page '+page+'"></canvas>'+(tag?'<i>'+tag+'</i>':'')+'</span>';

const resetConfiguration=()=>{Object.assign(st,{width:'',height:'',depth:'',color:'',variantCode:'',drawers:'',basin:'Sella',top:'Sans plan',basinMode:'integrated',topFinish:'Blanco mate',mirror:'Sans miroir',quantity:1});};
const normalize=()=>{
 const special=SPECIAL_VARIANTS[st.model];
 if(special){const shape=special.shapes.find(x=>x.code===st.variantCode);if(shape){st.width=String(shape.width);st.height=String(shape.height);st.depth=String(shape.depth)}else{st.width=st.height=st.depth='';st.color=''}if(!special.colors.includes(st.color))st.color='';return}
 const d=RANDAL[st.model];if(!d){resetConfiguration();return}
 if(!d.w.includes(Number(st.width))){st.width='';st.color=''}
 if(d.h.length===1)st.height=String(d.h[0]);else if(!d.h.includes(Number(st.height)))st.height='';
 st.depth=String(d.d);if(!d.colors.includes(st.color))st.color='';
};
normalize();syncBasin();
const selectedFromCatalogue=new URLSearchParams(location.search).get('collection');
if(selectedFromCatalogue&&models.some(([name])=>name===selectedFromCatalogue)&&st.model!==selectedFromCatalogue){st.model=selectedFromCatalogue;resetConfiguration();st.step=1;normalize();save();}
const entry=(label,name,type='text',placeholder='')=>'<label class="field">'+label+'<input name="'+name+'" type="'+type+'" placeholder="'+placeholder+'" value="'+esc(st[name])+'"></label>';
const select=(label,name,opts)=>'<label class="field">'+label+'<select name="'+name+'">'+opts.map(v=>'<option value="'+esc(v)+'" '+(st[name]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select></label>';
const pick=(name,values,group='')=>'<div class="choices '+group+'">'+values.map(([value,sub])=>{
 const page=name==='model'?MODEL_PAGE[value]:name==='mirror'?(value==='Sans miroir'?0:36):name==='basinMode'?(value==='vessel'?41:value==='integrated'?37:0):name==='basin'?(value==='Neris'||value==='Torne'?41:38):0;
 const visual=name==='model'?collectionImage(value):page?photo(page,name==='model'?'p. '+page:'',name==='mirror'||name==='basin'?value:''):name==='color'?'<span class="swatch" style="background:'+esc(COLOR_HEX[value]||'#c5c4b9')+'"></span>':'';
 return '<button type="button" class="choice '+(st[name]===value?'active':'')+'" data-field="'+name+'" data-value="'+esc(value)+'">'+visual+'<span class="choice-copy"><strong>'+esc(name==='basinMode'?({integrated:'Vasque sur meuble',vessel:'Plan + vasque à poser',none:'Sans vasque'}[value]):value)+'</strong><small>'+esc(sub||'')+'</small></span></button>'
 }).join('')+'</div>';
const summary=()=>['Référence meuble : '+(variant()?.ref||'À vérifier'),'Prix vente conseillé HT meuble : '+(variant()?.price??'À confirmer')+' €','DEMANDE DE DISPONIBILITÉ / COMMANDE À CONFIRMER','RANDAL — Catalogue V04','','MODÈLE : '+st.model,'Largeur : '+(st.width||'À confirmer')+' cm','Hauteur : '+(st.height||'À confirmer')+' cm','Profondeur : '+(st.depth||'À confirmer')+' cm','Couleur / finition : '+(st.color||'À confirmer'),'Tiroirs / composition : '+(st.drawers||'À confirmer'),'Type de montage : '+({integrated:'Vasque sur meuble',vessel:'Plan et vasque à poser',none:'Meuble sans vasque'}[st.basinMode]),'Vasque : '+st.basin,'Plan : '+st.top+(st.basinMode==='vessel'&&st.model!=='Sima'?' · '+st.topFinish+' · Réf. '+topReference():''),'Miroir : '+st.mirror+(st.mirror==='Sans miroir'?'':' · '+(st.mirrorSize||'Taille à confirmer')+' · réf. '+mirrorRef()),'Quantité : '+st.quantity,'','CLIENT / MAGASIN : '+st.company,'Contact : '+st.name,'E-mail : '+st.email,'Téléphone : '+st.phone,'','Informations complémentaires : '+(st.notes||'Aucune'),'','Merci de confirmer les références exactes, les associations possibles, le prix professionnel HT, les stocks et le délai.','Aucune commande ferme avant confirmation de votre part.'].join('\n');
function render(){
$('steps').innerHTML=steps.map((s,i)=>'<div class="step '+(i===st.step?'active':i<st.step?'done':'')+'">'+(i+1)+'. '+s+'</div>').join('');
let h='<h2>'+['Choisissez une collection','Indiquez le format et la composition','Choisissez la finition','Vasque et plan de toilette','Choisissez votre miroir','Vos coordonnées professionnelles','Vérifiez votre demande'][st.step]+'</h2>';
if(st.step===0){h+='<p class="hint">Choisissez un modèle parmi les collections du catalogue.</p>'+pick('model',models.map(([a,p])=>[a,'Catalogue page '+p]));}
if(st.step===1){
 const d=RANDAL[st.model],special=SPECIAL_VARIANTS[st.model];
 if(special){h+='<p class="hint">Sélectionnez la configuration illustrée par sa lettre dans le tarif officiel.</p>'+pick('variantCode',special.shapes.map(x=>[x.code,x.width+' × '+x.height+' cm · Page '+(st.model==='Brent'?12:(x.height===53?29:30))]));}
 else if(d){h+='<p class="hint">Dimensions disponibles pour ce modèle.</p>'+pick('width',d.w.map(w=>[String(w),w+' cm de largeur']));if(d.h.length>1)h+=pick('height',d.h.map(v=>[String(v),v+' cm de hauteur']));}
 else h+='<p class="warn">Options détaillées à confirmer dans le catalogue.</p>';
 h+='<div class="fields" style="margin-top:15px">'+entry('Quantité','quantity','number')+'</div>';
}
if(st.step===2){const d=RANDAL[st.model],special=SPECIAL_VARIANTS[st.model];h+='<p class="hint">Finitions proposées pour cette collection.</p>'+(d||special?pick('color',(special?.colors||d.colors).map(c=>[c,''])):'<p class="warn">Références à vérifier avant configuration.</p>');}

if(st.step===3){
 syncBasin();
 h+='<p class="hint">Choisissez un montage. Seules les options correspondantes sont proposées.</p>';
 const modes=[['integrated','Vasque directement sur le meuble'],['vessel','Plan avec vasque à poser'],['none','Meuble seul, sans vasque']];
 h+=pick('basinMode',modes.filter(x=>allowedModes().includes(x[0])),'mode-grid');
 if(st.basinMode==='integrated'){
  h+='<div class="options-group"><h3>Vasque</h3>'+pick('basin',(st.model==='Luce'||st.model==='Brent'?['Tampa']:['Sella','Tampa']).map(x=>[x,'Vasque en céramique, page 38']))+'</div>';
 }
 if(st.basinMode==='vessel'){
  h+='<div class="options-group"><h3>Vasque à poser</h3>'+pick('basin',['Neris','Torne'].map(x=>[x,'Page 41']))+'</div>';
  if(st.model==='Sima')h+='<div class="options-group">Plateau SIMA (fourni dans la composition). Aucun plan supplémentaire.</div>';
  else h+='<div class="options-group"><h3>Finition du plan</h3>'+select('Plan 46 cm de profondeur','topFinish',TOP_FINISHES)+'</div>';
 }
 if(st.basinMode==='none')h+='<p class="mini">Le meuble sera demandé sans vasque ni plan.</p>';
}
if(st.step===4){
 h+='<p class="hint">Choisissez votre miroir et sa dimension.</p>'+pick('mirror',[['Sans miroir',''],['Basic',''],['Zen LED',''],['Ilse LED',''],['Cápsula LED',''],['Miroir métallique rectangulaire',''],['Miroir métallique rond',''],['Autre miroir (à préciser)','']]);
 const dims=MIRROR_FORMATS[st.mirror];
 if(dims)h+='<div class="options-group">'+select('Dimension du miroir','mirrorSize',['',...dims.map(x=>x[0])])+'</div>';
}
if(st.step===5){h+='<p class="hint">Coordonnées nécessaires au traitement de la demande par notre équipe.</p><div class="fields">'+entry('Société / magasin','company')+entry('Nom du contact','name')+entry('Adresse e-mail','email','email')+entry('Téléphone','phone','tel')+'</div><label class="field" style="margin-top:16px">Précisions, finition exacte, référence du catalogue<textarea name="notes">'+esc(st.notes)+'</textarea></label>';}
if(st.step===6){
 h+='<p class="hint">Votre composition et les éléments choisis.</p><div class="visual-summary">'
 +'<div class="preview-card">'+collectionImage(st.model)+'<strong>'+esc(st.model)+' · '+esc(st.color)+'</strong><span class="selected-finish" style="background:'+esc(COLOR_HEX[st.color]||'#bcb6aa')+'" aria-label="Finition sélectionnée"></span></div>'
 +'<div class="preview-card">'+(st.basinMode==='none'?'<span class="visual"></span>':photo(st.basinMode==='vessel'?41:38,'',st.basin))+'<strong>'+esc(st.basin)+'</strong></div>'
 +'<div class="preview-card">'+(st.mirror==='Sans miroir'?'<span class="visual"></span>':photo(36,'',st.mirror))+'<strong>'+esc(st.mirror)+'</strong></div>'
 +'</div><div class="summary">'+esc(summary())+'</div><button type="button" class="btn primary" id="send" style="margin-top:18px;width:100%">Envoyer la demande</button><p class="mini">Votre application e-mail s’ouvrira pour confirmer l’envoi.</p>';
}
h+='<div class="actions"><button type="button" class="btn" id="prev" '+(st.step===0?'disabled':'')+'>← Précédent</button>'+(st.step<6?'<button type="button" class="btn primary" id="next">Continuer →</button>':'')+'</div>';
$('panel').innerHTML=h;
 paintThumbnails();
$('panel').querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{if(b.dataset.field==='model'&&st.model!==b.dataset.value)resetConfiguration();if(b.dataset.field==='variantCode'&&st.variantCode!==b.dataset.value)st.color='';if(b.dataset.field==='mirror'&&st.mirror!==b.dataset.value)st.mirrorSize='';if(b.dataset.field==='width'&&st.width!==b.dataset.value){st.color='';st.basinMode='integrated'}st[b.dataset.field]=b.dataset.value;normalize();syncBasin();save();render()});
$('panel').querySelectorAll('[name]').forEach(el=>el.onchange=()=>{st[el.name]=el.value.trim();syncBasin();save();if(st.step===3)render()});
$('prev').onclick=()=>{st.step=Math.max(0,st.step-1);save();render();scrollTo({top:0,behavior:'smooth'})};
if($('next'))$('next').onclick=()=>{
 for(const el of $('panel').querySelectorAll('[name]'))st[el.name]=el.value.trim();
 if(st.step===0&&!st.model){alert('Sélectionnez un modèle.');return}
 if(st.step===1){
  const special=SPECIAL_VARIANTS[st.model],regular=RANDAL[st.model];
  const validShape=special?special.shapes.some(x=>x.code===st.variantCode):Boolean(regular&&regular.w.includes(Number(st.width))&&(regular.h.length===1||regular.h.includes(Number(st.height))));
  if(!validShape||!Number.isInteger(Number(st.quantity))||Number(st.quantity)<1){alert('Choisissez une configuration et une quantité valides.');return}
 }
 if(st.step===2){
  const finishes=SPECIAL_VARIANTS[st.model]?.colors||RANDAL[st.model]?.colors||[];
  if(!finishes.includes(st.color)||!variant()?.ref){alert('Choisissez une finition disponible.');return}
 }
 if(st.step===3){
  syncBasin();
  const valid=allowedModes().includes(st.basinMode)&&(st.basinMode==='none'||st.basinMode==='integrated'&&['Sella','Tampa'].includes(st.basin)||st.basinMode==='vessel'&&['Neris','Torne'].includes(st.basin));
  if(!valid){alert('Sélectionnez un montage cohérent.');return}
 }
 if(st.step===4&&MIRROR_FORMATS[st.mirror]&&!MIRROR_FORMATS[st.mirror].some(x=>x[0]===st.mirrorSize)){alert('Choisissez une dimension de miroir.');return}if(st.step===5&&(!st.company||!st.name||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(st.email))){alert('Renseignez le magasin, le contact et une adresse e-mail valide.');return}
 st.step++;save();render();scrollTo({top:0,behavior:'smooth'});
};
if($('send'))$('send').onclick=()=>{const subject='RANDAL V04 — Demande de disponibilité / commande à confirmer — '+st.company;location.href='mailto:help.pro.fr@randal.group?cc='+encodeURIComponent('juancarlos.segura@randal.group,jerome@leroyfactory.fr,coryne@leroyfactory.fr')+'&subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent('Bonjour,\n\n'+summary()+'\n\nCordialement,\n'+st.name+' — '+st.company)};
}
render();
})();
</script></body></html>
