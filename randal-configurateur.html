/* RANDAL studio - editorial visual refresh, responsive */
:root{--pine:#443f37;--gold:#a88b64;--ink:#262b28;--bg:#f5f2ee}
body{background:#f5f2ee;color:#292925}

a.pdf{background:#ffffffec;color:#373d36!important;text-decoration:none;padding:10px 16px;border-radius:9px;margin-top:17px;font-weight:800}

.wizard{gap:6px;margin:16px 0}
.step{background:#e8e5df;color:#58564e;border-radius:10px}

.step.done{background:#dedbd2;color:#383d37}
.panel{background:#fffefd;border-color:#e2ded5;box-shadow:0 8px 35px #4033220b}
.hint{color:#777972;font-size:.94rem}
.choice{padding:0;text-align:left;border:1px solid #e4ded5;min-width:0;overflow:hidden;background:#fff;min-height:unset;box-shadow:0 2px 10px #453d3010}

/* Finitions officielles extraites des pages techniques RANDAL */
.choice .finish-preview{
  display:flex;align-items:center;justify-content:center;position:relative;
  height:136px;min-height:136px;background:#f7f5f0;

/* Bon de demande RANDAL — lecture claire sur téléphone et impression A4 */
.recap-sheet{border:1px solid #dedbd4;border-radius:17px;overflow:hidden;background:#fff;color:#30342f;margin:16px 0}
.recap-heading{padding:21px 22px;background:#f4f2eb;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}

.recap-metadata{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 20px;padding:17px 22px;font-size:.86rem;color:#515a53}
.recap-metadata span{min-width:0;overflow-wrap:anywhere}
.recap-grid-head,.recap-line{display:grid;grid-template-columns:minmax(0,1fr) 40px 92px 102px;gap:12px;align-items:center}
.recap-grid-head{background:#e8ede8;padding:11px 22px;font-size:.74rem;font-weight:800;color:#46534b}
.recap-line{padding:14px 22px;border-bottom:1px solid #eeede9;font-size:.82rem}
.recap-product{min-width:0;overflow-wrap:anywhere}
.recap-product strong{display:block;margin-bottom:4px;color:#303832}
.recap-product small{display:block;font-size:.73rem;color:#72756e;line-height:1.42;margin:3px 0}

.recap-number{text-align:center;font-variant-numeric:tabular-nums}
.recap-money{text-align:right;font-variant-numeric:tabular-nums}
.recap-total{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:19px 22px;background:#f7f8f4;color:#365344}
.recap-total span{font-size:.84rem;font-weight:800}
.recap-total strong{font-size:1.45rem;white-space:nowrap}
.recap-legal{color:#767871;font-size:.73rem;padding:15px 22px;margin:0;line-height:1.55}
.recap-warning{color:#98602d;font-size:.81rem;padding:12px 22px;margin:0;background:#fff7e7}

.recap-tools .recap-button{padding:12px 7px;font-size:.83rem;white-space:normal;min-width:0}
.recap-mailnote{line-height:1.45}

 if(!window.pdfjsLib)return null;
 if(!pdfPromise){window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';pdfPromise=window.pdfjsLib.getDocument({url:'assets/pdf/RANDAL-V04.pdf?v=20261014-prix-publics',disableAutoFetch:false}).promise.catch(e=>{console.warn('Photos catalogue RANDAL',e);return null})}
 return pdfPromise;
}
async function renderPreview(page){
 if(imageCache.has(page))return imageCache.get(page);
 const doc=await loadPdf();if(!doc)return null;
 const p=await doc.getPage(page),v=p.getViewport({scale:.55});
 const off=document.createElement('canvas');off.width=Math.ceil(v.width);off.height=Math.ceil(v.height);
 await p.render({canvasContext:off.getContext('2d'),viewport:v}).promise;
 imageCache.set(page,off);return off;
}
let thumbCall=0;
async function paintThumbnails(){
 const seq=++thumbCall,targets=[...document.querySelectorAll('canvas[data-photo-page]')];if(!targets.length)return;
 const pages=[...new Set(targets.map(x=>Number(x.dataset.photoPage)).filter(Boolean))];
 for(const p of pages){
  let source;try{source=await renderPreview(p)}catch(e){console.warn('Visuel RANDAL',p,e)}
  if(seq!==thumbCall)return;
  if(!source)continue;
  targets.filter(x=>Number(x.dataset.photoPage)===p).forEach(canvas=>{
   if(!canvas.isConnected)return;
   const c=canvas.getContext('2d');const W=canvas.width,H=canvas.height;
   // Haut de la page : photos officielles, en excluant le bandeau et les tableaux.
   const positions={
 'Basic':[.04,.15,.33,.39],'Zen LED':[.36,.15,.66,.39],'Ilse LED':[.69,.15,.97,.39],
 'Cápsula LED':[.04,.45,.34,.70],'Miroir métallique rectangulaire':[.35,.45,.67,.70],
 'Miroir métallique rond':[.68,.45,.97,.70],
 'Neris':[.04,.10,.48,.74],'Torne':[.50,.10,.95,.74],
 'Sella':[.04,.18,.49,.75],'Tampa':[.51,.18,.96,.75]
};
 const region=positions[canvas.dataset.photoKey];
 const srcX=source.width*(region?region[0]:.06),srcY=source.height*(region?region[1]:.10),srcW=source.width*(region?(region[2]-region[0]):.88),srcH=source.height*(region?(region[3]-region[1]):.64);
   const ratio=Math.max(W/srcW,H/srcH);
   const cropW=W/ratio,cropH=H/ratio;
   c.drawImage(source,srcX+(srcW-cropW)/2,srcY+(srcH-cropH)*.32,cropW,cropH,0,0,W,H);
  });
 }
}

/* Export PDF autonome : jsPDF chargé à la demande, sans serveur ni données personnelles. */
async function getPdfGenerator(){
 if(window.jspdf?.jsPDF)return window.jspdf.jsPDF;
 const src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
 await new Promise((resolve,reject)=>{
  const tag=document.createElement('script');tag.src=src;tag.async=true;
  tag.onload=resolve;tag.onerror=()=>reject(new Error('Téléchargement du moteur PDF indisponible'));
  document.head.appendChild(tag);
 });
 if(!window.jspdf?.jsPDF)throw new Error('Générateur PDF indisponible');
 return window.jspdf.jsPDF;
}
async function jpegFromImage(path){
 if(!path)return null;
 const res=await fetch(path);
 if(!res.ok)throw new Error('Image non trouvée');
 const blob=await res.blob();
 const url=URL.createObjectURL(blob);
 try{
  const img=await new Promise((resolve,reject)=>{
   const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url;
  });
  const canvas=document.createElement('canvas');
  canvas.width=1320;canvas.height=780;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#faf9f6';ctx.fillRect(0,0,1320,780);
  const sc=Math.min(1260/img.width,720/img.height);
  ctx.drawImage(img,(1320-img.width*sc)/2,(780-img.height*sc)/2,img.width*sc,img.height*sc);
  return canvas.toDataURL('image/jpeg',.90);
 }finally{URL.revokeObjectURL(url)}
}

   write(r.quantity,126,y+6,'normal',9);
   write(money(r.unit),143,y+6,'normal',8);
   write(r.unit===null?'À confirmer':money(r.unit*r.quantity),171,y+6,'bold',8);
   y+=27;
  }
  if(y+44>272){pdf.addPage();y=20}
  const t=totals();
  pdf.setFillColor(239,243,237);pdf.rect(15,y+1,180,18,'F');
  write(t.complete?'TOTAL GÉNÉRAL':'TOTAL PARTIEL',19,y+12,'bold',10,[49,81,65]);
  write(money(t.sum),156,y+12,'bold',12,[49,81,65]);
  y+=28;
  const legal='Prix publics conseillés du catalogue RANDAL V04. Hors transport et installation. Merci de confirmer les références, la disponibilité, les prix d’achat professionnels et les délais. Document non contractuel ; aucune commande ferme avant validation de l’usine.';
  const lines=pdf.splitTextToSize(clean(legal),179);
  pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(100,102,97);
  pdf.text(lines,16,y);
  pdf.setFontSize(7);pdf.text('Document préparé sur leroifactory.fr - '+new Date().toLocaleDateString('fr-FR'),16,286);
  pdf.save('RANDAL-Demande-'+st.model.replace(/\s/g,'-')+'-'+(variant()?.ref||'modele')+'.pdf');
 }catch(e){
  console.error('Export PDF RANDAL',e);
  alert('L’enregistrement direct est indisponible. La fenêtre d’impression permet de choisir « Enregistrer en PDF ».');
  window.print();
 }finally{if(btn){btn.disabled=false;btn.textContent='Enregistrer en PDF'}}
}

const summary=()=>['Référence meuble : '+(variant()?.ref||'À vérifier'),'Prix public conseillé meuble : '+euroPrice(publicPrice(variant()?.price)),'DEMANDE DE DISPONIBILITÉ / COMMANDE À CONFIRMER','RANDAL — Catalogue V04','','MODÈLE : '+st.model,'Largeur : '+(st.width||'À confirmer')+' cm','Hauteur : '+(st.height||'À confirmer')+' cm','Profondeur : '+(st.depth||'À confirmer')+' cm','Couleur / finition : '+(st.color||'À confirmer'),'Sous-modèle : '+(selectedType()?.[1]||'À vérifier'),'Variante catalogue : '+(st.variantCode||(st.typeId==='two'?'A à F':'Selon largeur')),'Type de montage : '+({integrated:'Vasque sur meuble',vessel:'Plan et vasque à poser',none:'Meuble sans vasque'}[st.basinMode]),'Vasque : '+st.basin,'Plan : '+st.top+(st.basinMode==='vessel'&&st.model!=='Sima'?' · '+st.topFinish+' · Réf. '+topReference():''),'Miroir : '+st.mirror+(st.mirror==='Sans miroir'?'':' · '+(st.mirrorSize||'Taille à confirmer')+(isMetalMirror(st.mirror)?' · cadre '+(st.mirrorFinish||'à préciser'):'')+' · réf. '+mirrorRef()),'Quantité : '+st.quantity,'','Merci de confirmer les références exactes, les associations possibles, les conditions commerciales, les stocks et le délai.','Aucune commande ferme avant confirmation de votre part.'].join('\n');

/* Un seul état commercial : chaque modification 3D passe par les règles,
   références et tarifs existants du configurateur RANDAL. */
function compositionConfig(){
 const type=selectedType(),t=totals();
 return {
  model:st.model,typeId:st.typeId,typeName:type?.[1]||'Meuble',kind:type?.[3]||'vanity',
  typePhoto:type?.[2]||'',width:st.width,height:st.height,depth:st.depth,
  color:st.color,swatch:finishUrl(st.model,st.color),
  finishes:RANDAL[st.model]?.colors||[],
  finishUrls:Object.fromEntries((RANDAL[st.model]?.colors||[]).map(color=>[color,finishUrl(st.model,color)])),
  basinMode:st.basinMode,basin:st.basin,basinFinish:st.basinFinish||'Blanc brillant',
  availableModes:allowedModes(),basinColors:VESSEL_FINISHES,topFinishes:TOP_FINISHES,
  topFinish:st.topFinish,mirror:st.mirror,mirrorSize:st.mirrorSize,
  mirrorFinish:st.mirrorFinish,mirrorPhoto:ACCESSORY_ART[st.mirror]||'',
  reference:String(variant()?.ref||'À confirmer'),
  totalPublic:t.complete?euroPrice(t.sum):euroPrice(t.sum)+' + éléments à confirmer',
  onChange:changeFromComposition
 };
}
function changeFromComposition(patch){
 if(st.model!=='Harmony'||!patch||typeof patch!=='object')return null;
 const [name,value]=Object.entries(patch)[0]||[];
 if(!name)return null;
 if(name==='color'){
  if(!RANDAL.Harmony.colors.includes(value))return null;
 }else if(name==='basinMode'){
  if(!allowedModes().includes(value))return null;
 }else if(name==='basin'){
  if(!(st.basinMode==='integrated'?['Sella','Tampa']:st.basinMode==='vessel'?['Neris','Torne']:[]).includes(value))return null;
 }else if(name==='basinFinish'){
  if(st.basinMode!=='vessel'||!VESSEL_FINISHES.includes(value))return null;
 }else if(name==='topFinish'){
  if(st.basinMode!=='vessel'||!TOP_FINISHES.includes(value))return null;
 }else return null;
 st[name]=value;
 syncBasin();
 normalize();
 save();render();
 return compositionConfig();
}

function render(){
$('steps').innerHTML=steps.map((s,i)=>'<div class="step '+(i===st.step?'active':i<st.step?'done':'')+'">'+(i+1)+'. '+s+'</div>').join('');
let h='<h2>'+['Choisissez une collection','Choisissez votre modèle','Choisissez les dimensions','Choisissez la finition','Vasque et plan','Choisissez votre miroir','Vérifiez votre commande'][st.step]+'</h2>';
if(st.step===0)h+='<p class="hint">Choisissez une collection RANDAL.</p>'+pick('model',models.map(([name,p])=>[name,'Catalogue page '+p]));
if(st.step===1)h+='<p class="hint">D’abord le type de meuble, puis ses dimensions.</p>'+typeCards();
if(st.step===2){
 const t=selectedType(),d=RANDAL[st.model],special=SPECIAL_VARIANTS[st.model];
 if(!t)h+='<p class="warn">Sélectionnez un modèle.</p>';
 else if(t[3]==='column'&&st.model==='Brent')h+='<p class="hint">Largeur de la colonne.</p>'+dimensionCards([['I',60,163,35],['J',40,163,35]]);
 else if(t[3]==='column')h+='<div class="fixed-format"><strong>30 × '+t[4]+' × '+(st.model==='Luce'?25:27)+' cm</strong><small>Colonne · Variante '+t[5]+'</small></div>';
 else if(special)h+='<p class="hint">Formats du modèle '+esc(t[1])+'.</p>'+dimensionCards(special.shapes.filter(x=>t[5].includes(x.code)).map(x=>[x.code,x.width,x.height,x.depth]));
 else if(d)h+='<p class="hint">H. '+t[4]+' cm · P. '+d.d+' cm.</p>'+pick('width',d.w.map(w=>[String(w),w+' cm de largeur']));
 h+='<div class="fields" style="margin-top:18px">'+entry('Quantité','quantity','number')+'</div>';
}
if(st.step===3){
 const colors=SPECIAL_VARIANTS[st.model]?.colors||RANDAL[st.model]?.colors||[];
 h+='<p class="hint">Finitions disponibles pour ce modèle.</p>'+pick('color',colors.map(c=>[c,'']));
}
if(st.step===4){
 syncBasin();
 if(selectedType()?.[3]==='column'){
  h+='<p class="hint">La colonne auxiliaire est un meuble de rangement, sans vasque ni plan à choisir.</p><div class="fixed-format"><strong>Colonne seule</strong><small>Vous pouvez ajouter un miroir à l’étape suivante.</small></div>';
 }else{

 h+='<p class="hint">Choisissez un montage. Seules les options correspondantes sont proposées.</p>';
 const modes=[['integrated','Vasque directement sur le meuble'],['vessel','Plan avec vasque à poser'],['none','Meuble seul, sans vasque']];
 h+=pick('basinMode',modes.filter(x=>allowedModes().includes(x[0])),'mode-grid');
 if(st.basinMode==='integrated'){
  h+='<div class="options-group"><h3>Vasque</h3>'+pick('basin',(st.model==='Luce'||st.model==='Brent'?['Tampa']:['Sella','Tampa']).map(x=>[x,'Vasque en céramique, page 38']))+'</div>';
 }
 if(st.basinMode==='vessel'){
  h+='<div class="options-group"><h3>Vasque à poser</h3>'+pick('basin',['Neris','Torne'].map(x=>[x,'Page 41']))+'</div>';
  h+='<div class="options-group">'+select('Couleur de la vasque','basinFinish',VESSEL_FINISHES)+'</div>';
  if(st.model==='Sima')h+='<div class="options-group">Plateau SIMA (fourni dans la composition). Aucun plan supplémentaire.</div>';
  else h+='<div class="options-group"><h3>Finition du plan</h3>'+select('Plan 46 cm de profondeur','topFinish',TOP_FINISHES)+'</div>';
 }
 if(st.basinMode==='none')h+='<p class="mini">Le meuble sera demandé sans vasque ni plan.</p>';
 }
}
if(st.step===5){
 h+='<p class="hint">Choisissez votre miroir et sa dimension.</p>'+pick('mirror',[['Sans miroir',''],['Basic',''],['Zen LED',''],['Ilse LED',''],['Cápsula LED',''],['Miroir métallique rectangulaire',''],['Miroir métallique rond',''],['Autre miroir (à préciser)','']]);
 const dims=MIRROR_FORMATS[st.mirror];
 if(dims)h+='<div class="options-group">'+select('Dimension du miroir','mirrorSize',['',...dims.map(x=>x[0])])+'</div>';
 if(isMetalMirror(st.mirror))h+='<div class="options-group"><h3>Couleur du cadre</h3><p class="mini">Finitions RANDAL — catalogue page 36.</p>'+pick('mirrorFinish',METAL_MIRROR_FINISHES.map(x=>[x,'']),'mirror-metal-choices')+'</div>';
}
if(st.step===6){
 h+='<p class="hint">Vérifiez les articles, références et prix avant la demande à RANDAL.</p>'+
 '<div class="visual-summary">'+
 '<div class="preview-card">'+activeTypeVisual()+'<strong>'+esc(st.model)+' · '+esc(selectedType()?.[1])+' · '+esc(st.color)+'</strong><span class="selected-finish"><img src="'+esc(finishUrl(st.model,st.color))+'" alt="Finition '+esc(st.color)+'" loading="lazy"></span></div>'+
 '<div class="preview-card">'+((selectedType()?.[3]==='column'||st.basinMode==='none')?blankAccessory('Sans vasque'):accessoryImage(st.basin))+'<strong>'+esc(st.basin)+'</strong></div>'+
 '<div class="preview-card">'+(accessoryImage(st.mirror)||blankAccessory('Sans miroir'))+'<strong>'+esc(st.mirror)+(isMetalMirror(st.mirror)?' · '+esc(st.mirrorFinish):'')+'</strong>'+(isMetalMirror(st.mirror)?metalFinishImage(st.mirrorFinish):'')+'</div>'+ 
 '</div>'+
 professionalRecap()+
 '<div class="recap-tools"><button type="button" class="btn recap-button recap-3d" id="preview-composition">◈ Voir la composition en 3D</button><button type="button" class="btn recap-button" id="print-order">Imprimer</button>'+
 '<button type="button" class="btn recap-button" id="save-pdf">Enregistrer en PDF</button>'+
 '<button type="button" class="btn primary recap-button" id="send">Envoyer la demande</button></div>'+
 '<p class="mini recap-mailnote">L’envoi ouvre votre messagerie avec les références, quantités et prix. Le mail reste à envoyer manuellement.</p>';
}
h+='<div class="actions"><button type="button" class="btn" id="prev" '+(st.step===0?'disabled':'')+'>← Précédent</button>'+(st.step<6?'<button type="button" class="btn primary" id="next">Continuer →</button>':'')+'</div>';
$('panel').innerHTML=h;
 paintThumbnails();
$('panel').querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{
 const field=b.dataset.field,value=b.dataset.value;
 if(field==='model'&&st.model!==value){resetConfiguration();st.model=value;}
 else if(field==='typeId'&&st.typeId!==value){
  st.typeId=value;st.width='';st.height='';st.depth='';st.variantCode='';st.color='';
  st.basinMode='integrated';st.basin='Sella';st.top='Sans plan';
 }else{
  if((field==='width'||field==='variantCode')&&st[field]!==value)st.color='';
  if(field==='mirror'&&st.mirror!==value){st.mirrorSize='';st.mirrorFinish='';}
  st[field]=value;
 }
 normalize();syncBasin();save();render();
});
$('panel').querySelectorAll('[name]').forEach(el=>el.onchange=()=>{
 st[el.name]=el.value.trim();syncBasin();save();if(st.step===4)render();
});
$('prev').onclick=()=>{st.step=Math.max(0,st.step-1);save();render();scrollTo({top:0,behavior:'smooth'});};
if($('next'))$('next').onclick=()=>{
 for(const el of $('panel').querySelectorAll('[name]'))st[el.name]=el.value.trim();
 if(st.step===0&&!MODEL_TYPES[st.model]){alert('Choisissez une collection.');return}
 if(st.step===1&&!selectedType()){alert('Choisissez un modèle : tiroirs, niche ou colonne.');return}
 if(st.step===2){
  const t=selectedType(),d=RANDAL[st.model],special=SPECIAL_VARIANTS[st.model];
  let valid=false;
  if(t?.[3]==='column')valid=st.model==='Brent'?['I','J'].includes(st.variantCode):Boolean(st.width);
  else if(special)valid=special.shapes.some(x=>x.code===st.variantCode&&t[5].includes(x.code));
  else valid=Boolean(d?.w.includes(Number(st.width))&&Number(st.height)===t?.[4]);
  if(!valid||!Number.isInteger(Number(st.quantity))||Number(st.quantity)<1){alert('Choisissez un format et une quantité valides.');return}
 }
 if(st.step===3){
  const colors=SPECIAL_VARIANTS[st.model]?.colors||RANDAL[st.model]?.colors||[];
  if(!colors.includes(st.color)||!variant()?.ref){alert('Choisissez une finition disponible pour ce modèle.');return}
 }
 if(st.step===4){
  syncBasin();
  if(!allowedModes().includes(st.basinMode)||st.basinMode==='integrated'&&!['Sella','Tampa'].includes(st.basin)||st.basinMode==='vessel'&&!['Neris','Torne'].includes(st.basin)){
   alert('Choisissez un montage compatible.');return;
  }
 }
 if(st.step===5&&MIRROR_FORMATS[st.mirror]&&!MIRROR_FORMATS[st.mirror].some(x=>x[0]===st.mirrorSize)){alert('Choisissez la dimension du miroir.');return}
 if(st.step===5&&isMetalMirror(st.mirror)&&!METAL_MIRROR_FINISHES.includes(st.mirrorFinish)){alert('Choisissez la couleur du cadre du miroir.');return}
 st.step++;save();render();scrollTo({top:0,behavior:'smooth'});
};
if($('preview-composition'))$('preview-composition').onclick=()=>{
 const type=selectedType();
 if(!window.RandalComposition3D){alert('La visualisation 3D est encore en cours de chargement. Réessayez dans un instant.');return;}
 window.RandalComposition3D.open(compositionConfig());
};
if($('print-order'))$('print-order').onclick=()=>window.print();
if($('save-pdf'))$('save-pdf').onclick=()=>downloadOrderPdf();
if($('send'))$('send').onclick=()=>{
 const v=variant();
 const subject='RANDAL — Confirmation disponibilité — '+st.model+' '+st.width+' cm — réf. '+(v?.ref||'à confirmer');
 location.href='mailto:help.pro.fr@randal.group?cc='+encodeURIComponent('juancarlos.segura@randal.group,jerome@leroyfactory.fr,coryne@leroyfactory.fr')+'&subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(emailBody());
};
}
render();
})();
