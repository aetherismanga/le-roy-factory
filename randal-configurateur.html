<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0e8">
<title>RANDAL — Catalogue Général 3D | LE ROY FACTORY</title>
<meta name="description" content="Configurez les collections du catalogue général RANDAL 2026 : meubles, finitions, vasques, colonnes et miroirs, puis composez votre salle de bains en 3D. Prix publics TTC.">
<link rel="canonical" href="https://leroyfactory.fr/randal-configurateur.html">
<link rel="preconnect" href="https://randal-catalogue-general-3d.vercel.app">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f0e8;color:#292c28;font-family:Arial,sans-serif}#randal-general{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#f3f0e8}#opening{position:fixed;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:#f3f0e8;z-index:1}#opening strong{font-size:25px;letter-spacing:4px}#opening small{color:#7f7867;letter-spacing:1.5px;font-size:10px}#opening a{color:#534b3a;font-size:12px}#opening[hidden]{display:none}</style>
</head>
<body>
<div id="opening" role="status"><strong>RANDAL</strong><small>VOTRE CATALOGUE GÉNÉRAL EN 3D</small><span>Ouverture de votre configurateur…</span><a id="direct-open" href="https://randal-catalogue-general-3d.vercel.app/">Ouvrir le configurateur directement ↗</a></div>
<iframe id="randal-general" title="Configurateur 3D RANDAL Catalogue Général" allow="fullscreen; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
<noscript><p><a href="https://randal-catalogue-general-3d.vercel.app/">Ouvrir le configurateur RANDAL Catalogue Général 3D</a></p></noscript>
<script>
(()=>{'use strict';const origin='https://randal-catalogue-general-3d.vercel.app',frame=document.getElementById('randal-general'),url=new URL(origin+'/');
for(const key of ['collection','view','step','account']){const value=new URLSearchParams(location.search).get(key);if(value)url.searchParams.set(key,value)}
if(location.hash)url.hash=location.hash;
document.getElementById('direct-open').href=url.href;
frame.addEventListener('load',()=>document.getElementById('opening').hidden=true);
window.addEventListener('message',e=>{if(e.origin!==origin||e.source!==frame.contentWindow||e.data?.type!=='randal-general-ready')return;try{const token=sessionStorage.getItem('lrfProSessionToken')||localStorage.getItem('lrfProRememberToken');if(token)frame.contentWindow.postMessage({type:'randal-general-session',sessionToken:token},origin)}catch{}});
frame.src=url.href;
})();
</script>
</body>
</html>
