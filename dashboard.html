<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="assets/img/logo03lrf.png">
  <title>Tableau de bord — LE ROY FACTORY CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/clients.css">
  <style>
    body.crm-body{background:#FBF9F5!important;background-image:none!important;color:#1A2530!important}
    .crm-topbar{background-image:url('assets/img/bandeau02.png')!important;background-size:cover!important;background-position:center!important;border-bottom:2px solid #D4AF37!important;color:#fff!important}
    .crm-topbar h1,.crm-topbar p{color:#fff!important;text-shadow:0 1px 4px rgba(0,0,0,.9)}
    .topbar-status{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}.status-pill{background:rgba(0,0,0,.52);border:1px solid rgba(212,175,55,.7);border-radius:999px;padding:.45rem .7rem;color:#fff;font-size:.78rem;font-weight:700;backdrop-filter:blur(4px)}
    .dashboard-loading{margin:1rem 0;padding:1rem;background:#fff;border:1px solid #e8e2d5;border-radius:12px;color:#6b7280;font-size:.88rem}
  </style>
</head>
<body class="crm-body">
  <aside class="crm-sidebar">
    <div class="sidebar-brand">
      <a href="index.html" class="logo-link"><div class="logo-circle" style="width:60px;height:60px"><img src="assets/img/logo03lrf.png" alt="LE ROY FACTORY"></div></a>
    </div>
    <ul class="sidebar-menu">
      <li><a href="dashboard.html" class="active"><span class="icon">🏠</span><span class="menu-text">Accueil</span></a></li>
      <li><a href="clients.html"><span class="icon">👥</span><span class="menu-text">Clients</span></a></li>
      <li><a href="clients.html?filter=prospect"><span class="icon">🎯</span><span class="menu-text">Prospects</span></a></li>
      <li><a href="agenda.html"><span class="icon">📅</span><span class="menu-text">Agenda</span></a></li>
      <li><a href="comptes-rendus.html"><span class="icon">📞</span><span class="menu-text">Comptes-rendus</span></a></li>
      <li><a href="catalogues.html"><span class="icon">📂</span><span class="menu-text">Catalogues</span></a></li>
      <li><a href="partenaires.html"><span class="icon">🏭</span><span class="menu-text">Fabricants</span></a></li>
      <li><a href="mails-groupes.html"><span class="icon">✉️</span><span class="menu-text">Mails groupés</span></a></li>
      <li><a href="carte.html"><span class="icon">🗺</span><span class="menu-text">Carte</span></a></li>
      <li><a href="statistiques.html"><span class="icon">📊</span><span class="menu-text">Statistiques</span></a></li>
    </ul>
    <div class="sidebar-footer"><button id="logout-btn" class="btn-logout-sidebar"><span>🚪</span><span class="menu-text">Déconnexion</span></button></div>
  </aside>

  <main class="crm-main-content">
    <div class="crm-topbar">
      <div class="welcome-box">
        <h1 id="welcome-title">Tableau de bord commercial</h1>
        <p id="welcome-subtitle">Données réelles du portefeuille LE ROY FACTORY.</p>
      </div>
      <div class="topbar-status">
        <span class="status-pill">🔐 Session sécurisée</span>
        <span class="status-pill" id="current-date">--</span>
        <span class="status-pill" id="current-time">--</span>
      </div>
    </div>
    <div class="dashboard-loading" id="dashboard-loading">Chargement des indicateurs commerciaux…</div>
  </main>

  <script type="module">
    import { authReady, agentProfile } from './assets/js/firebase.js';
    const user=await authReady;
    const profile=agentProfile(user);
    const title=document.getElementById('welcome-title');
    const subtitle=document.getElementById('welcome-subtitle');
    if(profile&&title)title.textContent=`Bonjour ${profile.name.split(' ')[0]} 👋`;
    if(profile&&subtitle)subtitle.textContent=`Portefeuille, priorités et activités — ${profile.role==='admin'?'administration':'espace agent'} sécurisé.`;
    function updateClock(){
      const now=new Date();
      const d=document.getElementById('current-date'),t=document.getElementById('current-time');
      if(d)d.textContent=now.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
      if(t)t.textContent=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    }
    updateClock();setInterval(updateClock,30000);
  </script>
</body>
</html>
