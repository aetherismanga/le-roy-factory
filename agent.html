<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Espace Agent | LE ROY FACTORY</title>

<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/agent.css">

</head>

<body>

<div class="agent-background"></div>

<div class="login-container">

    <div class="login-card">

        <img src="assets/img/logo01.png"
             alt="LE ROY FACTORY"
             class="agent-logo">

        <h1>ESPACE AGENT</h1>

        <p class="subtitle">
            Connexion sécurisée
        </p>

        <form id="loginForm">

            <div class="input-group">

                <label for="username">Identifiant</label>

                <input
                    id="username"
                    type="text"
                    placeholder="Votre identifiant"
                    autocomplete="username"
                    required>

            </div>

            <div class="input-group">

                <label for="password">Mot de passe</label>

                <input
                    id="password"
                    type="password"
                    placeholder="Votre mot de passe"
                    autocomplete="current-password"
                    required>

            </div>

            <button
                type="submit"
                class="login-btn">

                Accéder à l'espace agent

            </button>

        </form>

        <p class="copyright">

            © 2026 LE ROY FACTORY

        </p>

    </div>

</div>

<script src="assets/js/agent.js"></script>

</body>

</html>
