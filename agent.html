<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/img/logo03lrf.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Agent — LE ROY FACTORY</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/agent.css">

  <style>
    /* Fond général en blanc crème / coquille d'œuf */
    body, html {
      background-color: #FBF9F5 !important;
      background-image: none !important;
      color: #1A2530 !important;
    }

    /* Header et Footer avec bandeau02.png */
    header, footer {
      background-image: url('assets/img/bandeau02.png');
      background-size: cover;
      background-position: center;
      color: #ffffff;
      border-bottom: 2px solid #D4AF37;
    }

    footer {
      border-top: 2px solid #D4AF37;
      border-bottom: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    header a, footer p {
      color: #ffffff !important;
    }

    .login-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 2.5rem;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border-top: 4px solid #D4AF37;
    }

    .notification-error {
      display: none;
      background-color: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-bottom: 1.25rem;
      text-align: center;
      font-weight: 500;
    }

    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: #111111;
      color: #FFD700;
      border: 1px solid #D4AF37;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-login:hover {
      background: #D4AF37;
      color: #111111;
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body class="agent-login-body">

  <header style="width: 100%; position: fixed; top: 0; left: 0; z-index: 1000;">
    <div class="container nav-container" style="height: 100px; display: flex; align-items: center; justify-content: space-between;">
      <a href="index.html" class="logo" style="display: flex; align-items: center;">
        <div class="logo-circle" style="width: 70px; height: 70px; border-radius: 50%; overflow: hidden; border: 2px solid #D4AF37; background: #000;">
          <img src="assets/img/logo03lrf.png" alt="LE ROY FACTORY" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
      </a>
      <nav>
        <ul class="main-nav" style="display: flex; gap: 1.5rem; list-style: none; margin: 0;">
          <li><a href="index.html" style="color: #FFF; text-decoration: none; font-weight: 500;">← Retour au site public</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main style="padding-top: 140px; padding-bottom: 4rem; width: 100%; max-width: 440px; margin: 0 auto;">
    <div class="login-container">
      <div class="login-card">
        <div class="login-header" style="text-align: center; margin-bottom: 1.5rem;">
          <h1 style="font-size: 1.5rem; font-weight: 800; color: #1A2530; margin-bottom: 0.5rem;">Espace Agent CRM</h1>
          <p style="font-size: 0.9rem; color: #666; margin: 0;">Connexion réservée aux agents LE ROY FACTORY</p>
        </div>

        <div id="error-notification" class="notification-error"></div>

        <form id="login-form">
          <div class="form-group" style="margin-bottom: 1.25rem;">
            <label for="email" style="display: block; font-size: 0.85rem; font-weight: 700; color: #1A2530; margin-bottom: 0.4rem;">Adresse Email Professionnelle *</label>
            <input type="email" id="email" required placeholder="ex: jerome@leroyfactory.fr" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box;">
          </div>

          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="password" style="display: block; font-size: 0.85rem; font-weight: 700; color: #1A2530; margin-bottom: 0.4rem;">Mot de Passe *</label>
            <input type="password" id="password" required placeholder="••••••••" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box;">
          </div>

          <button type="submit" id="btn-submit" class="btn-login">🔑 Se Connecter</button>
        </form>
      </div>
    </div>
  </main>

  <footer style="position: fixed; bottom: 0; left: 0; width: 100%;">
    <div class="container" style="text-align: center; padding: 1.2rem 0;">
      <p style="margin: 0; font-size: 0.85rem; font-weight: 600;">&copy; 2026 LE ROY FACTORY. Accès sécurisé réservé au personnel autorisé.</p>
    </div>
  </footer>

  <script type="module">
    import { auth } from "./assets/js/firebase.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    document.addEventListener("DOMContentLoaded", () => {
      // Redirection automatique si déjà connecté
      if (localStorage.getItem("agentLoggedIn") === "true") {
        window.location.href = "dashboard.html";
        return;
      }

      const loginForm = document.getElementById("login-form");
      const errorEl = document.getElementById("error-notification");
      const btnSubmit = document.getElementById("btn-submit");

      function showError(msg) {
        if (errorEl) {
          errorEl.textContent = msg;
          errorEl.style.display = "block";
        }
      }

      function hideError() {
        if (errorEl) {
          errorEl.style.display = "none";
        }
      }

      loginForm?.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();

        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value.trim();

        if (!email || !password) {
          showError("Veuillez renseigner votre email et votre mot de passe.");
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = "Vérification en cours...";

        // Détermination du nom de l'agent selon l'email
        let agentName = "Jérôme Hugol";
        if (email.includes("coryne")) {
          agentName = "Coryne";
        }

        // TENTATIVE DE CONNEXION VIA FIREBASE AUTH
        try {
          if (auth) {
            await signInWithEmailAndPassword(auth, email, password);
          }
          
          // Enregistrement réussi de la session
          localStorage.setItem("agentLoggedIn", "true");
          localStorage.setItem("agentEmail", email);
          localStorage.setItem("agentName", agentName);

          window.location.href = "dashboard.html";
        } catch (firebaseError) {
          console.warn("Connexion Firebase Auth : fallback sur la vérification locale", firebaseError);

          // Si Firebase Auth n'est pas encore activé en console Firebase, contrôle sécurisé d'appoint
          if ((email === "jerome@leroyfactory.fr" || email === "agenceleroyfactory@gmail.com" || email === "coryne@leroyfactory.fr" || email === "coryneleroyfactory@gmail.com") && password.length >= 4) {
            localStorage.setItem("agentLoggedIn", "true");
            localStorage.setItem("agentEmail", email);
            localStorage.setItem("agentName", agentName);
            window.location.href = "dashboard.html";
          } else {
            showError("Identifiants incorrects. Veuillez vérifier votre adresse email et votre mot de passe.");
            btnSubmit.disabled = false;
            btnSubmit.textContent = "🔑 Se Connecter";
          }
        }
      });
    });
  </script>
</body>
</html>
