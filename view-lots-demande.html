<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Demande disponibilité VIEW | LE ROY FACTORY</title><link rel="icon" href="assets/brand-v2/logoLRF.png"><style>
:root{--g:#b58b35;--i:#20201e;--m:#746d62;--l:#e6ded0}*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:var(--i);font-family:Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:18px 0 105px}.back{display:inline-block;margin-bottom:14px;color:#735920;font-weight:850;text-decoration:none}.hero,.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:19px;box-shadow:0 10px 28px #0000000d}.hero{background:linear-gradient(135deg,#fff,#fbf5e9)}.heroTop{display:flex;justify-content:space-between;align-items:center;gap:15px}.hero img{width:130px;height:58px;object-fit:contain}.kicker{color:#947026;font-size:.72rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero h1{margin:7px 0;font:500 clamp(2rem,6vw,3rem)/1 Georgia,serif}.hero p,.meta,.rule,.recipient{color:var(--m)}.card{margin-top:14px}.card h2{margin:0 0 12px;font-size:1.05rem}.client{display:grid;grid-template-columns:1fr 1fr;gap:7px}.items{display:grid;gap:11px}.item{padding:14px;border:1px solid var(--l);border-radius:14px;background:#fffdfa}.itemHead{display:flex;justify-content:space-between;gap:12px}.item h3{margin:0;font-size:1rem}.stock{font-weight:900;color:#76581e}.mode{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.choice{flex:1;min-width:160px;padding:10px;border:1px solid #ddd2bf;border-radius:11px;background:#fff}.choice:has(input:checked){border-color:var(--g);background:#fff9ea}.choice input{accent-color:var(--g)}.paletteBox{display:none;margin-top:10px}.paletteBox.show{display:block}.paletteBox input{width:110px;padding:8px;border:1px solid #d7cebf;border-radius:8px}.rule{margin-top:8px;font-size:.72rem}.comment{width:100%;min-height:110px;padding:12px;border:1px solid #d9d1c4;border-radius:11px;font:inherit}.preview{white-space:pre-wrap;padding:13px;border:1px solid #ebe5dc;border-radius:11px;background:#faf8f3;font-size:.82rem;line-height:1.5}.sendBar{position:fixed;left:50%;bottom:max(9px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(900px,calc(100% - 22px));display:flex;gap:9px;padding:11px;background:#ffffffef;border:1px solid #dcc893;border-radius:16px;box-shadow:0 12px 38px #0002}.btn{min-height:48px;padding:0 15px;border:1px solid #c8a14d;border-radius:11px;background:#fff;color:#5b4823;font-weight:900}.btn.primary{flex:1;background:linear-gradient(135deg,#b58b35,#d4ad59);color:#fff}.empty{text-align:center;padding:28px;color:#777}@media(max-width:650px){.heroTop{align-items:flex-start}.hero img{width:95px}.client{grid-template-columns:1fr}.itemHead{display:block}.stock{display:block;margin-top:6px}.choice{min-width:100%}.sendBar{display:grid;grid-template-columns:1fr 1.4fr}}
</style></head><body><main class="wrap"><a class="back" href="view-lots-septembre-2026.html">← Retour aux lots VIEW</a><section class="hero"><div class="heroTop"><div><div class="kicker">VIEW · Septembre 2026</div><h1>Demande de disponibilité</h1><p>Vérifiez les lots, choisissez la quantité souhaitée et ajoutez votre commentaire.</p></div><img src="assets/img/view.png" alt="VIEW"></div><div id="recipient" class="recipient"></div></section><section class="card"><h2>Client</h2><div id="client" class="client"></div></section><section class="card"><h2>Lots sélectionnés</h2><div id="items" class="items"></div></section><section class="card"><h2>Commentaire</h2><textarea id="comment" class="comment" placeholder="Précision chantier, urgence, livraison souhaitée…"></textarea></section><section class="card"><h2>Aperçu du message</h2><div id="preview" class="preview"></div></section><div class="sendBar"><button id="cancel" class="btn">Retour</button><button id="send" class="btn primary">Envoyer la demande</button></div></main><script type="module">
import { partnerContacts } from './assets/js/partner-contacts.js?v=20260914-bilt1';
const KEY='lrfViewLotsRequestV1';let data=null;try{data=JSON.parse(sessionStorage.getItem(KEY)||'null')}catch(_){}const itemsEl=document.querySelector('#items'),clientEl=document.querySelector('#client'),commentEl=document.querySelector('#comment'),previewEl=document.querySelector('#preview'),send=document.querySelector('#send');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const contacts=partnerContacts('View Ceramica');const alessio=contacts.find(c=>/alessio/i.test(c.name||''));const orders=contacts.find(c=>/commande/i.test(c.role||''));document.querySelector('#recipient').textContent=`Demande préparée pour ${[alessio?.name,orders?.name].filter(Boolean).join(' et ')||'VIEW Ceramica'}.`;
if(!data||!Array.isArray(data.items)||!data.items.length){itemsEl.innerHTML='<div class="empty">Aucun lot sélectionné.</div>';send.disabled=true}else init();
function init(){const c=data.client||{};clientEl.innerHTML=`<div><strong>${esc(c.societe||c.name||'Client professionnel')}</strong></div><div>${esc(c.codeClient||'')}</div>${c.departement?`<div>Département : ${esc(c.departement)}</div>`:''}`;itemsEl.innerHTML=data.items.map((l,i)=>`<article class="item" data-i="${i}"><div class="itemHead"><div><h3>${esc(l.series)} ${esc(l.name)}</h3><div class="meta">Format ${esc(l.format)}</div></div><span class="stock">Stock : ${esc(l.qty)}</span></div><div class="mode"><label class="choice"><input type="radio" name="mode-${i}" value="lot" checked> Lot complet</label>${l.paletteEligible?`<label class="choice"><input type="radio" name="mode-${i}" value="palette"> À la palette</label>`:''}</div>${l.paletteEligible?`<div class="paletteBox"><label>Nombre de palettes <input class="paletteQty" type="number" min="1" value="1"></label></div><div class="rule">Lot supérieur à 2 palettes : commande possible à la palette.</div>`:'<div class="rule">Petit lot : commande du lot complet.</div>'}</article>`).join('');itemsEl.addEventListener('change',e=>{if(e.target.matches('input[type=radio]')){const a=e.target.closest('.item');a.querySelector('.paletteBox')?.classList.toggle('show',e.target.value==='palette')}refresh()});itemsEl.addEventListener('input',refresh);commentEl.addEventListener('input',refresh);refresh()}
function rows(){return(data?.items||[]).map((l,i)=>{const a=itemsEl.querySelector(`[data-i="${i}"]`);const mode=a?.querySelector(`input[name="mode-${i}"]:checked`)?.value||'lot';const palettes=mode==='palette'?Math.max(1,Number(a?.querySelector('.paletteQty')?.value)||1):null;return{...l,mode,palettes}})}
function message(){const c=data.client||{};const lines=rows().map((l,i)=>`${i+1}. ${l.series} ${l.name}\n   Format : ${l.format}\n   Stock annoncé : ${l.qty}\n   Demande : ${l.mode==='palette'?`${l.palettes} palette${l.palettes>1?'s':''}`:'lot complet'}`).join('\n\n');const com=commentEl.value.trim();return`Bonjour,\n\nPouvez-vous nous confirmer la disponibilité des lots VIEW suivants :\n\n${lines}\n\nClient : ${c.societe||c.name||'Client professionnel'}${c.codeClient?`\nCode LRF : ${c.codeClient}`:''}${c.departement?`\nDépartement : ${c.departement}`:''}${com?`\n\nCommentaire :\n${com}`:''}\n\nMerci de nous confirmer la disponibilité ainsi que les conditions d’expédition ou d’enlèvement.\n\nBien cordialement,\nLE ROY FACTORY`}
function refresh(){previewEl.textContent=message()}document.querySelector('#cancel').onclick=()=>history.back();send.onclick=()=>{const to=[alessio?.email,orders?.email].filter(Boolean).join(',');if(!to){alert('Contacts VIEW indisponibles.');return}const subject=`Demande disponibilité VIEW — ${(data.client||{}).societe||'Client'} — ${data.items.length} lot${data.items.length>1?'s':''}`;location.href=`mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message())}`};
</script></body></html>
